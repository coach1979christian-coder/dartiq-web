<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DARTIQ Today's AI Training</title>

<style>
:root{
  --bg:#050b18;
  --panel:#10243a;
  --panel2:#0d2136;
  --accent:#39a9ff;
  --text:#f4fbff;
  --muted:#b8d4ea;
  --line:rgba(57,169,255,.24);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  overflow-x:hidden;
}

body{
  padding:8px;
}

.wrap{
  width:100%;
  max-width:430px;
  margin:0 auto;
  padding:15px;
  border-radius:22px;

  background:
    radial-gradient(circle at 20% 0%,rgba(57,169,255,.08),transparent 30%),
    linear-gradient(180deg,#102844 0%,#081a2d 100%);

  border:1px solid rgba(57,169,255,.48);

  box-shadow:
    0 0 14px rgba(57,169,255,.28),
    0 0 34px rgba(57,169,255,.14),
    inset 0 0 22px rgba(57,169,255,.06);
}

/* HEADER */

.header{
  padding:4px 2px 13px;
  border-bottom:2px solid var(--accent);
}

.kicker{
  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:8px;
}

.header h1{
  font-size:32px;
  line-height:1.05;
  font-weight:900;
  color:#fff;
}

.subtitle{
  margin-top:8px;
  font-size:15px;
  line-height:1.4;
  font-weight:700;
  color:var(--accent);
}

/* STATS */

.stats{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
  margin-top:14px;
}

.card{
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  min-width:0;
  box-shadow:0 0 10px rgba(57,169,255,.07);
}

.label{
  font-size:10px;
  letter-spacing:.7px;
  text-transform:uppercase;
  color:var(--muted);
  font-weight:800;
}

.value{
  margin-top:7px;
  font-size:20px;
  line-height:1.18;
  font-weight:900;
  color:#fff;
  overflow-wrap:break-word;
}

/* EQUIPMENT */

.equipment{
  margin-top:10px;
  background:var(--panel2);
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
}

.equipment .value{
  font-size:15px;
  line-height:1.45;
  color:var(--text);
}

/* STATUS */

.status{
  margin-top:12px;
  min-height:48px;

  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;

  border-radius:14px;

  background:rgba(255,255,255,.045);
  border:1px solid rgba(57,169,255,.20);

  color:#d9eaff;

  font-size:15px;
  font-weight:900;
}

.status.completed{
  background:linear-gradient(90deg,#1662d9,#2389ff);
  border-color:rgba(57,169,255,.55);
  color:#fff;
  box-shadow:0 0 18px rgba(57,169,255,.20);
}

@media(max-width:380px){

  .wrap{
    padding:12px;
  }

  .header h1{
    font-size:28px;
  }

  .value{
    font-size:18px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">

    <div class="kicker">
      DARTIQ · PRACTICE TRAINING
    </div>

    <h1 id="drill">
      Practice Training
    </h1>

    <div class="subtitle" id="focus">
      Focused practice
    </div>

  </div>


  <div class="stats">

    <div class="card">
      <div class="label">
        Difficulty
      </div>

      <div class="value" id="level">
        --
      </div>
    </div>


    <div class="card">
      <div class="label">
        Duration
      </div>

      <div class="value" id="duration">
        --
      </div>
    </div>


    <div class="card">
      <div class="label">
        Rounds
      </div>

      <div class="value" id="rounds">
        --
      </div>
    </div>


    <div class="card">
      <div class="label">
        Main Focus
      </div>

      <div class="value" id="focusShort">
        --
      </div>
    </div>

  </div>


  <div class="equipment" id="equipmentWrap">

    <div class="label">
      Equipment
    </div>

    <div class="value" id="equipment">
      --
    </div>

  </div>


  <div class="status" id="status">
    ◻ Training in progress
  </div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );


function getValue(key,fallback){

  const value =
    params.get(key);

  if(
    value === null ||
    String(value).trim() === ""
  ){
    return fallback;
  }

  try{

    return decodeURIComponent(
      String(value)
        .replace(/\+/g," ")
    ).trim();

  }catch(e){

    return String(value).trim();

  }

}


const drill =
  getValue(
    "drill",
    getValue(
      "practice",
      "Practice Training"
    )
  );

const duration =
  getValue(
    "duration",
    "--"
  );

const rounds =
  getValue(
    "rounds",
    "--"
  );

const level =
  getValue(
    "level",
    "--"
  );

const focus =
  getValue(
    "focus",
    "Focused practice"
  );

const equipment =
  getValue(
    "equipment",
    ""
  );

const completed =
  getValue(
    "completed",
    "false"
  );


document
  .getElementById("drill")
  .textContent =
  drill;


document
  .getElementById("duration")
  .textContent =
  duration;


document
  .getElementById("rounds")
  .textContent =
  rounds;


document
  .getElementById("level")
  .textContent =
  level;


document
  .getElementById("focus")
  .textContent =
  focus;


document
  .getElementById("focusShort")
  .textContent =
  focus;


if(equipment){

  document
    .getElementById("equipment")
    .textContent =
    equipment;

}else{

  document
    .getElementById("equipmentWrap")
    .style.display =
    "none";

}


const status =
  document.getElementById(
    "status"
  );


const isCompleted =
[
  "1",
  "true",
  "yes",
  "done",
  "complete",
  "completed"
]
.includes(
  String(completed)
    .toLowerCase()
    .trim()
);


if(isCompleted){

  status.textContent =
    "✓ Training Completed";

  status.classList.add(
    "completed"
  );

}else{

  status.textContent =
    "◻ Training in progress";

}

</script>

</body>
</html>
