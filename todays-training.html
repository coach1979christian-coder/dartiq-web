
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DARTIQ | Today's AI Training</title>
<style>
:root{
  --bg:#050b18;
  --panel:#10243a;
  --accent:#39a9ff;
  --text:#f4fbff;
  --muted:#a9c2d6;
  --line:rgba(57,169,255,.25);
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}
body{padding:8px}
.wrap{
  width:100%;
  max-width:430px;
  margin:auto;
  padding:18px 14px;
  border:1px solid var(--line);
  border-radius:20px;
  background:linear-gradient(180deg,#0b1e34,#071426);
}
.header{
  text-align:center;
  padding:10px 0 20px;
}
.brand{
  color:var(--accent);
  font-size:11px;
  font-weight:900;
  letter-spacing:1.5px;
}
h1{
  font-size:25px;
  line-height:1.15;
  margin:10px 0 0;
}
.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:15px;
  padding:17px;
  margin-bottom:12px;
}
.label{
  color:var(--accent);
  font-size:11px;
  font-weight:900;
  letter-spacing:.7px;
  text-transform:uppercase;
}
.issue{
  font-size:25px;
  font-weight:900;
  margin:10px 0;
  overflow-wrap:anywhere;
}
.drill{
  color:var(--muted);
  font-size:15px;
  line-height:1.4;
  overflow-wrap:anywhere;
}
.divider{
  height:1px;
  background:var(--line);
  margin:17px 0;
}
.objective{
  font-size:15px;
  line-height:1.55;
  margin-top:10px;
}
.tip{
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
  margin-top:10px;
}
.voice-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}
.voice-status{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  margin:12px 0;
}
.voice-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}
.voice-button{
  padding:12px 8px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#0b2035;
  color:#fff;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}
.voice-button.primary{
  background:var(--accent);
  color:#031322;
}
.start{
  display:block;
  width:100%;
  padding:18px 10px;
  border:0;
  border-radius:12px;
  background:var(--accent);
  color:#031322;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  box-shadow:0 0 16px rgba(57,169,255,.25);
}
.status{
  color:#ffd17a;
  text-align:center;
  font-size:12px;
  margin-top:12px;
}
.footer{
  color:#688ba6;
  font-size:9px;
  text-align:center;
  letter-spacing:1px;
  margin-top:22px;
}
</style>
</head>
<body>

<main class="wrap">

  <header class="header">
    <div class="brand">DARTIQ PERFORMANCE LAB</div>
    <h1>TODAY'S AI TRAINING</h1>
  </header>

  <section class="card">
    <div class="label">Your Training Focus</div>
    <div class="issue" id="issue">Loading...</div>
    <div class="drill" id="drill"></div>

    <div class="divider"></div>

    <div class="label">Your Objective</div>
    <div class="objective" id="objective"></div>
    <div class="tip" id="instruction"></div>
  </section>

  <section class="card">
    <div class="voice-head">
      <div class="label">🔊 AI Voice Coach</div>
      <div class="tip" style="margin:0">Male voice</div>
    </div>

    <div class="voice-status" id="voiceStatus">
      Preparing your training briefing...
    </div>

    <div class="voice-buttons">
      <button class="voice-button primary"
        onclick="speakTraining()">
        ▶ PLAY
      </button>

      <button class="voice-button"
        onclick="stopVoice()">
        ■ STOP
      </button>
    </div>
  </section>

  <button class="start" onclick="startTraining()">
    START PERFORMANCE TRAINING
  </button>

  <div class="status" id="status"></div>

  <footer class="footer">
    DARTIQ · INTELLIGENT DARTS COACHING
  </footer>

</main>

<script>
"use strict";

const params=new URLSearchParams(window.location.search);

function getValue(...keys){
  for(const key of keys){
    const value=params.get(key);
    if(value!==null && value.trim()!==""){
      return value.trim();
    }
  }
  return "";
}

const context={
  session:getValue("session","sessionID"),
  email:getValue("email"),
  player:getValue("player","playerid"),
  userid:getValue("userid"),
  playerName:getValue("playerName","playername","name"),
  language:getValue("language","lang")||"EN",
  source:getValue("source")||"MATCH",

  mainIssue:getValue("mainIssue","mainissue","focus"),
  focus:getValue("focus","mainIssue","mainissue"),

  drill:getValue(
    "drill","recommendedDrill","practice",
    "trainingName","finalTraining"
  ),

  level:getValue("level","difficulty","playerLevel")||"Adaptive",
  duration:getValue("duration","trainingDuration")||"10 Visits",
  rounds:getValue("rounds","trainingRounds")||"10",
  equipment:getValue("equipment"),
  practiceID:getValue("practiceID","practiceId","drillID"),

  advice:getValue("aiAdvice","coachAdvice","advice"),
  objective:getValue("objective","trainingObjective"),
  why:getValue("why","whyThisPractice"),
  execution:getValue("execution","howToPractice"),
  avoid:getValue("avoid","watchFor"),

  coach:getValue("keithcoach","coach")||"Keith Allen Guther",
  rules:getValue("keithrules","rules","trainingRules"),
  primary:getValue("keithprimary","primarymetric","primaryMetric"),
  secondary:getValue(
    "keithsecondary","secondarymetric","secondaryMetric"
  ),
  target:getValue("keithtarget","successtarget","successTarget"),

  red:getValue("keithred","red"),
  orange:getValue("keithorange","orange"),
  yellow:getValue("keithyellow","yellow"),
  green:getValue("keithgreen","green"),

  redAction:getValue("redaction","redAction"),
  orangeAction:getValue("orangeaction","orangeAction"),
  yellowAction:getValue("yellowaction","yellowAction"),
  greenAction:getValue("greenaction","greenAction"),

  improvement:getValue("improvement","coachingLogic")||
    "Intention → Outcome → Decide → Retest",

  track:getValue("track","whatToTrack"),
  reminder:getValue("reminder","afterPractice"),
  nextAction:getValue("nextAction","next"),
  after:getValue("after")
};

const issue=context.mainIssue||context.focus||"Focused Practice";

const fallbackDrills={
  "missing right":"Right-Side Alignment Training",
  "missing left":"Left-Side Alignment Training",
  "missing high":"Vertical Accuracy Training",
  "missing low":"Vertical Accuracy Training",
  "inconsistent grouping":"Grouping Consistency Training",
  "release timing":"Release Timing Training",
  "follow through":"Follow-Through Training",
  "elbow movement":"Elbow Stability Training",
  "body stability":"Body Stability Training",
  "confidence":"Confidence Training"
};

const fallbackObjectives={
  "missing right":"Reduce right-side misses.",
  "missing left":"Reduce left-side misses.",
  "missing high":"Reduce high misses.",
  "missing low":"Reduce low misses.",
  "inconsistent grouping":"Improve dart grouping consistency.",
  "release timing":"Improve release timing consistency.",
  "follow through":"Improve follow-through consistency.",
  "elbow movement":"Improve elbow stability.",
  "body stability":"Improve body stability.",
  "confidence":"Build confidence through repeatable practice."
};

const issueKey=issue.toLowerCase();

const drill=context.drill||
  fallbackDrills[issueKey]||
  "Focused Performance Training";

const objective=context.objective||
  fallbackObjectives[issueKey]||
  "Improve consistency during your training.";

const instruction=context.execution||
  "Complete "+context.duration+
  " of focused practice. Maintain a consistent stance "+
  "and release routine. Track your results.";

document.getElementById("issue").textContent=issue;
document.getElementById("drill").textContent=drill;
document.getElementById("objective").textContent=objective;
document.getElementById("instruction").textContent=instruction;

function voiceText(text){
  return String(text||"")
    .replace(
      /\bD\s*[.\-]?\s*A\s*[.\-]?\s*R\s*[.\-]?\s*T\s*[.\-]?\s*I\s*[.\-]?\s*Q\b/gi,
      "Dartic"
    )
    .replace(/\bDART\s+IQ\b/gi,"Dartic")
    .replace(/\bDARTIQ\b/gi,"Dartic");
}

function selectMaleVoice(){
  if(!("speechSynthesis" in window))return null;

  const voices=speechSynthesis.getVoices();

  const male=
    /microsoft (guy|andrew|david|mark)|google uk english male|\b(ryan|david|daniel|george|brian|andrew|mark|eric|christopher|oliver|thomas|james|matthew|alex|aaron|fred|richard|reed|arthur)\b|\bmale\b/i;

  const female=
    /\b(female|zira|hazel|susan|samantha|victoria|karen|moira|ava|aria|jenny|sonia|natasha|emma|amy|fiona|tessa)\b/i;

  const available=voices.filter(v=>
    /^en([-_]|$)/i.test(v.lang||"") &&
    male.test(v.name||"") &&
    !female.test(v.name||"")
  );

  return available.find(v=>/^en-GB$/i.test(v.lang))||
    available[0]||null;
}

let currentVoice=null;
let voiceStarted=false;
let voiceHasPlayed=false;

function setVoiceStatus(message){
  document.getElementById("voiceStatus").textContent=message;
}

function buildBriefing(){
  const parts=[];

  if(context.playerName){
    parts.push(
      "Welcome "+context.playerName+
      " to the DARTIQ Performance Lab."
    );
  }else{
    parts.push("Welcome to the DARTIQ Performance Lab.");
  }

  parts.push("Your today's AI training.");

  parts.push("Your main focus is "+issue+".");
  parts.push("Your recommended drill is "+drill+".");
  parts.push("Your objective is "+objective);

  if(context.target){
    parts.push("Your success target is "+context.target+".");
  }

  parts.push("When ready, start performance training.");

  return voiceText(parts.join(" "));
}

function speakTraining(){
  if(
    !("speechSynthesis" in window)||
    !("SpeechSynthesisUtterance" in window)
  ){
    setVoiceStatus("Voice is not supported on this device.");
    return;
  }

  currentVoice=selectMaleVoice();

  if(!currentVoice){
    setVoiceStatus(
      "No confirmed male voice is available on this device."
    );
    return;
  }

  speechSynthesis.cancel();

  const utterance=new SpeechSynthesisUtterance(buildBriefing());

  utterance.voice=currentVoice;
  utterance.lang=currentVoice.lang||"en-GB";
  utterance.rate=.92;
  utterance.pitch=.88;
  utterance.volume=1;

  utterance.onstart=()=>{
    voiceHasPlayed=true;
    setVoiceStatus("DARTIQ Voice Coach is speaking...");
  };

  utterance.onend=()=>{
    setVoiceStatus("Briefing complete. Ready to train.");
  };

  utterance.onerror=event=>{
    if(!["canceled","interrupted"].includes(event.error)){
      setVoiceStatus("Tap PLAY to hear your briefing.");
    }
  };

  speechSynthesis.speak(utterance);

  if(speechSynthesis.paused){
    speechSynthesis.resume();
  }
}

function stopVoice(){
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }
  setVoiceStatus("Voice stopped.");
}

function autoStartVoice(){
  if(voiceStarted)return;

  currentVoice=selectMaleVoice();

  if(!currentVoice){
    setVoiceStatus("Tap PLAY when a male voice is available.");
    return;
  }

  voiceStarted=true;
  speakTraining();
}

if("speechSynthesis" in window){
  speechSynthesis.addEventListener?.(
    "voiceschanged",
    ()=>{
      if(!voiceStarted && document.readyState==="complete"){
        autoStartVoice();
      }
    }
  );

  window.addEventListener("load",()=>{
    setTimeout(autoStartVoice,750);
  });

  document.addEventListener("pointerdown",()=>{
    if(!voiceHasPlayed && !speechSynthesis.speaking){
      autoStartVoice();
    }
  },{once:true});
}

function startTraining(){
  stopVoice();

  try{
    const url=new URL(
      "practice-engine.html",
      window.location.href
    );

    const fields={
      session:context.session,
      email:context.email,
      player:context.player,
      userid:context.userid,
      playerName:context.playerName,
      language:context.language,
      source:context.source,

      mainIssue:context.mainIssue,
      focus:context.focus,
      drill:context.drill||drill,
      recommendedDrill:context.drill||drill,

      level:context.level,
      difficulty:context.level,
      duration:context.duration,
      rounds:context.rounds,
      equipment:context.equipment,
      practiceID:context.practiceID,

      aiAdvice:context.advice,
      coachAdvice:context.advice,
      objective:context.objective||objective,
      why:context.why,
      execution:context.execution,
      avoid:context.avoid,

      keithcoach:context.coach,
      keithrules:context.rules,
      keithprimary:context.primary,
      keithsecondary:context.secondary,
      keithtarget:context.target,

      keithred:context.red,
      keithorange:context.orange,
      keithyellow:context.yellow,
      keithgreen:context.green,

      redaction:context.redAction,
      orangeaction:context.orangeAction,
      yellowaction:context.yellowAction,
      greenaction:context.greenAction,

      improvement:context.improvement,
      track:context.track,
      reminder:context.reminder,
      nextAction:context.nextAction,
      after:context.after
    };

    for(const [key,value] of Object.entries(fields)){
      if(
        value!==undefined &&
        value!==null &&
        String(value).trim()!==""
      ){
        url.searchParams.set(key,String(value));
      }
    }

    document.getElementById("status").textContent=
      "Opening DARTIQ Performance Lab...";

    window.location.assign(url.toString());

  }catch(error){
    console.error("DARTIQ navigation error:",error);

    document.getElementById("status").textContent=
      "Unable to open DARTIQ Performance Lab.";
  }
}

window.addEventListener("beforeunload",()=>{
  if("speechSynthesis" in window){
    speechSynthesis.cancel();
  }
});
</script>
</body>
</html>
