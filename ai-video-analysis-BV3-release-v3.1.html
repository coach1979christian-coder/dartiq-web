<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARTIQ AI Video Analysis</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#06111d;
  font-family:Arial,sans-serif;
  color:#fff;
  display:flex;
  justify-content:center;
  align-items:flex-start;
  min-height:100vh;
  padding:20px 0
}
.card{
  width:420px;
  max-width:95%;
  background:#0f1c2f;
  border:1px solid #1ea7ff;
  border-radius:22px;
  padding:24px;
  box-shadow:0 0 30px rgba(0,170,255,.35)
}
h1{
  margin:0 0 8px;
  text-align:center;
  color:#66cfff;
  font-size:28px
}
.subtitle{
  text-align:center;
  color:#c8d5e6;
  margin-bottom:22px
}
input[type=file]{
  width:100%;
  padding:12px;
  background:#091523;
  color:#fff;
  border:1px solid #2d4c68;
  border-radius:12px;
  margin-bottom:18px
}
video{
  display:none;
  width:100%;
  max-height:440px;
  background:#000;
  border-radius:16px;
  margin-bottom:18px
}
button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  font-size:19px;
  font-weight:700;
  color:#fff;
  background:#1478b8;

button:disabled{
  opacity:.45;
  cursor:not-allowed
}
.status{
  min-height:24px;
  margin:18px 0 0;
  text-align:center;
  font-size:16px;
  font-weight:700
}
.error{color:#ff8383}
.success{color:#7ee7ff}
.results{
  display:none;
  margin-top:20px;
  padding:16px;
  border:1px solid #2c658c;
  border-radius:16px;
  background:#0a1727
}
.result-row{
  display:flex;
  justify-content:space-between;
  gap:14px;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.12)
}
.result-row:last-child{border-bottom:0}
.result-label{color:#b7c6d8}
.result-value{
  color:#5bcaff;
  font-weight:700;
  text-align:right
}
.hidden-canvas{display:none}
</style>
</head>
<body>
<div class="card">
  <h1>DARTIQ AI Video Analysis</h1>
  <div id="buildVersion" style="font-size:12px;opacity:.72;margin-top:4px">BV3 RELEASE ENGINE v3.6</div>
  <div class="subtitle">Select your throw video</div>

  <input id="videoInput" type="file" accept="video/*">
  <video id="videoPreview" controls playsinline preload="metadata"></video>

  <button id="analyzeBtn" disabled>Analyze My Throw</button>
  <div id="status" class="status">Loading analysis engine...</div>

  <div id="results" class="results">
    <div class="result-row">
      <span class="result-label">Frames checked</span>
      <span class="result-value" id="framesChecked">0</span>
    </div>
    <div class="result-row">
      <span class="result-label">Pose detected</span>
      <span class="result-value" id="poseFrames">0</span>
    </div>
    <div class="result-row">
      <span class="result-label">Detection quality</span>
      <span class="result-value" id="detectionQuality">Waiting</span>
    </div>
    <div class="result-row">
      <span class="result-label">Release frame</span>
      <span class="result-value" id="releaseFrame">Waiting</span>
    </div>
    <div class="result-row">
      <span class="result-label">Release time</span>
      <span class="result-value" id="releaseTime">Waiting</span>
    </div>
    <div class="result-row">
      <span class="result-label">Release confidence</span>
      <span class="result-value" id="releaseConfidence">Waiting</span>
    </div>
  </div>

  <canvas id="analysisCanvas" class="hidden-canvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script type="module">
import {
  FilesetResolver,
  PoseLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";

const SUPABASE_URL = "https://usglrseckxwcdykrwuvh.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_mSQ3imYCnUspBJdpl6ybQA__TdZtZ2a";
const STORAGE_BUCKET = "Throw videos";
const BUILD_VERSION = "BV3-RELEASE-v3.6-2026-07-27";
console.info(BUILD_VERSION);
const TABLE_NAME = "video_analysis";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);

const params = new URLSearchParams(window.location.search);
const playerEmail = (
  params.get("email") ||
  params.get("Email") ||
  params.get("player_email") ||
  params.get("Player_Email") ||
  ""
).trim();

const videoInput = document.getElementById("videoInput");
const videoPreview = document.getElementById("videoPreview");
const analyzeBtn = document.getElementById("analyzeBtn");
const statusElement = document.getElementById("status");
const resultsElement = document.getElementById("results");
const framesCheckedElement = document.getElementById("framesChecked");
const poseFramesElement = document.getElementById("poseFrames");
const detectionQualityElement = document.getElementById("detectionQuality");
const releaseFrameElement = document.getElementById("releaseFrame");
const releaseTimeElement = document.getElementById("releaseTime");
const releaseConfidenceElement = document.getElementById("releaseConfidence");
const canvas = document.getElementById("analysisCanvas");
const ctx = canvas.getContext("2d", { willReadFrequently:true });

let poseLandmarker = null;
let selectedFile = null;
let selectedVideoUrl = null;

function setStatus(message, type=""){
  statusElement.textContent = message;
  statusElement.className = "status";
  if(type) statusElement.classList.add(type);
}

function cleanObjectUrl(){
  if(selectedVideoUrl){
    URL.revokeObjectURL(selectedVideoUrl);
    selectedVideoUrl = null;
  }
}

async function loadPoseLandmarker(){
  try{
    setStatus("Loading analysis engine...");
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    poseLandmarker = await PoseLandmarker.createFromOptions(vision,{
      baseOptions:{
        modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO",
      numPoses:1,
      minPoseDetectionConfidence:0.45,
      minPosePresenceConfidence:0.45,
      minTrackingConfidence:0.45
    });

    setStatus("Analysis engine ready.","success");
    if(selectedFile) analyzeBtn.disabled = false;
  }catch(firstError){
    try{
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

      poseLandmarker = await PoseLandmarker.createFromOptions(vision,{
        baseOptions:{
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task"
        },
        runningMode:"VIDEO",
        numPoses:1,
        minPoseDetectionConfidence:0.4,
        minPosePresenceConfidence:0.4,
        minTrackingConfidence:0.4
      });

      setStatus("Analysis engine ready.","success");
      if(selectedFile) analyzeBtn.disabled = false;
    }catch(error){
      console.error(error);
      setStatus("Could not load the analysis engine.","error");
    }
  }
}

videoInput.addEventListener("change",()=>{
  cleanObjectUrl();
  selectedFile = videoInput.files?.[0] || null;
  resultsElement.style.display = "none";
  framesCheckedElement.textContent = "0";
  poseFramesElement.textContent = "0";
  detectionQualityElement.textContent = "Waiting";
  releaseFrameElement.textContent = "Waiting";
  releaseTimeElement.textContent = "Waiting";
  releaseConfidenceElement.textContent = "Waiting";

  if(!selectedFile){
    videoPreview.removeAttribute("src");
    videoPreview.style.display = "none";
    analyzeBtn.disabled = true;
    return;
  }

  if(!selectedFile.type.startsWith("video/")){
    selectedFile = null;
    videoInput.value = "";
    videoPreview.style.display = "none";
    analyzeBtn.disabled = true;
    setStatus("Please select a valid video file.","error");
    return;
  }

  selectedVideoUrl = URL.createObjectURL(selectedFile);
  videoPreview.src = selectedVideoUrl;
  videoPreview.style.display = "block";
  videoPreview.load();

  analyzeBtn.disabled = !poseLandmarker;
  setStatus(
    poseLandmarker ? "Video ready for analysis." : "Loading analysis engine..."
  );
});

function waitForMetadata(){
  return new Promise((resolve,reject)=>{
    if(
      videoPreview.readyState >= 1 &&
      Number.isFinite(videoPreview.duration) &&
      videoPreview.duration > 0
    ){
      resolve();
      return;
    }

    const timeout = setTimeout(()=>{
      reject(new Error("Video loading timed out."));
    },20000);

    videoPreview.addEventListener("loadedmetadata",()=>{
      clearTimeout(timeout);
      resolve();
    },{once:true});

    videoPreview.load();
  });
}

function seekVideo(time){
  return new Promise((resolve,reject)=>{
    const timeout = setTimeout(()=>{
      reject(new Error("Could not read a video frame."));
    },12000);

    const done = ()=>{
      clearTimeout(timeout);
      resolve();
    };

    videoPreview.addEventListener("seeked",done,{once:true});
    videoPreview.currentTime = Math.min(
      Math.max(0,time),
      Math.max(0,videoPreview.duration - 0.02)
    );
  });
}

function averageVisibility(landmarks){
  if(!Array.isArray(landmarks) || landmarks.length === 0) return 0;
  const values = landmarks
    .map(p=>Number.isFinite(p.visibility) ? p.visibility : 0)
    .filter(Number.isFinite);
  if(values.length === 0) return 0;
  return values.reduce((a,b)=>a+b,0) / values.length;
}

function calculateTechniqueScore(poseFrames,framesChecked,visibilityTotal){
  if(framesChecked === 0 || poseFrames === 0) return 0;
  const poseRatio = poseFrames / framesChecked;
  const avgVisibility = visibilityTotal / poseFrames;
  return Math.max(
    0,
    Math.min(100,Math.round((poseRatio * 70) + (avgVisibility * 30)))
  );
}


function pointDistance(a,b){
  if(!a || !b) return 0;
  const dx=(a.x||0)-(b.x||0);
  const dy=(a.y||0)-(b.y||0);
  return Math.hypot(dx,dy);
}

function detectThrowingArm(keypoints){
  const scoreArm=(wristIndex)=>{
    let movement=0;
    let visible=0;
    for(let i=1;i<keypoints.length;i++){
      const prev=keypoints[i-1].landmarks?.[wristIndex];
      const curr=keypoints[i].landmarks?.[wristIndex];
      if(!prev || !curr) continue;
      movement+=pointDistance(prev,curr);
      visible+=((prev.visibility||0)+(curr.visibility||0))/2;
    }
    return movement+(visible*0.02);
  };

  const leftScore=scoreArm(15);
  const rightScore=scoreArm(16);
  return rightScore>=leftScore
    ? {side:"Right",wristIndex:16,elbowIndex:14,shoulderIndex:12}
    : {side:"Left",wristIndex:15,elbowIndex:13,shoulderIndex:11};
}

function detectReleasePoint(keypoints){
  if(!Array.isArray(keypoints) || keypoints.length<5){
    return {
      releaseFrame:null,
      releaseTimeMs:null,
      releaseConfidence:"Low",
      throwingArm:"Unknown",
      peakVelocity:0
    };
  }

  const arm=detectThrowingArm(keypoints);
  const velocitySamples=[];

  for(let i=1;i<keypoints.length;i++){
    const previous=keypoints[i-1];
    const current=keypoints[i];
    const previousWrist=previous.landmarks?.[arm.wristIndex];
    const currentWrist=current.landmarks?.[arm.wristIndex];
    if(!previousWrist || !currentWrist) continue;

    const dt=Math.max(0.001,current.time_seconds-previous.time_seconds);
    velocitySamples.push({
      index:i,
      velocity:pointDistance(previousWrist,currentWrist)/dt,
      visibility:Math.min(Number(previousWrist.visibility||0),Number(currentWrist.visibility||0)),
      frame:current.frame,
      timeSeconds:current.time_seconds
    });
  }

  if(velocitySamples.length<5){
    return {
      releaseFrame:null,
      releaseTimeMs:null,
      releaseConfidence:"Low",
      throwingArm:arm.side,
      peakVelocity:0
    };
  }

  let bestIndex=2;
  let bestScore=-Infinity;

  for(let i=2;i<velocitySamples.length-2;i++){
    const before=velocitySamples[i-1];
    const current=velocitySamples[i];
    const after=velocitySamples[i+1];
    const acceleration=current.velocity-before.velocity;
    const deceleration=current.velocity-after.velocity;
    const score=(current.velocity*0.50)+(Math.max(0,acceleration)*0.30)+(Math.max(0,deceleration)*0.20)+(current.visibility*0.05);
    if(score>bestScore){
      bestScore=score;
      bestIndex=i;
    }
  }

  const selectedIndex=Math.max(0,bestIndex-1);
  const selected=velocitySamples[selectedIndex];
  const velocities=velocitySamples.map(sample=>sample.velocity).sort((a,b)=>a-b);
  const median=velocities[Math.floor(velocities.length/2)]||0;
  const ratio=median>0 ? velocitySamples[bestIndex].velocity/median : 0;

  let releaseConfidence="Low";
  if(selected.visibility>=0.70 && ratio>=1.60) releaseConfidence="High";
  else if(selected.visibility>=0.45 && ratio>=1.25) releaseConfidence="Medium";

 return {
    releaseFrame:selected.frame,
    releaseTimeMs:Math.round(selected.timeSeconds*1000),
    releaseConfidence,
    throwingArm:arm.side,
    peakVelocity:Number(velocitySamples[bestIndex].velocity.toFixed(4))
};
}

function angle3Points(a,b,c){
  if(!a||!b||!c) return null;

  const abx=a.x-b.x;
  const aby=a.y-b.y;
  const cbx=c.x-b.x;
  const cby=c.y-b.y;

  const dot=abx*cbx+aby*cby;
  const mag1=Math.hypot(abx,aby);
  const mag2=Math.hypot(cbx,cby);

  if(mag1===0||mag2===0) return null;

  const cos=Math.max(-1,Math.min(1,dot/(mag1*mag2)));
  return Math.acos(cos)*180/Math.PI;
}

function calculateElbowAngle(frame,arm){
  return angle3Points(
    frame.landmarks[arm.shoulderIndex],
    frame.landmarks[arm.elbowIndex],
    frame.landmarks[arm.wristIndex]
  );
}

function calculateShoulderAngle(frame,arm){
  const hipIndex=arm.side==="Right"?24:23;

  return angle3Points(
    frame.landmarks[hipIndex],
    frame.landmarks[arm.shoulderIndex],
    frame.landmarks[arm.elbowIndex]
  );
}

function calculateWristAngle(frame,arm){
  const handIndex=arm.side==="Right"?20:19;

  return angle3Points(
    frame.landmarks[arm.elbowIndex],
    frame.landmarks[arm.wristIndex],
    frame.landmarks[handIndex]
  );
}

function calculateArmExtension(frame,arm){
  return pointDistance(
    frame.landmarks[arm.shoulderIndex],
    frame.landmarks[arm.wristIndex]
  );
}

function calculateHeadMovement(keypoints){
  if(keypoints.length<2) return 100;

  let total=0;

  for(let i=1;i<keypoints.length;i++){
    total+=pointDistance(
      keypoints[i-1].landmarks[0],
      keypoints[i].landmarks[0]
    );
  }

  return Math.max(0,Math.min(100,Math.round(100-(total/(keypoints.length-1))*900)));
}

function calculateBodyStability(keypoints){
  if(keypoints.length<2) return 100;

  let total=0;

  for(let i=1;i<keypoints.length;i++){

    const p1={
      x:(keypoints[i-1].landmarks[11].x+keypoints[i-1].landmarks[12].x)/2,
      y:(keypoints[i-1].landmarks[11].y+keypoints[i-1].landmarks[12].y)/2
    };

    const p2={
      x:(keypoints[i].landmarks[11].x+keypoints[i].landmarks[12].x)/2,
      y:(keypoints[i].landmarks[11].y+keypoints[i].landmarks[12].y)/2
    };

    total+=pointDistance(p1,p2);
  }

  return Math.max(0,Math.min(100,Math.round(100-(total/(keypoints.length-1))*750)));
}

function calculateThrowConsistency(values){
  if(values.length<2) return 100;

  const mean=values.reduce((a,b)=>a+b,0)/values.length;
  const variance=values.reduce((s,v)=>s+(v-mean)*(v-mean),0)/values.length;
  const std=Math.sqrt(variance);

  return Math.max(0,Math.min(100,Math.round(100-std*2)));
}

function calculateFollowThrough(keypoints,releaseFrame,arm){

  if(releaseFrame===null) return null;

  const idx=keypoints.findIndex(f=>f.frame===releaseFrame);
  if(idx<0) return null;

  const start=calculateElbowAngle(keypoints[idx],arm);
  const finish=calculateElbowAngle(
    keypoints[Math.min(idx+6,keypoints.length-1)],
    arm
  );

  if(start===null||finish===null) return null;

  return Math.max(0,Math.min(100,Math.round(100-Math.abs(finish-start))));
}
async function analyzeVideo(){
  await waitForMetadata();
  const duration=Number(videoPreview.duration);
  if(!Number.isFinite(duration)||duration<=0) throw new Error("The selected video could not be loaded.");
  canvas.width=Math.max(1,videoPreview.videoWidth);
  canvas.height=Math.max(1,videoPreview.videoHeight);
  let framesChecked=0,framesWithPose=0,visibilityTotal=0;
 const keypoints=[];

const armMetrics={
  elbowAngles:[],
  shoulderAngles:[],
  wristAngles:[],
  armExtensions:[]
};
  const sampleInterval=0.10;
  const maxFrames=90;
  videoPreview.pause();
  for(let t=0;t<=duration&&framesChecked<maxFrames;t+=sampleInterval){
    await seekVideo(t);
    if(videoPreview.readyState<2) continue;
    try{
      ctx.drawImage(videoPreview,0,0,canvas.width,canvas.height);
      const result=poseLandmarker.detectForVideo(canvas,Math.max(1,Math.round(videoPreview.currentTime*1000)));
      framesChecked++;
      if(result.landmarks?.length){
        framesWithPose++;
        const landmarks=result.landmarks[0];
        visibilityTotal+=averageVisibility(landmarks);
        keypoints.push({frame:framesChecked,time_seconds:Number(videoPreview.currentTime.toFixed(3)),landmarks});
      }const arm=detectThrowingArm(keypoints);

const currentFrame=keypoints[keypoints.length-1];

const elbow=calculateElbowAngle(currentFrame,arm);
const shoulder=calculateShoulderAngle(currentFrame,arm);
const wrist=calculateWristAngle(currentFrame,arm);
const extension=calculateArmExtension(currentFrame,arm);

if(elbow!==null) armMetrics.elbowAngles.push(elbow);
if(shoulder!==null) armMetrics.shoulderAngles.push(shoulder);
if(wrist!==null) armMetrics.wristAngles.push(wrist);
if(extension!==null) armMetrics.armExtensions.push(extension);
      framesCheckedElement.textContent=String(framesChecked);
      poseFramesElement.textContent=String(framesWithPose);
      resultsElement.style.display="block";
    }catch(e){
      console.warn("Frame skipped",e);
    }
  }
  const detectionPercentage=framesChecked?Math.round((framesWithPose/framesChecked)*100):0;
  let quality="No pose detected";
  if(detectionPercentage>=80) quality="Excellent";
  else if(detectionPercentage>=60) quality="Good";
  else if(detectionPercentage>=30) quality="Limited";
  const techniqueScore=calculateTechniqueScore(framesWithPose,framesChecked,visibilityTotal);
  const release=detectReleasePoint(keypoints);
const arm=detectThrowingArm(keypoints);

const elbowAverage =
  armMetrics.elbowAngles.length
    ? Math.round(
        armMetrics.elbowAngles.reduce((a,b)=>a+b,0) /
        armMetrics.elbowAngles.length
      )
    : null;

const shoulderAverage =
  armMetrics.shoulderAngles.length
    ? Math.round(
        armMetrics.shoulderAngles.reduce((a,b)=>a+b,0) /
        armMetrics.shoulderAngles.length
      )
    : null;

const wristAverage =
  armMetrics.wristAngles.length
    ? Math.round(
        armMetrics.wristAngles.reduce((a,b)=>a+b,0) /
        armMetrics.wristAngles.length
      )
    : null;

const extensionAverage =
  armMetrics.armExtensions.length
    ? Number(
        (
          armMetrics.armExtensions.reduce((a,b)=>a+b,0) /
          armMetrics.armExtensions.length
        ).toFixed(3)
      )
    : null;

const throwConsistency =
  calculateThrowConsistency(armMetrics.elbowAngles);

const headMovementScore =
  calculateHeadMovement(keypoints);

const bodyStabilityScore =
  calculateBodyStability(keypoints);

const followThroughScore =
  calculateFollowThrough(
    keypoints,
    release.releaseFrame,
    arm
  );
  detectionQualityElement.textContent=quality;
  releaseFrameElement.textContent=release.releaseFrame ?? "Not detected";
  releaseTimeElement.textContent=release.releaseTimeMs !== null
    ? `${release.releaseTimeMs} ms`
    : "Not detected";
  releaseConfidenceElement.textContent=release.releaseConfidence;

  return {
    framesChecked,
    framesWithPose,
    detectionPercentage,
    quality,
    techniqueScore,
    mainIssue:release.releaseFrame !== null ? "Release detected" : "No release detected",
    keypoints,
    releaseFrame:release.releaseFrame,
    releaseTimeMs:release.releaseTimeMs,
    releaseConfidence:release.releaseConfidence,
    throwingArm:release.throwingArm,
    peakWristVelocity:release.peakVelocity
  };
}

async function uploadVideo(file,analysisResult){
  setStatus("Analysis complete. Uploading video...");

  if(
    analysisResult.releaseFrame === null ||
    analysisResult.releaseTimeMs === null ||
    !analysisResult.releaseConfidence
  ){
    throw new Error("Release detection produced no saveable result.");
  }

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const emailFolder = playerEmail
    ? playerEmail.replace(/[^a-zA-Z0-9@._-]/g,"_")
    : "unknown-player";

  const filename = `${emailFolder}/${Date.now()}_${safeName}`;

  const {error:uploadError} = await supabaseClient.storage
    .from(STORAGE_BUCKET)
    .upload(filename,file,{
      cacheControl:"3600",
      upsert:false,
      contentType:file.type || "video/mp4"
    });

  if(uploadError) throw uploadError;

 , const {data:publicUrlData} = supabaseClient.storage
    .from(STORAGE_BUCKET)
    .getPublicUrl(filename);

  const videoUrl = publicUrlData?.publicUrl;
  if(!videoUrl) throw new Error("Could not create video URL.");

  const detailedRow = {
    Player_Email:playerEmail,
    video_url:videoUrl,
    technique_score:analysisResult.techniqueScore,
    main_issue:analysisResult.mainIssue,
    confidence_score:analysisResult.detectionPercentage,
    status:"Release detected",
    analysis_complete:true,
    frames_checked:analysisResult.framesChecked,
    pose_detected:analysisResult.framesWithPose,
    detection_percentage:analysisResult.detectionPercentage,
    release_frame:analysisResult.releaseFrame,
    release_time_ms:analysisResult.releaseTimeMs,
    release_confidence:analysisResult.releaseConfidence,
    release_timing:`${analysisResult.releaseTimeMs} ms`,
    wrist_angle:null,
    shoulder_angle:null,
    arm_extension:null,
    throw_consistency:null,
    elbow_angle:null,
    head_movement_score:null,
    body_stability_score:null,
    follow_through_score:null
  };

  const {data:savedRows,error:insertError} = await supabaseClient
    .from(TABLE_NAME)
    .insert([detailedRow])
    .select("id,release_frame,release_time_ms,release_confidence,main_issue,status");

  if(insertError){
    throw new Error(`Supabase metric save failed: ${insertError.message}`);
  }

  const saved = Array.isArray(savedRows) ? savedRows[0] : savedRows;

  if(
    !saved ||
    saved.release_frame === null ||
    saved.release_time_ms === null ||
    !saved.release_confidence
  ){
    throw new Error("Supabase returned an incomplete release-analysis row.");
  }

  return {detailedMetricsSaved:true,saved};
}

analyzeBtn.addEventListener("click",async()=>{
  if(!selectedFile || !poseLandmarker) return;

  analyzeBtn.disabled = true;
  videoInput.disabled = true;

  try{
    if(!playerEmail){
      throw new Error(
        "Player email is missing. Add ?email=SIGNED_IN_USER_EMAIL to the Glide web embed URL."
      );
    }

    const analysisResult = await analyzeVideo();
    const saveResult = await uploadVideo(selectedFile,analysisResult);

    releaseFrameElement.textContent = String(saveResult.saved.release_frame);
    releaseTimeElement.textContent = `${saveResult.saved.release_time_ms} ms`;
    releaseConfidenceElement.textContent = saveResult.saved.release_confidence;
    setStatus("BV3 release analysis saved and verified.","success");
  }catch(error){
    console.error(error);
    setStatus(error?.message || "Analysis failed.","error");
  }finally{
    analyzeBtn.disabled = false;
    videoInput.disabled = false;
  }
});

window.addEventListener("beforeunload",cleanObjectUrl);

loadPoseLandmarker();
</script>
</body>
</html>
