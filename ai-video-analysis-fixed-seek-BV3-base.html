function waitForMetadata(){
  return new Promise((resolve,reject)=>{
    if(
      analysisVideo.readyState >= 1 &&
      Number.isFinite(analysisVideo.duration) &&
      analysisVideo.duration > 0
    ){
      resolve();
      return;
    }

    const timeout = setTimeout(()=>{
      reject(new Error("Video loading timed out."));
    },20000);

    analysisVideo.addEventListener("loadedmetadata",()=>{
      clearTimeout(timeout);
      resolve();
    },{once:true});

    analysisVideo.load();
  });
}
function seekVideo(time){
  return new Promise((resolve,reject)=>{
    const timeout = setTimeout(()=>{
      cleanup();
      reject(new Error("Could not read a video frame."));
    },12000);

    function cleanup(){
      clearTimeout(timeout);
      analysisVideo.removeEventListener("seeked", onSeeked);
      analysisVideo.removeEventListener("canplay", onCanPlay);
    }

    function onCanPlay(){
      cleanup();
      resolve();
    }

    function onSeeked(){
      if(analysisVideo.readyState >= 2){
        cleanup();
        resolve();
      }
    }

    analysisVideo.addEventListener("seeked", onSeeked);
    analysisVideo.addEventListener("canplay", onCanPlay);

    analysisVideo.currentTime = Math.min(
      Math.max(0, time),
      Math.max(0, analysisVideo.duration - 0.02)
    );
  });
}
function averageVisibility(landmarks){
  if(!Array.isArray(landmarks) || landmarks.length === 0) return 0;
  const values = landmarks
    .map(p=>Number.isFinite(p.visibility) ? p.visibility : 0)
    .filter(Number.isFinite);
  if(values.length === 0) return 0;
  return values.reduce((a,b)=>a+b,0) / values.length;
}

function calculateTechniqueScore(poseFrames,framesChecked,visibilityTotal){
  if(framesChecked === 0 || poseFrames === 0) return 0;
  const poseRatio = poseFrames / framesChecked;
  const avgVisibility = visibilityTotal / poseFrames;
  return Math.max(
    0,
    Math.min(100,Math.round((poseRatio * 70) + (avgVisibility * 30)))
  );
}

async function analyzeVideo(){
  await waitForMetadata();

  const duration = analysisVideo.duration;
  const videoWidth = analysisVideo.videoWidth;
  const videoHeight = analysisVideo.videoHeight;

  if(!Number.isFinite(duration) || duration <= 0){
    throw new Error("Invalid video duration.");
  }

  canvas.width = videoWidth;
  canvas.height = videoHeight;

  analysisVideo.pause();

  let framesChecked = 0;
  let framesWithPose = 0;
  let visibilityTotal = 0;
  const keypoints = [];

  const frameCount = 10;

  for(let i = 0; i < frameCount; i++){

    const targetTime =
      frameCount === 1
        ? 0
        : (duration * i) / (frameCount - 1);

    await seekVideo(targetTime);

    if(analysisVideo.readyState < 2) continue;

    try{

      ctx.drawImage(
        analysisVideo,
        0,
        0,
        canvas.width,
        canvas.height
      );

      const result = poseLandmarker.detectForVideo(
        canvas,
        Math.max(
          1,
          Math.round(analysisVideo.currentTime * 1000)
        )
      );

      framesChecked++;

      if(result.landmarks?.length){

        framesWithPose++;

        const landmarks = result.landmarks[0];

        visibilityTotal += averageVisibility(landmarks);

        keypoints.push({
          frame: framesChecked,
          time_seconds: Number(
            analysisVideo.currentTime.toFixed(3)
          ),
          landmarks,

          nose: landmarks[0],
          leftShoulder: landmarks[11],
          rightShoulder: landmarks[12],
          leftElbow: landmarks[13],
          rightElbow: landmarks[14],
          leftWrist: landmarks[15],
          rightWrist: landmarks[16],
          leftHip: landmarks[23],
          rightHip: landmarks[24]
        });

        framesCheckedElement.textContent =
          String(framesChecked);

        poseFramesElement.textContent =
          String(framesWithPose);

        resultsElement.style.display = "block";
      }

    }catch(e){
      console.warn("Frame skipped",e);
    }
  }
  const detectionPercentage=framesChecked?Math.round((framesWithPose/framesChecked)*100):0;
  let quality="No pose detected";
  if(detectionPercentage>=80) quality="Excellent";
  else if(detectionPercentage>=60) quality="Good";
  else if(detectionPercentage>=30) quality="Limited";
  const techniqueScore=calculateTechniqueScore(framesWithPose,framesChecked,visibilityTotal);
  detectionQualityElement.textContent=quality;
const releaseFrame =
  keypoints.length > 0
    ? keypoints.reduce((best, current) =>
        current.rightWrist.x > best.rightWrist.x ? current : best
      )
    : null;
const technique_score = releaseFrame
  ? Math.max(
      0,
      Math.min(
        100,
        Math.round(
          (detectionPercentage * 0.55) +
          25 +
          Math.min(20, framesWithPose * 2)
        )
      )
    )
  : Math.max(
      0,
      Math.min(
        100,
        Math.round(detectionPercentage * 0.55)
      )
    );
return {
  releaseFrame,
  framesChecked,
  framesWithPose,
  detectionPercentage,
  quality,
  technique_score: technique_score,
  mainIssue: releaseFrame
    ? "Release frame detected"
    : "No release frame detected",
  keypoints
};
}

    }catch(glideError){
      console.error(
        "Glide webhook failed:",
        glideError
      );
    }
  }else{
    console.warn("No Glide row_id supplied in URL.");
  }

  return {
    detailedMetricsSaved:true,
    warning:null
  };
}
  console.error("Detailed database insert failed:", detailedInsertError);

  const coreRow = {
    Player_Email:playerEmail || null,
    video_url:videoUrl,
    technique_score:analysisResult.technique_Score,
    main_issue:analysisResult.mainIssue,
    confidence_score:analysisResult.detectionPercentage,
    status:finalStatus
  };

  const {error:coreInsertError} = await supabaseClient
    .from(TABLE_NAME)
    .insert(coreRow);

  if(coreInsertError){
    throw new Error(
      `Detailed insert failed: ${detailedInsertError.message}. ` +
      `Core insert also failed: ${coreInsertError.message}`
    );
  }

  return {
    detailedMetricsSaved:false,
    warning:detailedInsertError.message
  };
}
