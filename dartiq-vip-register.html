
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">

  <title>DARTIQ | Train Smarter. Play Better.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    h1 {
      color: #27b8ff;
      font-size: clamp(48px, 12vw, 90px);
      margin-bottom: 10px;
      text-shadow: 0 0 25px rgba(39,184,255,0.3);
    }

    h2 {
      font-size: clamp(22px, 5vw, 38px);
    }

    p {
      color: #b9cde0;
      max-width: 550px;
      line-height: 1.7;
    }

    .vip-button {
      display: inline-block;
      background: #27b8ff;
      color: #07111f;
      padding: 16px 28px;
      border-radius: 8px;
      font-weight: bold;
      text-decoration: none;
      margin-top: 25px;
      transition: background 0.2s, transform 0.2s;
    }

    .vip-button:hover {
      background: #68d0ff;
      transform: translateY(-2px);
    }

    .vip-button:focus-visible {
      outline: 3px solid white;
      outline-offset: 4px;
    }
  </style>
</head>

<body>

  <main>

    <h1>DARTIQ</h1>

    <p>

    </p>

    <a
      class="vip-button"

</body>
</html>
