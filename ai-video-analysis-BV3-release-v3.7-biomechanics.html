function waitForMetadata(){
  return new Promise((resolve,reject)=>{
    if(
      videoPreview.readyState >= 1 &&
      Number.isFinite(videoPreview.duration) &&
      videoPreview.duration > 0
    ){
      resolve();
      return;
    }

    const timeout = setTimeout(()=>{
      reject(new Error("Video loading timed out."));
    },20000);

    videoPreview.addEventListener("loadedmetadata",()=>{
      clearTimeout(timeout);
      resolve();
    },{once:true});

    videoPreview.load();
  });
}

function seekVideo(time){
  return new Promise((resolve,reject)=>{
    const timeout = setTimeout(()=>{
      reject(new Error("Could not read a video frame."));
    },12000);

    const done = ()=>{
      clearTimeout(timeout);
      resolve();
    };

    videoPreview.addEventListener("seeked",done,{once:true});
    videoPreview.currentTime = Math.min(
      Math.max(0,time),
      Math.max(0,videoPreview.duration - 0.02)
    );
  });
}

function averageVisibility(landmarks){
  if(!Array.isArray(landmarks) || landmarks.length === 0) return 0;
  const values = landmarks
    .map(p=>Number.isFinite(p.visibility) ? p.visibility : 0)
    .filter(Number.isFinite);
  if(values.length === 0) return 0;
  return values.reduce((a,b)=>a+b,0) / values.length;
}

function calculateTechniqueScore(poseFrames,framesChecked,visibilityTotal){
  if(framesChecked === 0 || poseFrames === 0) return 0;
  const poseRatio = poseFrames / framesChecked;
  const avgVisibility = visibilityTotal / poseFrames;
  return Math.max(
    0,
    Math.min(100,Math.round((poseRatio * 70) + (avgVisibility * 30)))
  );
}


function pointDistance(a,b){
  if(!a || !b) return 0;
  const dx=(a.x||0)-(b.x||0);
  const dy=(a.y||0)-(b.y||0);
  return Math.hypot(dx,dy);
}

function detectThrowingArm(keypoints) {
  const leftScore=scoreArm(15);
  const rightScore=scoreArm(16);
  return rightScore>=leftScore
    ? {side:"Right",wristIndex:16,elbowIndex:14,shoulderIndex:12}
    : {side:"Left",wristIndex:15,elbowIndex:13,shoulderIndex:11};
}

function detectReleasePoint(keypoints){
  if(!Array.isArray(keypoints) || keypoints.length<3){
    return {
      releaseFrame:null,
      releaseTimeMs:null,
      releaseConfidence:"Low",
      throwingArm:"Unknown",
      peakVelocity:0
    };
  }

  const arm=detectThrowingArm(keypoints);
  const velocitySamples=[];

  for(let i=1;i<keypoints.length;i++){
    const previous=keypoints[i-1];
    const current=keypoints[i];
    const previousWrist=previous.landmarks?.[arm.wristIndex];
    const currentWrist=current.landmarks?.[arm.wristIndex];

    if(!previousWrist || !currentWrist) continue;

    const dt=Math.max(0.001,current.time_seconds-previous.time_seconds);
    const velocity=pointDistance(previousWrist,currentWrist)/dt;
    const visibility=Math.min(
      Number(previousWrist.visibility||0),
      Number(currentWrist.visibility||0)
    );

    velocitySamples.push({
      index:i,
      velocity,
      visibility,
      frame:current.frame,
      timeSeconds:current.time_seconds
    });
  }

  if(!velocitySamples.length){
    return {
      releaseFrame:null,
      releaseTimeMs:null,
      releaseConfidence:"Low",
      throwingArm:arm.side,
      peakVelocity:0
    };
  }

  let peak=velocitySamples[0];
  for(const sample of velocitySamples){
    if(sample.velocity>peak.velocity) peak=sample;
  }

  const sorted=velocitySamples.map(s=>s.velocity).sort((a,b)=>a-b);
  const median=sorted[Math.floor(sorted.length/2)]||0;
  const velocityRatio=median>0 ? peak.velocity/median : 0;

  let confidence="Low";
  if(peak.visibility>=0.75 && velocityRatio>=1.8) confidence="High";
  else if(peak.visibility>=0.5 && velocityRatio>=1.35) confidence="Medium";

  return {
    releaseFrame:peak.frame,
    releaseTimeMs:Math.round(peak.timeSeconds*1000),
    releaseConfidence:confidence,
    throwingArm:arm.side,
    peakVelocity:Number(peak.velocity.toFixed(4))
  };
}


function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function landmarkVisible(point,minVisibility=0.35){
  return Boolean(
    point &&
    Number.isFinite(point.x) &&
    Number.isFinite(point.y) &&
    Number(point.visibility ?? 1) >= minVisibility
  );
}

function angleAtPoint(a,b,c){
  if(!landmarkVisible(a) || !landmarkVisible(b) || !landmarkVisible(c)) return null;

  const abx=a.x-b.x;
  const aby=a.y-b.y;
  const cbx=c.x-b.x;
  const cby=c.y-b.y;
  const magnitudeAB=Math.hypot(abx,aby);
  const magnitudeCB=Math.hypot(cbx,cby);

  if(magnitudeAB<1e-6 || magnitudeCB<1e-6) return null;

  const cosine=clamp(
    ((abx*cbx)+(aby*cby))/(magnitudeAB*magnitudeCB),
    -1,
    1
  );

  return Math.acos(cosine)*(180/Math.PI);
}

function mean(values){
  const valid=values.filter(Number.isFinite);
  if(!valid.length) return null;
  return valid.reduce((sum,value)=>sum+value,0)/valid.length;
}

function standardDeviation(values){
  const valid=values.filter(Number.isFinite);
  if(valid.length<2) return 0;
  const avg=mean(valid);
  const variance=valid.reduce(
    (sum,value)=>sum+Math.pow(value-avg,2),
    0
  )/valid.length;
  return Math.sqrt(variance);
}

function median(values){
  const valid=values.filter(Number.isFinite).sort((a,b)=>a-b);
  if(!valid.length) return null;
  const middle=Math.floor(valid.length/2);
  return valid.length%2
    ? valid[middle]
    : (valid[middle-1]+valid[middle])/2;
}

function frameShoulderWidth(frame){
  const left=frame?.landmarks?.[11];
  const right=frame?.landmarks?.[12];
  if(!landmarkVisible(left) || !landmarkVisible(right)) return null;
  const width=pointDistance(left,right);
  return width>1e-5 ? width : null;
}

function getArmFrameMetrics(frame,arm){
  const landmarks=frame?.landmarks;
  if(!landmarks) return null;

  const shoulder=landmarks[arm.shoulderIndex];
  const elbow=landmarks[arm.elbowIndex];
  const wrist=landmarks[arm.wristIndex];
  const hipIndex=arm.side==="Right" ? 24 : 23;
  const handIndex=arm.side==="Right" ? 20 : 19;
  const hip=landmarks[hipIndex];
  const hand=landmarks[handIndex];

  const elbowAngle=angleAtPoint(shoulder,elbow,wrist);
  const shoulderAngle=angleAtPoint(hip,shoulder,elbow);
  const wristAngle=angleAtPoint(elbow,wrist,hand);
  const armExtension=Number.isFinite(elbowAngle)
    ? clamp((elbowAngle/180)*100,0,100)
    : null;

  return {
    elbowAngle,
    shoulderAngle,
    wristAngle,
    armExtension
  };
}

function movementScore(keypoints,landmarkIndexes,multiplier){
  if(!Array.isArray(keypoints) || keypoints.length<2) return null;

  const normalizedMovements=[];

  for(let index=1;index<keypoints.length;index++){
    const previous=keypoints[index-1];
    const current=keypoints[index];
    const previousScale=frameShoulderWidth(previous);
    const currentScale=frameShoulderWidth(current);
    const scale=median([previousScale,currentScale]);
    if(!Number.isFinite(scale) || scale<=0) continue;

    const movements=[];
    for(const landmarkIndex of landmarkIndexes){
      const before=previous.landmarks?.[landmarkIndex];
      const after=current.landmarks?.[landmarkIndex];
      if(!landmarkVisible(before) || !landmarkVisible(after)) continue;
      movements.push(pointDistance(before,after)/scale);
    }

    const movement=mean(movements);
    if(Number.isFinite(movement)) normalizedMovements.push(movement);
  }

  const averageMovement=mean(normalizedMovements);
  if(!Number.isFinite(averageMovement)) return null;
  return Math.round(clamp(100-(averageMovement*multiplier),0,100));
}
function calculateFollowThroughScore(keypoints,releaseFrame,arm){

    if(!Array.isArray(keypoints) || keypoints.length<3 || releaseFrame===null){
        return null;
    }

    const releaseIndex=keypoints.findIndex(
        frame=>frame.frame===releaseFrame
    );

    if(releaseIndex<0){
        return null;
    }

    const endIndex=Math.min(
        keypoints.length-1,
        releaseIndex+6
    );

    if(endIndex<=releaseIndex){
        return null;
    }

    const release=keypoints[releaseIndex];
    const finish=keypoints[endIndex];

    const releaseWrist=release.landmarks?.[arm.wristIndex];
    const finishWrist=finish.landmarks?.[arm.wristIndex];

    const scale=median([
        frameShoulderWidth(release),
        frameShoulderWidth(finish)
    ]);

    if(
        !landmarkVisible(releaseWrist) ||
        !landmarkVisible(finishWrist) ||
        !Number.isFinite(scale)
    ){
        return null;
    }

    const travel=
        pointDistance(
            releaseWrist,
            finishWrist
        )/scale;

    const releaseMetrics=
        getArmFrameMetrics(
            release,
            arm
        );

    const finishMetrics=
        getArmFrameMetrics(
            finish,
            arm
        );

    const extensionGain=
        (
            Number.isFinite(finishMetrics?.armExtension) &&
            Number.isFinite(releaseMetrics?.armExtension)
        )
        ? finishMetrics.armExtension-releaseMetrics.armExtension
        :0;

    const travelScore=
        clamp(
            (travel/0.65)*70,
            0,
            70
        );

    const extensionScore=
        clamp(
            15+(extensionGain*1.5),
            0,
            30
        );

    return Math.round(
        clamp(
            travelScore+extensionScore,
            0,
            100
        )
    );

}


function detectMotionWindow(keypoints){

  const samples=[];

  for(let i=1;i<keypoints.length;i++){

    const previous=keypoints[i-1];
    const current=keypoints[i];

    const left=pointDistance(
      previous.landmarks?.[15],
      current.landmarks?.[15]
    );

    const right=pointDistance(
      previous.landmarks?.[16],
      current.landmarks?.[16]
    );

    samples.push({
      frame:current.frame,
      time:current.time_seconds,
      movement:Math.max(left,right)
    });

  }

  const avg=mean(samples.map(s=>s.movement)) || 0;
  const threshold=avg*1.35;

  return samples.filter(s=>s.movement>threshold);

}
  function calculateWristVelocity(keypoints,wristIndex){

    const velocity=[];

    for(let i=1;i<keypoints.length;i++){

        const previous=keypoints[i-1];
        const current=keypoints[i];

        const p=previous.landmarks?.[wristIndex];
        const c=current.landmarks?.[wristIndex];

        if(!p || !c) continue;

        const dt=Math.max(
            current.time_seconds-previous.time_seconds,
            0.001
        );

        velocity.push({
            frame:current.frame,
            time:current.time_seconds,
            speed:pointDistance(p,c)/dt,
            visibility:Math.min(
                p.visibility||0,
                c.visibility||0
            )
        });

    }

    return velocity;

}
  function findVelocityPeak(velocity,motionWindow){

    if(!velocity.length || !motionWindow.length) return null;

    const motionFrames=new Set(
        motionWindow.map(m=>m.frame)
    );

    let best=null;

    for(const sample of velocity){

        if(!motionFrames.has(sample.frame)) continue;

        if(sample.visibility<0.45) continue;

        if(best===null || sample.speed>best.speed){
            best=sample;
        }

    }

    return best;

}
  function calculateReleaseConfidence(peak,velocity){

    if(!peak) return "Low";

    const speeds=velocity
        .map(v=>v.speed)
        .sort((a,b)=>a-b);

    const medianSpeed=speeds.length
        ? speeds[Math.floor(speeds.length/2)]
        : 0;

    const ratio=medianSpeed>0
        ? peak.speed/medianSpeed
        : 0;

    if(
        peak.visibility>=0.80 &&
        ratio>=2.0
    ){
        return "High";
    }

    if(
        peak.visibility>=0.60 &&
        ratio>=1.50
    ){
        return "Medium";
    }

    return "Low";

}
  function detectReleasePoint(keypoints){

    if(!Array.isArray(keypoints) || keypoints.length<3){

        return{
            releaseFrame:null,
            releaseTimeMs:null,
            releaseConfidence:"Low",
            throwingArm:"Unknown",
            peakVelocity:0
        };

    }

    const arm=detectThrowingArm(keypoints);

    const motionWindow=detectMotionWindow(keypoints);

    const velocity=calculateWristVelocity(
        keypoints,
        arm.wristIndex
    );

    const peak=findVelocityPeak(
        velocity,
        motionWindow
    );

    if(!peak){

        return{
            releaseFrame:null,
            releaseTimeMs:null,
            releaseConfidence:"Low",
            throwingArm:arm.side,
            peakVelocity:0
        };

    }

    return{

        releaseFrame:peak.frame,

        releaseTimeMs:Math.round(
            peak.time*1000
        ),

        releaseConfidence:
            calculateReleaseConfidence(
                peak,
                velocity
            ),

        throwingArm:arm.side,

        peakVelocity:Number(
            peak.speed.toFixed(4)
        )

    };

}
  const endIndex=Math.min(keypoints.length-1,releaseIndex+6);
  if(endIndex<=releaseIndex) return null;

  const release=keypoints[releaseIndex];
  const finish=keypoints[endIndex];
  const releaseWrist=release.landmarks?.[arm.wristIndex];
  const finishWrist=finish.landmarks?.[arm.wristIndex];
  const scale=median([frameShoulderWidth(release),frameShoulderWidth(finish)]);

  if(!landmarkVisible(releaseWrist) || !landmarkVisible(finishWrist) || !Number.isFinite(scale)){
    return null;
  }

  const travel=pointDistance(releaseWrist,finishWrist)/scale;
  const releaseMetrics=getArmFrameMetrics(release,arm);
  const finishMetrics=getArmFrameMetrics(finish,arm);
  const extensionGain=(
    Number.isFinite(finishMetrics?.armExtension) &&
    Number.isFinite(releaseMetrics?.armExtension)
  ) ? finishMetrics.armExtension-releaseMetrics.armExtension : 0;

  const travelScore=clamp((travel/0.65)*70,0,70);
  const extensionScore=clamp(15+(extensionGain*1.5),0,30);
  return Math.round(clamp(travelScore+extensionScore,0,100));
}

function calculateBiomechanics(keypoints,release){
  if(!Array.isArray(keypoints) || keypoints.length===0){
    return {
      wristAngle:null,
      shoulderAngle:null,
      armExtension:null,
      throwConsistency:null,
      elbowAngle:null,
      headMovementScore:null,
      bodyStabilityScore:null,
      followThroughScore:null
    };
  }

  const arm=detectThrowingArm(keypoints);
  const releaseIndex=release.releaseFrame===null
    ? keypoints.length-1
    : keypoints.findIndex(frame=>frame.frame===release.releaseFrame);
  const centerIndex=releaseIndex>=0 ? releaseIndex : keypoints.length-1;
  const startIndex=Math.max(0,centerIndex-4);
  const endIndex=Math.min(keypoints.length-1,centerIndex+3);
  const analysisFrames=keypoints.slice(startIndex,endIndex+1);
  const frameMetrics=analysisFrames
    .map(frame=>getArmFrameMetrics(frame,arm))
    .filter(Boolean);

  const elbowAngles=frameMetrics.map(metric=>metric.elbowAngle).filter(Number.isFinite);
  const shoulderAngles=frameMetrics.map(metric=>metric.shoulderAngle).filter(Number.isFinite);
  const wristAngles=frameMetrics.map(metric=>metric.wristAngle).filter(Number.isFinite);
  const armExtensions=frameMetrics.map(metric=>metric.armExtension).filter(Number.isFinite);
  const releaseMetrics=getArmFrameMetrics(keypoints[centerIndex],arm);

  const elbowVariation=standardDeviation(elbowAngles);
  const wristVariation=standardDeviation(wristAngles);
  const extensionVariation=standardDeviation(armExtensions);
  const consistencyPenalty=(elbowVariation*1.6)+(wristVariation*0.8)+(extensionVariation*1.2);

  return {
    wristAngle:Number.isFinite(releaseMetrics?.wristAngle)
      ? Number(releaseMetrics.wristAngle.toFixed(1))
      : (Number.isFinite(mean(wristAngles)) ? Number(mean(wristAngles).toFixed(1)) : null),
    shoulderAngle:Number.isFinite(releaseMetrics?.shoulderAngle)
      ? Number(releaseMetrics.shoulderAngle.toFixed(1))
      : (Number.isFinite(mean(shoulderAngles)) ? Number(mean(shoulderAngles).toFixed(1)) : null),
    armExtension:Number.isFinite(releaseMetrics?.armExtension)
      ? Number(releaseMetrics.armExtension.toFixed(1))
      : (Number.isFinite(mean(armExtensions)) ? Number(mean(armExtensions).toFixed(1)) : null),
    throwConsistency:Math.round(clamp(100-consistencyPenalty,0,100)),
    elbowAngle:Number.isFinite(releaseMetrics?.elbowAngle)
      ? Number(releaseMetrics.elbowAngle.toFixed(1))
      : (Number.isFinite(mean(elbowAngles)) ? Number(mean(elbowAngles).toFixed(1)) : null),
    headMovementScore:movementScore(keypoints,[0,7,8],850),
    bodyStabilityScore:movementScore(keypoints,[11,12,23,24],700),
    followThroughScore:calculateFollowThroughScore(
      keypoints,
      release.releaseFrame,
      arm
    )
  };
}

async function analyzeVideo(){
  await waitForMetadata();
  const duration=Number(videoPreview.duration);
  if(!Number.isFinite(duration)||duration<=0) throw new Error("The selected video could not be loaded.");
  canvas.width=Math.max(1,videoPreview.videoWidth);
  canvas.height=Math.max(1,videoPreview.videoHeight);
  let framesChecked=0,framesWithPose=0,visibilityTotal=0;
  const keypoints=[];
  const sampleInterval=0.10;
  const maxFrames=90;
  videoPreview.pause();
  for(let t=0;t<=duration&&framesChecked<maxFrames;t+=sampleInterval){
    await seekVideo(t);
    if(videoPreview.readyState<2) continue;
    try{
      ctx.drawImage(videoPreview,0,0,canvas.width,canvas.height);
      const result=poseLandmarker.detectForVideo(canvas,Math.max(1,Math.round(videoPreview.currentTime*1000)));
      framesChecked++;
      if(result.landmarks?.length){
        framesWithPose++;
        const landmarks=result.landmarks[0];
        visibilityTotal+=averageVisibility(landmarks);
        keypoints.push({frame:framesChecked,time_seconds:Number(videoPreview.currentTime.toFixed(3)),landmarks});
      }
      framesCheckedElement.textContent=String(framesChecked);
      poseFramesElement.textContent=String(framesWithPose);
      resultsElement.style.display="block";
    }catch(e){
      console.warn("Frame skipped",e);
    }
  }
  const detectionPercentage=framesChecked?Math.round((framesWithPose/framesChecked)*100):0;
  let quality="No pose detected";
  if(detectionPercentage>=80) quality="Excellent";
  else if(detectionPercentage>=60) quality="Good";
  else if(detectionPercentage>=30) quality="Limited";
  const techniqueScore=calculateTechniqueScore(framesWithPose,framesChecked,visibilityTotal);
  const release=detectReleasePoint(keypoints);
  const biomechanics=calculateBiomechanics(keypoints,release);

  detectionQualityElement.textContent=quality;
  releaseFrameElement.textContent=release.releaseFrame ?? "Not detected";
  releaseTimeElement.textContent=release.releaseTimeMs !== null
    ? `${release.releaseTimeMs} ms`
    : "Not detected";
  releaseConfidenceElement.textContent=release.releaseConfidence;

  return {
    framesChecked,
    framesWithPose,
    detectionPercentage,
    quality,
    techniqueScore,
    mainIssue:release.releaseFrame !== null ? "Release detected" : "No release detected",
    keypoints,
    releaseFrame:release.releaseFrame,
    releaseTimeMs:release.releaseTimeMs,
    releaseConfidence:release.releaseConfidence,
    throwingArm:release.throwingArm,
    peakWristVelocity:release.peakVelocity,
    wristAngle:biomechanics.wristAngle,
    shoulderAngle:biomechanics.shoulderAngle,
    armExtension:biomechanics.armExtension,
    throwConsistency:biomechanics.throwConsistency,
    elbowAngle:biomechanics.elbowAngle,
    headMovementScore:biomechanics.headMovementScore,
    bodyStabilityScore:biomechanics.bodyStabilityScore,
    followThroughScore:biomechanics.followThroughScore
  };
}

async function uploadVideo(file,analysisResult){
  setStatus("Analysis complete. Uploading video...");

  if(
    analysisResult.releaseFrame === null ||
    analysisResult.releaseTimeMs === null ||
    !analysisResult.releaseConfidence
  ){
    throw new Error("Release detection produced no saveable result.");
  }

  const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g,"_");
  const emailFolder = playerEmail
    ? playerEmail.replace(/[^a-zA-Z0-9@._-]/g,"_")
    : "unknown-player";

  const filename = `${emailFolder}/${Date.now()}_${safeName}`;

  const {error:uploadError} = await supabaseClient.storage
    .from(STORAGE_BUCKET)
    .upload(filename,file,{
      cacheControl:"3600",
      upsert:false,
      contentType:file.type || "video/mp4"
    });

  if(uploadError) throw uploadError;

  const {data:publicUrlData} = supabaseClient.storage
    .from(STORAGE_BUCKET)
    .getPublicUrl(filename);

  const videoUrl = publicUrlData?.publicUrl;
  if(!videoUrl) throw new Error("Could not create video URL.");

  const detailedRow = {
    Player_Email:playerEmail,
    video_url:videoUrl,
    technique_score:analysisResult.techniqueScore,
    main_issue:analysisResult.mainIssue,
    confidence_score:analysisResult.detectionPercentage,
    status:"Release detected",
    analysis_complete:true,
    frames_checked:analysisResult.framesChecked,
    pose_detected:analysisResult.framesWithPose,
    detection_percentage:analysisResult.detectionPercentage,
    release_frame:analysisResult.releaseFrame,
    release_time_ms:analysisResult.releaseTimeMs,
    release_confidence:analysisResult.releaseConfidence,
    release_timing:`${analysisResult.releaseTimeMs} ms`,
    wrist_angle:analysisResult.wristAngle,
    shoulder_angle:analysisResult.shoulderAngle,
    arm_extension:analysisResult.armExtension,
    throw_consistency:analysisResult.throwConsistency,
    elbow_angle:analysisResult.elbowAngle,
    head_movement_score:analysisResult.headMovementScore,
    body_stability_score:analysisResult.bodyStabilityScore,
    follow_through_score:analysisResult.followThroughScore
  };

  const {data:savedRows,error:insertError} = await supabaseClient
    .from(TABLE_NAME)
    .insert([detailedRow])
    .select("id,release_frame,release_time_ms,release_confidence,main_issue,status,wrist_angle,shoulder_angle,arm_extension,throw_consistency,elbow_angle,head_movement_score,body_stability_score,follow_through_score");

  if(insertError){
    throw new Error(`Supabase metric save failed: ${insertError.message}`);
  }

  const saved = Array.isArray(savedRows) ? savedRows[0] : savedRows;

  if(
    !saved ||
    saved.release_frame === null ||
    saved.release_time_ms === null ||
    !saved.release_confidence
  ){
    throw new Error("Supabase returned an incomplete release-analysis row.");
  }

  const expectedBiomechanics=[
    "wrist_angle",
    "shoulder_angle",
    "arm_extension",
    "throw_consistency",
    "elbow_angle",
    "head_movement_score",
    "body_stability_score",
    "follow_through_score"
  ];

  const missingBiomechanics=expectedBiomechanics.filter(
    key=>saved[key]===null || saved[key]===undefined
  );

  if(analysisResult.framesWithPose>=3 && missingBiomechanics.length){
    throw new Error(
      `Biomechanics save incomplete: ${missingBiomechanics.join(", ")}`
    );
  }

  return {detailedMetricsSaved:true,saved};
}

analyzeBtn.addEventListener("click",async()=>{
  if(!selectedFile || !poseLandmarker) return;

  analyzeBtn.disabled = true;
  videoInput.disabled = true;

  try{
    if(!playerEmail){
      throw new Error(
        "Player email is missing. Add ?email=SIGNED_IN_USER_EMAIL to the Glide web embed URL."
      );
    }

    const analysisResult = await analyzeVideo();
    const saveResult = await uploadVideo(selectedFile,analysisResult);

    releaseFrameElement.textContent = String(saveResult.saved.release_frame);
    releaseTimeElement.textContent = `${saveResult.saved.release_time_ms} ms`;
    releaseConfidenceElement.textContent = saveResult.saved.release_confidence;
    setStatus("BV3 release and biomechanics saved and verified.","success");
  }catch(error){
    console.error(error);
    setStatus(error?.message || "Analysis failed.","error");
  }finally{
    analyzeBtn.disabled = false;
    videoInput.disabled = false;
  }
});

window.addEventListener("beforeunload",cleanObjectUrl);

loadPoseLandmarker();
