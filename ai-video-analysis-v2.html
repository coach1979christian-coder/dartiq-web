
<style>
#recordSettings,
#manualPanel,
#comparisonPanel,
#resultsPanel,
#throwSelect,
.timeline,
.speeds,
#prevFrame,
#nextFrame,
#toggleSkeleton,
#phaseTitle,
#phaseDescription,
#visualPanel .grid,
#visualPanel .notice,
#visualPanel .time-row {
  display:none!important;
}

.controls {
  grid-template-columns:1fr;
}

#coaching {
  font-size:15px;
  line-height:1.7;
}

#coaching h3 {
  color:#27b8ff;
  font-size:12px;
  letter-spacing:1.5px;
  margin:18px 0 8px;
}

#coaching p {
  color:#ffffff;
  margin:0 0 14px;
}

.v16-card {
  background:#071321;
  border:1px solid #245078;
  border-radius:14px;
  padding:16px;
  margin-top:12px;
}

.v16-issue {
  font-size:22px;
  font-weight:900;
  color:#ffce55;
}

.v16-note {
  color:#94abc2;
  font-size:11px;
  line-height:1.6;
}
</style>

<script>
window.addEventListener("DOMContentLoaded",()=>{

  const $=id=>document.getElementById(id);

  document.title="DARTIQ CORE Vision V16";

  document.querySelector(".subtitle").textContent=
    "CORE VISION V16";

  document.querySelector(".footer").textContent=
    "DARTIQ CORE VISION V16 · EXPERIMENTAL PROTOTYPE";

  $("armSelect").value="AUTO";
  $("targetSelect").value="6";

  $("visualPanel").querySelector("h2").textContent=
    "Watch Your Throw";

  $("coachPanel").querySelector("h2").textContent=
    "Your AI Coaching";

  $("playButton").textContent=
    "▶ PLAY SLOW MOTION";

  $("recordButton").textContent=
    "● RECORD MY THROW";

  $("analyzeButton").textContent=
    "GET AI THROW ANALYSIS";

  const review=$("review");

  review.addEventListener("pause",()=>{
    $("playButton").textContent=
      "▶ PLAY SLOW MOTION";
  });

  review.addEventListener("play",()=>{
    $("playButton").textContent=
      "Ⅱ PAUSE";
  });

  const readMetric=label=>{

    const metrics=[
      ...$("summaryGrid").querySelectorAll(".metric")
    ];

    const metric=metrics.find(m=>
      m.querySelector(".metric-label")
        ?.textContent.trim()===label
    );

    return parseFloat(
      metric?.querySelector(".metric-value")
        ?.textContent
    );
  };

  function renderV16(){

    const samples=readMetric("Samples / Second");
    const coverage=readMetric("Pose Coverage");
    const throws=readMetric("Automatic Candidates");
    const tempo=readMetric("Tempo Variation");
    const head=readMetric("Head Movement / Torso");

    let issue="No clear weakness identified";
    let advice=
      "Maintain your natural throwing action and focus on repeating the same movement.";

    let drill="Consistent Throw Routine";

    let note=
      "Release timing is estimated from body movement. Results are experimental.";

    const reliable=
      Number.isFinite(samples)&&
      samples>=15&&
      coverage>=85&&
      throws>=3&&
      throws<=6;

    if(!reliable){

      issue="More recording data needed";

      advice=
        "Position your smartphone side-on. Keep your head, shoulder, elbow and throwing hand visible. Record six natural throws in good lighting.";

      drill="Repeat Throw Analysis";

      note=
        "Tracking quality was insufficient to identify a reliable weakness.";

    }else if(
      Number.isFinite(head)&&head>12
    ){

      issue="Possible head movement";

      advice=
        "Keep your head naturally steady throughout the delivery. Avoid forcing your body into a rigid position.";

      drill="Body Stability Training";

    }else if(
      Number.isFinite(tempo)&&tempo>30
    ){

      issue="Possible delivery rhythm variation";

      advice=
        "Use a comfortable, repeatable rhythm from preparation through delivery. Do not deliberately accelerate or slow your arm.";

      drill="Throw Rhythm Training";

    }

    $("coaching").innerHTML=`
      <div class="v16-card">
        <h3>MAIN ISSUE</h3>
        <div class="v16-issue">${issue}</div>
      </div>

      <div class="v16-card">
        <h3>AI COACH ADVICE</h3>
        <p>${advice}</p>
      </div>

      <div class="v16-card">
        <h3>RECOMMENDED TRAINING</h3>
        <p>${drill}</p>
      </div>

      <div class="v16-card v16-note">
        ${note}
      </div>
    `;

    $("status").textContent=reliable
      ?"Your throw analysis is ready."
      :"Recording reviewed. Improve tracking for coaching feedback.";

    $("badge").textContent=reliable
      ?"ANALYSIS COMPLETE"
      :"RECORDING REVIEWED";

    $("throwSelect").value="-1";

    $("throwSelect").dispatchEvent(
      new Event("change")
    );

    review.playbackRate=.5;
  }

  const observer=new MutationObserver(()=>{

    if(
      $("coachPanel").classList.contains("hidden")
    )return;

    if(
      !$("summaryGrid").querySelector(".metric")
    )return;

    renderV16();

  });

  observer.observe($("summaryGrid"),{
    childList:true,
    subtree:true
  });

  $("analyzeButton").addEventListener("click",()=>{

    setTimeout(()=>{

      if(
        !$("coachPanel").classList.contains("hidden")
      ){

        renderV16();

        $("coachPanel").scrollIntoView({
          behavior:"smooth",
          block:"start"
        });

      }

    },100);

  });

});
</script>
