
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DARTIQ Training History</title>
<style>
:root{
  --cyan:#00ffff;
  --glow:#00dfff;
  --bg:#050b18;
  --text:#ffffff;
  --muted:#a9c4d6;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
body{padding:12px}
.wrap{max-width:460px;margin:auto}
.header{
  text-align:center;
  padding:22px 12px;
  border:1px solid var(--cyan);
  border-radius:22px;
  background:
    radial-gradient(circle at 15% 80%,#006b8044,transparent 45%),
    linear-gradient(145deg,#081b2d,#030811);
  box-shadow:0 0 18px #00ffff44,inset 0 0 20px #00ffff12;
}
.logo{
  font-size:42px;
  font-weight:900;
  font-style:italic;
  letter-spacing:-2px;
  color:white;
  text-shadow:0 0 12px #00dfff;
}
.logo span{color:var(--cyan)}
h1{font-size:24px;margin:12px 0 18px}
.line{
  width:75%;
  height:2px;
  margin:0 auto 20px;
  background:var(--cyan);
  box-shadow:0 0 12px var(--cyan);
}
.entry{
  display:flex;
  align-items:center;
  gap:12px;
  width:100%;
  text-align:left;
  padding:15px 12px;
  margin:10px 0;
  background:#050f1d;
  color:white;
  border:1px solid #00ffff88;
  border-radius:16px;
  box-shadow:0 0 9px #00ffff24;
  cursor:pointer;
}
.target{font-size:28px;color:var(--cyan)}
.info{flex:1;min-width:0}
.name{font-size:16px;font-weight:800;overflow-wrap:anywhere}
.date{font-size:12px;color:var(--muted);margin-top:5px}
.arrow{font-size:28px;color:var(--cyan)}
.detail{
  display:none;
  padding:16px;
  margin:10px 0 18px;
  border:1px solid #00ffff77;
  border-radius:17px;
  background:#081727;
}
.detail.open{display:block}
.detail h2{font-size:19px;color:var(--cyan);margin:0 0 12px}
.stats{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:9px;
}
.stat{
  padding:12px 6px;
  text-align:center;
  border:1px solid #00ffff35;
  border-radius:12px;
  background:#020b15;
}
.stat small{display:block;font-size:11px;color:var(--muted)}
.stat strong{
  display:block;
  margin-top:7px;
  font-size:23px;
  color:var(--cyan);
}
.section{
  margin-top:14px;
  padding:12px;
  border-left:3px solid var(--cyan);
  border-radius:9px;
  background:#07101d;
  overflow-wrap:anywhere;
}
.section b{color:var(--cyan);font-size:13px}
.section p{margin:7px 0 0;line-height:1.5;font-size:14px}
.empty{text-align:center;color:var(--muted);padding:30px 12px}
.footer{text-align:center;color:#5d91a6;font-size:10px;margin:24px}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div class="logo">DART<span>IQ</span></div>
    <h1>▣ Training History</h1>
    <div class="line"></div>
    <div id="entries"></div>
  </header>
  <div class="footer">POWERED BY DARTIQ AI</div>
</div>

<script>
"use strict";

const params=new URLSearchParams(location.search);

function get(name){
  const value=params.get(name);
  if(!value || value===name.toUpperCase())return "";
  return value.trim();
}
function escapeHTML(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[c]);
}
function display(value){
  return escapeHTML(value || "Not recorded");
}
function formatDate(value){
  if(!value)return "Date not recorded";
  const d=new Date(value);
  if(Number.isNaN(d.getTime()))return escapeHTML(value);
  return d.toLocaleString("en-GB",{
    day:"numeric",month:"long",year:"numeric",
    hour:"2-digit",minute:"2-digit"
  });
}

const entries=document.getElementById("entries");

function renderTraining(item,index){
  const name=display(item.trainingname||item.drill||"Training Session");
  const date=formatDate(item.trainingdate||item.completedat);
  const id="details-"+index;

  const button=document.createElement("button");
  button.className="entry";
  button.type="button";
  button.setAttribute("aria-expanded","false");
  button.setAttribute("aria-controls",id);
  button.innerHTML=`
    <span class="target">◎</span>
    <span class="info">
      <span class="name">${name}</span>
      <span class="date">${date}</span>
    </span>
    <span class="arrow">›</span>`;

  const detail=document.createElement("div");
  detail.className="detail";
  detail.id=id;
  detail.innerHTML=`
    <h2>${name}</h2>
    <div class="stats">
      ${stat("AVERAGE",item.average)}
      ${stat("FIRST 9",item.first9)}
      ${stat("TOTAL DARTS",item.totaldarts)}
      ${stat("180s",item.count180)}
      ${stat("140+",item.count140)}
      ${stat("100+",item.count100)}
      ${stat("HIGHEST CHECKOUT",item.highestcheckout)}
      ${stat("XP EARNED",item.xpearned)}
    </div>
    ${section("MAIN TRAINING ISSUE",item.mainissue)}
    ${section("COACH ADVICE",item.coachadvice)}
    ${section("SUCCESS TARGET",item.successtarget)}
    ${section("NEXT ACTION",item.nextaction)}
    ${section("TRAINING STATUS",item.status)}
  `;

  button.addEventListener("click",()=>{
    const open=detail.classList.toggle("open");
    button.setAttribute("aria-expanded",String(open));
    button.querySelector(".arrow").textContent=open?"⌄":"›";
  });

  entries.append(button,detail);
}

function stat(label,value){
  const safe=value!==undefined&&value!==null&&value!==""
    ?escapeHTML(value):"—";
  return `<div class="stat">
    <small>${label}</small><strong>${safe}</strong>
  </div>`;
}
function section(label,value){
  return `<div class="section">
    <b>${label}</b>
    <p>${display(value)}</p>
  </div>`;
}

/*
 Supports one record passed from Glide as URL replacements.

 Example:
 ?trainingname=Left-Line%20Reset
 &trainingdate=2026-11-15
 &average=56.7
 &first9=60.3

 For multiple records, the parent app must provide a
 JSON array through a trusted integration or an API.
 URL replacements alone do not retrieve a whole table.
*/

const record={
  trainingname:get("trainingname")||get("drill"),
  trainingdate:get("trainingdate"),
  completedat:get("completedat"),
  average:get("average"),
  first9:get("first9"),
  totaldarts:get("totaldarts"),
  count180:get("count180"),
  count140:get("count140"),
  count100:get("count100"),
  highestcheckout:get("highestcheckout"),
  xpearned:get("xpearned"),
  mainissue:get("mainissue"),
  coachadvice:get("coachadvice"),
  successtarget:get("successtarget"),
  nextaction:get("nextaction"),
  status:get("status")
};

if(record.trainingname || record.trainingdate){
  renderTraining(record,0);
}else{
  entries.innerHTML=
    '<div class="empty">No training session selected.</div>';
}
</script>
</body>
</html>
