<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b16">
<title>DARTIQ | Auto-Scoring V10</title>

<style>
:root{
  --bg:#050b16;
  --blue:#27b8ff;
  --green:#19e79a;
  --yellow:#ffd447;
  --muted:#afc6da;
}
*{box-sizing:border-box}
html,body{
  width:100%;height:100%;margin:0;
  overflow:hidden;background:#000;color:#fff;
  font-family:Arial,sans-serif;
}
button,input{font:inherit}
.app{
  position:relative;
  width:100%;max-width:800px;
  height:100vh;height:100dvh;
  margin:auto;overflow:hidden;background:#000;
}
#camera{display:none}
#preview,#overlay{
  position:absolute;inset:0;
  width:100%;height:100%;
  object-fit:contain;
}
#overlay{pointer-events:none}
.top{
  position:absolute;z-index:3;
  top:0;left:0;right:0;
  text-align:center;
  padding:9px 12px 22px;
  background:linear-gradient(
    #020916f9,#020916b0,transparent
  );
}
.logo{
  margin:0;color:var(--blue);
  font-size:25px;letter-spacing:4px;
  text-shadow:0 0 15px #27b8ff99;
}
.subtitle{
  margin-top:3px;font-size:10px;
  letter-spacing:1px;color:var(--muted);
}
.camera-info{
  display:flex;justify-content:space-between;
  margin-top:8px;font-size:10px;color:var(--muted);
}
.bottom{
  position:absolute;z-index:4;
  bottom:0;left:0;right:0;
  padding:12px 10px max(12px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:7px;
  background:linear-gradient(
    transparent,#020916ed 12%,#020916 45%
  );
}
.status{
  min-height:17px;text-align:center;
  color:var(--blue);font-size:12px;font-weight:800;
}
.indicator{
  display:flex;align-items:center;justify-content:center;
  gap:7px;color:var(--muted);font-size:11px;
}
.dot{
  width:9px;height:9px;border-radius:50%;
  background:#64748b;
}
.dot.active{
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}
.dot.wait{background:var(--yellow)}
.dot.error{background:#ff5268}
.zoom-panel{
  background:rgba(3,14,30,.94);
  border:1px solid #27b8ff88;
  border-radius:10px;
  padding:10px 12px;
}
.zoom-head{
  display:flex;justify-content:space-between;
  align-items:center;margin-bottom:7px;
  font-size:12px;font-weight:800;
}
.zoom-head span:last-child{color:var(--blue)}
.zoom-controls{
  display:flex;align-items:center;gap:9px;
}
.zoom-controls button{
  flex:0 0 35px;
  min-height:35px;
  padding:0;font-size:21px;
}
input[type=range]{
  flex:1;min-width:0;
  accent-color:var(--blue);
  height:28px;
}
.zoom-note{
  margin-top:5px;
  font-size:10px;color:var(--muted);
  text-align:center;
}
button{
  min-height:40px;padding:8px 5px;
  background:var(--blue);color:#00121e;
  border:1px solid #27b8ff77;
  border-radius:9px;
  font-size:11px;font-weight:800;
  cursor:pointer;
}
button:disabled{opacity:.4}
.secondary{background:#18334d;color:#fff}
.metrics{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:6px;
}
.metric{
  text-align:center;
  background:#031020ed;
  border:1px solid #27b8ff55;
  border-radius:9px;padding:8px 3px;
}
.metric small{
  display:block;color:var(--muted);
  font-size:9px;
}
.metric strong{
  display:block;margin-top:3px;
  color:var(--blue);font-size:26px;
}
.row{
  display:grid;grid-template-columns:1fr 1fr;gap:6px;
}
.details,.message{
  text-align:center;color:var(--muted);
  font-size:10px;
}
.hidden{display:none!important}
@media(max-height:700px){
  .bottom{gap:4px;padding-top:5px}
  button{min-height:32px}
  .metric{padding:5px 2px}
  .metric strong{font-size:20px}
  .zoom-panel{padding:6px 9px}
}
@media(max-height:560px){
  .subtitle,.details{display:none}
  .logo{font-size:19px}
  .metric strong{font-size:17px}
}
</style>
</head>

<body>

<div class="app" id="app">

  <video id="camera" autoplay muted playsinline></video>
  <canvas id="preview"></canvas>
  <canvas id="overlay"></canvas>

  <div class="top">
    <h1 class="logo">DARTIQ</h1>
    <div class="subtitle">
      AUTO-SCORING V10 | CAMERA ZOOM
    </div>
    <div class="camera-info">
      <span id="cameraStatus">Connecting camera...</span>
      <span id="resolution">---</span>
    </div>
  </div>

  <div class="bottom">

    <div class="status" id="status">
      WAITING FOR CAMERA
    </div>

    <div class="indicator">
      <span id="liveDot" class="dot"></span>
      <span id="liveText">SYSTEM IDLE</span>
    </div>

    <div class="zoom-panel" id="zoomPanel">
      <div class="zoom-head">
        <span>CAMERA ZOOM</span>
        <span id="zoomValue">1.0×</span>
      </div>

      <div class="zoom-controls">
        <button id="zoomOut" type="button">−</button>

        <input
          id="zoomSlider"
          type="range"
          min="1"
          max="3"
          step="0.1"
          value="1"
          aria-label="Camera zoom"
        >

        <button id="zoomIn" type="button">+</button>
      </div>

      <div class="zoom-note">
        Keep the entire scoring area visible
      </div>
    </div>

    <button id="calibrate" disabled>
      START AUTOMATIC CALIBRATION
    </button>

    <div class="metrics">
      <div class="metric">
        <small>LAST DART</small>
        <strong id="score">---</strong>
      </div>
      <div class="metric">
        <small>VISIT TOTAL</small>
        <strong id="total">0</strong>
      </div>
      <div class="metric">
        <small>DARTS</small>
        <strong id="darts">0/3</strong>
      </div>
    </div>

    <div class="details" id="details">
      Zoom before calibration
    </div>

    <div class="row">
      <button id="reset" class="secondary">
        RESET VISIT
      </button>
      <button id="restart" class="secondary">
        RESTART CAMERA
      </button>
    </div>

    <div class="message" id="message">
      Position the board and adjust zoom
    </div>

  </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);

const video=$("camera");
const app=$("app");
const preview=$("preview");
const pc=preview.getContext("2d",{
  alpha:false,
  willReadFrequently:true
});

const overlay=$("overlay");
const oc=overlay.getContext("2d");

const SECTORS=[
  20,1,18,4,13,6,10,15,2,17,
  3,19,7,16,8,11,14,9,12,5
];

const CFG={
  interval:350,
  stableRequired:5,
  stableThreshold:.025,
  sceneThreshold:.13,
  pixelThreshold:55,
  minPixels:12,
  maxPixels:900,
  candidateRequired:4,
  candidateTolerance:7,
  removalThreshold:.012,
  removalFrames:5
};

let W=270,H=480;
let stream=null;
let cameraToken=0;
let loopToken=0;
let timer=null;
let animationId=null;

let zoom=1;
let zoomLocked=false;

let board=null;
let calibrated=false;
let calibrating=false;
let monitoring=false;

let emptyBoard=null;
let referenceFrame=null;
let previousFrame=null;

let stableCount=0;
let candidateCount=0;
let previousCandidate=null;
let removalCount=0;

let visitTotal=0;
let dartCount=0;
let lastMarker=null;
let markerUntil=0;
let lastWarning="";

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function status(s){$("status").textContent=s}
function message(s){$("message").textContent=s}

function setLive(mode,text){
  $("liveDot").className="dot"+(mode?" "+mode:"");
  $("liveText").textContent=text;
}

function ready(){
  return !!stream&&
    video.readyState>=2&&
    video.videoWidth>0&&
    video.videoHeight>0;
}

function setZoom(value){
  if(zoomLocked||calibrating)return;

  zoom=Math.max(1,Math.min(3,Number(value)));

  zoom=Math.round(zoom*10)/10;

  $("zoomSlider").value=zoom;
  $("zoomValue").textContent=zoom.toFixed(1)+"×";

  if(ready())renderCamera();
}

function changeZoom(delta){
  setZoom(zoom+delta);
}

$("zoomSlider").addEventListener("input",e=>{
  setZoom(e.target.value);
});

$("zoomOut").onclick=()=>changeZoom(-.1);
$("zoomIn").onclick=()=>changeZoom(.1);

function lockZoom(){
  zoomLocked=true;

  $("zoomSlider").disabled=true;
  $("zoomOut").disabled=true;
  $("zoomIn").disabled=true;

  $("zoomPanel").classList.add("hidden");
}

function unlockZoom(){
  zoomLocked=false;

  $("zoomSlider").disabled=false;
  $("zoomOut").disabled=false;
  $("zoomIn").disabled=false;

  $("zoomPanel").classList.remove("hidden");
}

function resize(){
  const dpr=devicePixelRatio||1;

  overlay.width=Math.round(app.clientWidth*dpr);
  overlay.height=Math.round(app.clientHeight*dpr);

  oc.setTransform(dpr,0,0,dpr,0,0);
  drawOverlay();
}

function imageRect(){
  const scale=Math.min(
    app.clientWidth/W,
    app.clientHeight/H
  );

  return {
    x:(app.clientWidth-W*scale)/2,
    y:(app.clientHeight-H*scale)/2,
    w:W*scale,
    h:H*scale
  };
}

function toScreen(x,y){
  const r=imageRect();

  return {
    x:r.x+x/W*r.w,
    y:r.y+y/H*r.h
  };
}

/*
  Digital zoom is applied to the actual
  camera-processing canvas.

  The preview and detection algorithms
  therefore use identical image coordinates.
*/

function renderCamera(){
  if(!ready())return;

  const vw=video.videoWidth;
  const vh=video.videoHeight;

  const sw=vw/zoom;
  const sh=vh/zoom;

  const sx=(vw-sw)/2;
  const sy=(vh-sh)/2;

  pc.drawImage(
    video,
    sx,sy,sw,sh,
    0,0,W,H
  );
}

function previewLoop(){
  if(ready())renderCamera();

  animationId=requestAnimationFrame(previewLoop);
}

function capture(){
  if(!ready())throw Error("Camera not ready");

  renderCamera();

  return pc.getImageData(0,0,W,H);
}

function drawOverlay(){
  oc.clearRect(
    0,0,
    app.clientWidth,
    app.clientHeight
  );

  if(!board)return;

  if(!calibrated){
    const r=imageRect();
    const c=toScreen(board.x,board.y);

    const rx=board.rx/W*r.w;
    const ry=board.ry/H*r.h;

    function ring(scale,color){
      oc.beginPath();

      oc.ellipse(
        c.x,c.y,
        rx*scale,ry*scale,
        0,0,Math.PI*2
      );

      oc.strokeStyle=color;
      oc.lineWidth=1.5;
      oc.stroke();
    }

    ring(1,"#27b8ff");
    ring(162/170,"#27b8ff");
    ring(107/170,"#27b8ff");
    ring(99/170,"#27b8ff");
    ring(15.9/170,"#ffcc00");
    ring(6.35/170,"#ffcc00");

    for(let i=0;i<20;i++){
      const a=(
        -99+i*18+board.rotation
      )*Math.PI/180;

      oc.beginPath();

      oc.moveTo(
        c.x+Math.cos(a)*rx*.1,
        c.y+Math.sin(a)*ry*.1
      );

      oc.lineTo(
        c.x+Math.cos(a)*rx,
        c.y+Math.sin(a)*ry
      );

      oc.strokeStyle="#27b8ff55";
      oc.lineWidth=1;
      oc.stroke();
    }
  }

  if(lastMarker&&Date.now()<markerUntil){
    const p=toScreen(lastMarker.x,lastMarker.y);

    oc.beginPath();
    oc.arc(p.x,p.y,11,0,Math.PI*2);
    oc.strokeStyle="#19e79a";
    oc.lineWidth=3;
    oc.stroke();
  }
}

function pixelDifference(a,b,i){
  return (
    Math.abs(a.data[i]-b.data[i])+
    Math.abs(a.data[i+1]-b.data[i+1])+
    Math.abs(a.data[i+2]-b.data[i+2])
  )/3;
}

function motionRatio(a,b,step=8,threshold=35){
  let changed=0,count=0;

  for(let y=0;y<H;y+=step){
    for(let x=0;x<W;x+=step){
      const i=(y*W+x)*4;
      count++;

      if(pixelDifference(a,b,i)>threshold){
        changed++;
      }
    }
  }

  return changed/Math.max(1,count);
}

async function waitForStability(token){
  let previous=null;
  let stable=0;

  const started=Date.now();

  while(Date.now()-started<15000){
    if(token!==cameraToken){
      throw Error("Camera changed");
    }

    await sleep(350);

    const frame=capture();

    if(previous){
      const movement=motionRatio(previous,frame);

      stable=movement<CFG.stableThreshold
        ?stable+1:0;

      status(
        "STABILIZING CAMERA "+
        stable+"/"+CFG.stableRequired
      );

      if(stable>=CFG.stableRequired){
        return frame;
      }
    }

    previous=frame;
  }

  throw Error("Camera could not stabilize");
}

async function startCamera(){
  stopLoop();

  const token=++cameraToken;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }

  stream=null;
  video.srcObject=null;

  board=null;
  calibrated=false;
  calibrating=false;

  emptyBoard=null;
  referenceFrame=null;
  previousFrame=null;

  lastMarker=null;

  unlockZoom();

  $("calibrate").classList.remove("hidden");
  $("calibrate").disabled=true;

  setLive("","SYSTEM IDLE");
  status("CONNECTING CAMERA");

  try{
    const s=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      }
    });

    if(token!==cameraToken){
      s.getTracks().forEach(t=>t.stop());
      return;
    }

    stream=s;
    video.srcObject=s;

    await video.play();

    if(token!==cameraToken)return;

    const scale=Math.min(
      1,
      480/Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );

    W=Math.round(video.videoWidth*scale);
    H=Math.round(video.videoHeight*scale);

    preview.width=W;
    preview.height=H;

    $("resolution").textContent=
      video.videoWidth+" × "+
      video.videoHeight;

    $("cameraStatus").textContent="Camera active";

    $("calibrate").disabled=false;

    resize();
    renderCamera();

    status("ADJUST ZOOM BEFORE CALIBRATION");

    message(
      "Keep the full double ring inside the camera"
    );

  }catch(e){
    status("CAMERA ERROR");
    message(e.message);
  }
}

function classify(r,g,b){
  if(
    Math.max(r,g,b)-
    Math.min(r,g,b)<35
  )return 0;

  if(r>65&&r>g*1.3&&r>b*1.25)return 1;
  if(g>45&&g>r*1.15&&g>b*1.12)return 2;

  return 0;
}

function makeMask(frame){
  const mask=new Uint8Array(W*H);

  for(let i=0;i<W*H;i++){
    const j=i*4;

    mask[i]=classify(
      frame.data[j],
      frame.data[j+1],
      frame.data[j+2]
    );
  }

  return mask;
}

function maskAt(mask,x,y){
  x=Math.round(x);
  y=Math.round(y);

  if(x<0||y<0||x>=W||y>=H)return 0;

  return mask[y*W+x];
}

function ringStrength(mask,cx,cy,rx,ry){
  let hits=0,valid=0;

  for(let i=0;i<80;i++){
    const a=i*Math.PI/40;

    const x=cx+Math.cos(a)*rx;
    const y=cy+Math.sin(a)*ry;

    if(x<0||y<0||x>=W||y>=H)continue;

    valid++;

    if(maskAt(mask,x,y))hits++;
  }

  return valid?hits/valid:0;
}

function geometrySearch(mask){
  let best=null;
  const md=Math.min(W,H);

  function scan(
    cx0,cy0,sx,sy,
    r0,r1,step,rs,ratios
  ){
    for(let cy=cy0-sy;cy<=cy0+sy;cy+=step){
      for(let cx=cx0-sx;cx<=cx0+sx;cx+=step){
        for(let rx=r0;rx<=r1;rx+=rs){
          for(const ratio of ratios){
            const ry=rx*ratio;

            if(
              cx-rx<2||cx+rx>=W-2||
              cy-ry<2||cy+ry>=H-2
            )continue;

            const outer=ringStrength(
              mask,cx,cy,
              rx*.965,ry*.965
            );

            const triple=ringStrength(
              mask,cx,cy,
              rx*103/170,
              ry*103/170
            );

            const bull=ringStrength(
              mask,cx,cy,
              rx*15.9/170,
              ry*15.9/170
            );

            const quality=
              outer*.45+
              triple*.40+
              bull*.15;

            if(!best||quality>best.quality){
              best={
                x:cx,y:cy,rx,ry,
                outer,triple,bull,quality
              };
            }
          }
        }
      }
    }
  }

  scan(
    W/2,H/2,
    W*.18,H*.18,
    md*.24,md*.49,
    8,6,
    [.75,.9,1,1.1,1.25]
  );

  if(best){
    const g=best;
    const ratio=g.ry/g.rx;

    scan(
      g.x,g.y,9,9,
      Math.max(10,g.rx-8),
      g.rx+8,
      3,3,
      [ratio-.07,ratio,ratio+.07]
    );
  }

  return best;
}

function estimateRotation(mask,g){
  let best={rotation:0,quality:0};

  for(let rot=-9;rot<=9;rot++){
    let hits=0,count=0;

    for(let i=0;i<20;i++){
      const a=(-90+rot+i*18)*Math.PI/180;

      const color=maskAt(
        mask,
        g.x+Math.cos(a)*g.rx*.965,
        g.y+Math.sin(a)*g.ry*.965
      );

      if(!color)continue;

      count++;

      if(color===(i%2===0?1:2)){
        hits++;
      }
    }

    const quality=count?hits/count:0;

    if(quality>best.quality){
      best={rotation:rot,quality};
    }
  }

  return best;
}

async function calibrate(){
  if(calibrating||!ready())return;

  stopLoop();

  calibrating=true;
  calibrated=false;

  $("calibrate").disabled=true;

  const token=cameraToken;

  try{
    setLive("wait","CALIBRATING");

    for(let n=3;n>=1;n--){
      status("CALIBRATION STARTS IN "+n);
      await sleep(1000);

      if(token!==cameraToken)return;
    }

    status("STABILIZING CAMERA");

    const frame=await waitForStability(token);

    status("DETECTING SCORING RINGS");

    const mask=makeMask(frame);
    const g=geometrySearch(mask);

    if(
      !g||
      g.outer<.35||
      g.triple<.30||
      g.quality<.35
    ){
      throw Error(
        "Scoring rings not reliably detected. Reduce zoom."
      );
    }

    const orientation=estimateRotation(mask,g);

    board={
      x:g.x,
      y:g.y,
      rx:g.rx,
      ry:g.ry,
      rotation:orientation.rotation,
      quality:g.quality,
      zoom:zoom
    };

    /*
      Lock zoom and remove calibration lines.
    */

    calibrated=true;
    lockZoom();
    drawOverlay();

    $("calibrate").classList.add("hidden");

    $("details").textContent=
      "Calibration complete | Zoom "+zoom.toFixed(1)+"×";

    emptyBoard=frame;
    referenceFrame=frame;
    previousFrame=null;

    stableCount=0;
    candidateCount=0;
    previousCandidate=null;

    status("LIVE MONITORING");
    setLive("active","LIVE VISION ACTIVE");

    message("Throw your first dart");

    startLoop();

  }catch(e){
    calibrated=false;
    board=null;

    drawOverlay();

    status("CALIBRATION FAILED");
    setLive("error","CALIBRATION ERROR");
    message(e.message);

    unlockZoom();

  }finally{
    calibrating=false;

    if(!calibrated){
      $("calibrate").disabled=!ready();
    }
  }
}

function normalized(x,y){
  return {
    x:(x-board.x)/board.rx,
    y:(y-board.y)/board.ry
  };
}

function onBoard(x,y){
  const p=normalized(x,y);
  return Math.hypot(p.x,p.y)<=1.02;
}

function changedPixels(a,b){
  const pixels=[];

  for(let y=2;y<H-2;y+=2){
    for(let x=2;x<W-2;x+=2){
      if(!onBoard(x,y))continue;

      const i=(y*W+x)*4;
      const diff=pixelDifference(a,b,i);

      if(diff>CFG.pixelThreshold){
        pixels.push({x,y,diff});
      }
    }
  }

  return pixels;
}

function findCandidate(pixels){
  if(pixels.length<CFG.minPixels)return null;
  if(pixels.length>CFG.maxPixels)return null;

  const cellSize=8;
  const cells=new Map();

  for(const p of pixels){
    const cx=Math.floor(p.x/cellSize);
    const cy=Math.floor(p.y/cellSize);
    const key=cx+","+cy;

    if(!cells.has(key)){
      cells.set(key,{
        cx,cy,points:[],seen:false
      });
    }

    cells.get(key).points.push(p);
  }

  const groups=[];

  for(const start of cells.values()){
    if(start.seen)continue;

    const queue=[start];
    const points=[];
    start.seen=true;

    for(let k=0;k<queue.length;k++){
      const c=queue[k];
      points.push(...c.points);

      for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
          if(!dx&&!dy)continue;

          const n=cells.get(
            (c.cx+dx)+","+(c.cy+dy)
          );

          if(n&&!n.seen){
            n.seen=true;
            queue.push(n);
          }
        }
      }
    }

    if(points.length>=CFG.minPixels){
      groups.push(points);
    }
  }

  if(groups.length!==1)return null;

  const group=groups[0];

  let minX=Infinity,minY=Infinity;
  let maxX=-Infinity,maxY=-Infinity;

  for(const p of group){
    minX=Math.min(minX,p.x);
    minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x);
    maxY=Math.max(maxY,p.y);
  }

  const width=maxX-minX;
  const height=maxY-minY;

  if(width<5&&height<5)return null;
  if(width>W*.35||height>H*.35)return null;

  let sx=0,sy=0;

  for(const p of group){
    sx+=p.x;
    sy+=p.y;
  }

  return {
    x:sx/group.length,
    y:sy/group.length,
    width,height,
    pixels:group.length,
    ambiguous:true
  };
}

function stopLoop(){
  monitoring=false;
  loopToken++;

  if(timer!==null){
    clearTimeout(timer);
    timer=null;
  }
}

function startLoop(){
  if(!calibrated||!ready())return;

  stopLoop();

  monitoring=true;

  const token=loopToken;

  function next(){
    if(!monitoring||token!==loopToken)return;

    timer=setTimeout(
      ()=>tick(token),
      CFG.interval
    );
  }

  function tick(id){
    if(!monitoring||id!==loopToken)return;

    try{
      const frame=capture();

      if(!previousFrame){
        previousFrame=frame;
        next();
        return;
      }

      const motion=motionRatio(
        previousFrame,frame
      );

      previousFrame=frame;

      if(motion>CFG.sceneThreshold){
        stableCount=0;
        candidateCount=0;
        previousCandidate=null;

        status("WAITING FOR CAMERA STABILITY");
        setLive("wait","CAMERA SETTLING");

        next();
        return;
      }

      stableCount++;

      if(stableCount<CFG.stableRequired){
        next();
        return;
      }

      if(!referenceFrame){
        referenceFrame=frame;
      }

      if(dartCount>=3){
        const emptyDifference=motionRatio(
          emptyBoard,frame,4,45
        );

        if(emptyDifference<CFG.removalThreshold){
          removalCount++;
        }else{
          removalCount=0;
        }

        if(removalCount>=CFG.removalFrames){
          resetVisit(false);

          emptyBoard=frame;
          referenceFrame=frame;

          status("NEW VISIT READY");
          message("Throw your first dart");
        }else{
          status("WAITING FOR DART REMOVAL");
          setLive("wait","REMOVE ALL DARTS");
        }

        next();
        return;
      }

      const changes=changedPixels(
        referenceFrame,frame
      );

      if(changes.length<CFG.minPixels){
        candidateCount=0;
        previousCandidate=null;

        status("LIVE MONITORING");
        setLive("active","LIVE VISION ACTIVE");

        next();
        return;
      }

      const hit=findCandidate(changes);

      if(!hit){
        candidateCount=0;
        previousCandidate=null;

        status("ANALYSING BOARD");
        next();
        return;
      }

      if(previousCandidate){
        const distance=Math.hypot(
          hit.x-previousCandidate.x,
          hit.y-previousCandidate.y
        );

        candidateCount=
          distance<=CFG.candidateTolerance
            ?candidateCount+1
            :1;
      }else{
        candidateCount=1;
      }

      previousCandidate=hit;

      if(candidateCount<CFG.candidateRequired){
        status("VERIFYING DART CANDIDATE");
        next();
        return;
      }

      /*
        A changed-pixel centroid is not a
        verified dart impact point.

        Do not automatically record a false
        score, especially a false Bull 50.
      */

      if(hit.ambiguous){
        status("DART CANDIDATE | SCORE UNVERIFIED");

        setLive("wait","IMPACT POINT UNVERIFIED");

        message(
          "Dart candidate found; tip detection still required"
        );

        candidateCount=0;
        previousCandidate=null;

        next();
        return;
      }

    }catch(e){
      status("MONITORING ERROR");
      setLive("error","VISION ERROR");
      message(e.message);
    }

    next();
  }

  next();
}

function resetVisit(restart=true){
  visitTotal=0;
  dartCount=0;
  removalCount=0;

  candidateCount=0;
  previousCandidate=null;
  stableCount=0;

  lastMarker=null;

  $("score").textContent="---";
  $("total").textContent="0";
  $("darts").textContent="0/3";

  drawOverlay();

  if(restart&&calibrated){
    referenceFrame=null;
    previousFrame=null;

    status("RESETTING VISIT");
    message("Remove all darts");

    startLoop();
  }
}

$("calibrate").onclick=calibrate;
$("reset").onclick=()=>resetVisit(true);
$("restart").onclick=startCamera;

window.addEventListener("resize",resize);

if(window.ResizeObserver){
  new ResizeObserver(resize).observe(app);
}

window.addEventListener("pagehide",()=>{
  stopLoop();
  cameraToken++;

  cancelAnimationFrame(animationId);

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
});

window.addEventListener("DOMContentLoaded",()=>{
  previewLoop();
  startCamera();
});
</script>
