
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050b16">
<title>DARTIQ | Auto-Scoring V15</title>

<style>
:root{
  --bg:#050b16;
  --blue:#27b8ff;
  --white:#f4faff;
  --muted:#9bb4ca;
  --green:#37f5a1;
  --red:#ff6678;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:var(--white);
  font-family:Arial,Helvetica,sans-serif;
}
button,input{font:inherit}
button{
  border:1px solid var(--blue);
  border-radius:10px;
  background:#102b45;
  color:white;
  font-weight:800;
  padding:10px;
  cursor:pointer;
}
button:disabled{opacity:.4}
#app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:env(safe-area-inset-top) 8px
          env(safe-area-inset-bottom);
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  height:43px;
  flex-shrink:0;
}
.brand{
  color:var(--blue);
  font-size:22px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 0 12px #27b8ff77;
}
.version{
  color:var(--muted);
  font-size:10px;
  text-align:right;
}
#stage{
  position:relative;
  flex:1;
  min-height:0;
  overflow:hidden;
  border:1px solid #245477;
  border-radius:12px;
  background:black;
}
#camera{display:none}
#view{
  display:block;
  width:100%;
  height:100%;
}
#topStatus{
  position:absolute;
  top:8px;
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  gap:6px;
  pointer-events:none;
}
.pill{
  padding:7px 9px;
  background:#04101de8;
  border:1px solid #285675;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
  max-width:70%;
}

  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;

}

  position:absolute;
  bottom:8px;
  left:8px;
  right:8px;
  padding:8px;
  background:#04101de8;
  border:1px solid #285675;
  border-radius:8px;
  text-align:center;
  font-size:11px;

  flex-shrink:0;

  display:flex;

  color:#7899b4;

<body>
<div id="app">
  <header>
    <div class="brand">DARTIQ</div>
    <div class="version">
      AUTO-SCORING<br>
      PROTOTYPE V15
    </div>
  </header>

  <div id="stage">
    <video id="camera"
      autoplay
      muted
      playsinline></video>

    <canvas id="view"></canvas>

    <div id="topStatus">
      <div class="pill">
        <span id="stateDot"></span>
        <span id="status">START CAMERA</span>
      </div>
      <div class="pill" id="counter">0 / 3</div>
    </div>

    <div id="bottomStatus">
      CAMERA NOT STARTED
    </div>
  </div>

  <div id="controls">
    <div id="zoomRow">
      <span>ZOOM</span>
      <input id="zoom" type="range"
        min="1" max="2.5" step=".05" value="1.3">
      <strong id="zoomValue">1.30×</strong>
    </div>

    <button id="calibrate">
      START CAMERA
    </button>

    <div id="scores">
      <div class="scoreBox">
        <small>LAST DART</small>
        <strong id="last">0</strong>
      </div>
      <div class="scoreBox">
        <small>VISIT TOTAL</small>
        <strong id="total">0</strong>
      </div>
      <div class="scoreBox">
        <small>DARTS</small>
        <strong id="count">0/3</strong>
      </div>
    </div>

    <div id="darts">
      <div class="dartChip" id="dart0">D1 · —</div>
      <div class="dartChip" id="dart1">D2 · —</div>
      <div class="dartChip" id="dart2">D3 · —</div>
    </div>

    <div id="actions">
      <button id="correct">CORRECT SCORE</button>
      <button id="restart">RESTART CAMERA</button>
    </div>

    <div id="correction">
      <input id="correctionInput"
        type="number"
        min="0"
        max="60"
        placeholder="Correct last dart score">
      <button id="saveCorrection">SAVE</button>
      <button id="cancelCorrection">✕</button>
    </div>

    <div id="debug">Waiting for camera</div>
  </div>
</div>

<script>
"use strict";

/*
 DARTIQ AUTO-SCORING V15
 Standalone smartphone prototype.

 Detection strategy:
 - One camera capture pipeline.
 - Automatic colour-ring calibration.
 - Visible calibration overlay.
 - Persistent empty-board reference.
 - Localised frame differences.
 - Global camera movement compensation.
 - New-dart candidate confirmation.
 - Accepted scores never reset on a
   temporary detection failure.
 - Removal checked against empty board.
 - Speech unlocked from user gesture.

 IMPORTANT:
 A single oblique camera cannot guarantee
 perfect dart-tip identification.
 This implementation requires real testing.
*/

const $=id=>document.getElementById(id);

const video=$("camera");
const canvas=$("view");
const ctx=canvas.getContext("2d",{
  alpha:false
});

const work=document.createElement("canvas");
const wc=work.getContext("2d",{
  willReadFrequently:true
});

const W=420;
const H=560;

work.width=W;
work.height=H;

const sectors=[
  20,1,18,4,13,
  6,10,15,2,17,
  3,19,7,16,8,
  11,14,9,12,5
];

const params=new URLSearchParams(location.search);
const playerName=
  params.get("playername") ||
  params.get("player") ||
  "Player";

let stream=null;
let running=false;
let calibrated=false;
let calibrating=false;

let zoom=1.3;

let board=null;
let emptyFrame=null;
let referenceFrame=null;
let previousFrame=null;

let darts=[];
let candidate=null;

let lastAnalysis=0;
let lastAccepted=0;
let lastImpact=0;
let impactArmed=false;

let removalFrames=0;
let motionFrames=0;
let stableFrames=0;

let speechReady=false;
let speechVoice=null;

let calibrateStart=0;
let calibrationSamples=[];

let lastDiffRatio=0;
let lastEmptyRatio=0;

let monitorBusy=false;
let calibrationBusy=false;

const CONFIG={
  analysisInterval:220,
  differenceThreshold:42,
  candidateConfirmations:3,
  candidateDistance:21,
  dartCooldown:850,
  removalConfirmations:10,
  removalSimilarity:.025,
  movementThreshold:.15,
  impactThreshold:.005,
  minCandidatePixels:13,
  minCandidateLength:13
};

function status(message,color="red",bottom=null){
  $("status").textContent=message;

  $("stateDot").style.background=
    color==="green"?"#37f5a1":
    color==="blue"?"#27b8ff":
    color==="yellow"?"#ffd166":
    "#ff6678";

  if(bottom!==null){
    $("bottomStatus").textContent=bottom;
  }
}

function debug(message){
  $("debug").textContent=message;
}

function updateHUD(){
  const total=darts.reduce(
    (sum,d)=>sum+d.score,0
  );

  $("last").textContent=
    darts.length
      ? darts[darts.length-1].score
      : 0;

  $("total").textContent=total;
  $("count").textContent=darts.length+"/3";
  $("counter").textContent=darts.length+" / 3";

  for(let i=0;i<3;i++){
    const el=$("dart"+i);
    const dart=darts[i];

    el.textContent=dart
      ? `D${i+1} · ${dart.label}`
      : `D${i+1} · —`;

    el.classList.toggle("active",!!dart);
  }
}

/* CAMERA */

async function startCamera(){
  stopCamera();

  status(
    "STARTING CAMERA",
    "yellow",
    "Requesting rear camera"
  );

  try{
    stream=await navigator.mediaDevices
      .getUserMedia({
        audio:false,
        video:{
          facingMode:{ideal:"environment"},
          width:{ideal:1280},
          height:{ideal:720},
          frameRate:{ideal:30}
        }
      });

    video.srcObject=stream;
    await video.play();

    running=true;

    resetEngine();

    $("calibrate").textContent=
      "START AUTO CALIBRATION";

    status(
      "CAMERA READY",
      "blue",
      "Adjust zoom, then calibrate"
    );

    requestAnimationFrame(renderLoop);
  }catch(err){
    status(
      "CAMERA ERROR",
      "red",
      err.message
    );
    debug(err.message);
  }
}

function stopCamera(){
  running=false;
  calibrated=false;
  calibrating=false;

  if(stream){
    stream.getTracks().forEach(
      track=>track.stop()
    );
  }

  stream=null;
  video.srcObject=null;
}

function resetEngine(){
  calibrated=false;
  calibrating=false;
  board=null;

  emptyFrame=null;
  referenceFrame=null;
  previousFrame=null;

  darts=[];
  candidate=null;

  lastAccepted=0;
  lastImpact=0;

  impactArmed=false;
  removalFrames=0;
  motionFrames=0;
  stableFrames=0;

  calibrationSamples=[];

  updateHUD();
}

function drawCamera(){
  if(!video.videoWidth)return;

  const vw=video.videoWidth;
  const vh=video.videoHeight;

  const targetAspect=W/H;
  const videoAspect=vw/vh;

  let sw,sh;

  if(videoAspect>targetAspect){
    sh=vh/zoom;
    sw=sh*targetAspect;
  }else{
    sw=vw/zoom;
    sh=sw/targetAspect;
  }

  const sx=(vw-sw)/2;
  const sy=(vh-sh)/2;

  wc.drawImage(
    video,
    sx,sy,sw,sh,
    0,0,W,H
  );
}

function capture(){
  drawCamera();

  return wc.getImageData(
    0,0,W,H
  );
}

function renderLoop(now){
  if(!running)return;

  drawCamera();

  const cw=$("stage").clientWidth;
  const ch=$("stage").clientHeight;

  if(canvas.width!==cw||canvas.height!==ch){
    canvas.width=cw;
    canvas.height=ch;
  }

  ctx.drawImage(
    work,0,0,cw,ch
  );

  const sx=cw/W;
  const sy=ch/H;

  ctx.save();
  ctx.scale(sx,sy);

  if(board){
    if(calibrating){
      drawCalibrationOverlay(
        "yellow",true
      );
    }else if(calibrated){
      drawAcceptedDarts();
    }
  }

  ctx.restore();

  if(calibrating){
    if(!calibrationBusy){
      calibrationBusy=true;
      try{
        processCalibration(now);
      }finally{
        calibrationBusy=false;
      }
    }
  }else if(
    calibrated &&
    now-lastAnalysis>=CONFIG.analysisInterval
  ){
    lastAnalysis=now;

    if(!monitorBusy){
      monitorBusy=true;
      try{
        monitor(now);
      }finally{
        monitorBusy=false;
      }
    }
  }

  requestAnimationFrame(renderLoop);
}

/* VOICE */

function chooseVoice(){
  if(!("speechSynthesis" in window))return;

  const voices=speechSynthesis.getVoices();

  speechVoice=
    voices.find(v=>
      /^en/i.test(v.lang) &&
      /male|david|daniel|george|guy|ryan/i
        .test(v.name)
    ) ||
    voices.find(v=>/^en/i.test(v.lang)) ||
    voices[0] ||
    null;
}

function unlockVoice(){
  if(!("speechSynthesis" in window)){
    debug("Speech not supported by browser");
    return;
  }

  chooseVoice();

  speechReady=true;

  // Speech is initiated by a real user tap.
  // Some Android browsers require this.
  const warmup=new SpeechSynthesisUtterance(" ");
  warmup.volume=0;
  warmup.lang="en-GB";

  try{
    speechSynthesis.cancel();
    speechSynthesis.speak(warmup);
  }catch(err){
    debug("Voice activation: "+err.message);
  }
}

function speak(message){
  if(!speechReady)return;
  if(!("speechSynthesis" in window))return;

  try{
    speechSynthesis.cancel();

    const utterance=
      new SpeechSynthesisUtterance(message);

    utterance.lang="en-GB";
    utterance.rate=.92;
    utterance.pitch=.9;
    utterance.volume=1;

    if(speechVoice){
      utterance.voice=speechVoice;
    }

    speechSynthesis.speak(utterance);
  }catch(err){
    debug("Speech error: "+err.message);
  }
}

if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged=chooseVoice;
  chooseVoice();
}

/* CALIBRATION */

function isRingColour(r,g,b){
  const mx=Math.max(r,g,b);
  const mn=Math.min(r,g,b);

  if(mx-mn<48)return false;

  const red=
    r>72 &&
    r>g*1.3 &&
    r>b*1.25;

  const green=
    g>60 &&
    g>r*1.2 &&
    g>b*1.12;

  return red||green;
}

function ringPoints(frame){
  const data=frame.data;
  const points=[];

  for(let y=15;y<H-15;y+=2){
    for(let x=15;x<W-15;x+=2){
      const p=(y*W+x)*4;

      const r=data[p];
      const g=data[p+1];
      const b=data[p+2];

      if(isRingColour(r,g,b)){
        points.push({x,y});
      }
    }
  }

  return points;
}

function quantile(arr,q){
  if(!arr.length)return 0;

  const sorted=[...arr].sort(
    (a,b)=>a-b
  );

  return sorted[
    Math.min(
      sorted.length-1,
      Math.floor(q*(sorted.length-1))
    )
  ];
}

function estimateBoard(frame){
  const points=ringPoints(frame);

  if(points.length<90){
    return null;
  }

  // Use robust colour-point distribution.
  // Red/green doubles and triples
  // supply approximate board geometry.
  const xs=points.map(p=>p.x);
  const ys=points.map(p=>p.y);

  let cx=quantile(xs,.5);
  let cy=quantile(ys,.5);

  let rx=(
    quantile(xs,.985)-
    quantile(xs,.015)
  )/2;

  let ry=(
    quantile(ys,.985)-
    quantile(ys,.015)
  )/2;

  if(
    rx<55||ry<70||
    rx>W*.65||ry>H*.65
  ){
    return null;
  }

  // Refine center from symmetric
  // extremes of colour points.
  cx=(
    quantile(xs,.985)+
    quantile(xs,.015)
  )/2;

  cy=(
    quantile(ys,.985)+
    quantile(ys,.015)
  )/2;

  // Find the outer colour-ring radius.
  const radial=[];

  for(const p of points){
    const dx=(p.x-cx)/rx;
    const dy=(p.y-cy)/ry;

    radial.push(
      Math.sqrt(dx*dx+dy*dy)
    );
  }

  const outer=quantile(radial,.92);

  if(outer<.55||outer>1.35){
    return null;
  }

  rx*=outer;
  ry*=outer;

  return {
    cx,cy,rx,ry,
    confidence:Math.min(
      100,
      Math.round(points.length/18)
    )
  };
}

function median(values){
  return quantile(values,.5);
}

function combineCalibration(samples){
  if(!samples.length)return null;

  return {
    cx:median(samples.map(b=>b.cx)),
    cy:median(samples.map(b=>b.cy)),
    rx:median(samples.map(b=>b.rx)),
    ry:median(samples.map(b=>b.ry)),
    confidence:median(
      samples.map(b=>b.confidence)
    )
  };
}

function drawEllipse(radius,color,width=1.5){
  ctx.beginPath();

  ctx.ellipse(
    board.cx,
    board.cy,
    board.rx*radius,
    board.ry*radius,
    0,0,Math.PI*2
  );

  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.stroke();
}

function drawCalibrationOverlay(
  colour="yellow",
  showSegments=true
){
  if(!board)return;

  const c=colour==="green"
    ? "#37f5a1"
    : "#ffd166";

  ctx.save();

  ctx.shadowColor=c;
  ctx.shadowBlur=5;

  // Double ring
  drawEllipse(1,c,2);
  drawEllipse(162/170,c,1);

  // Triple ring
  drawEllipse(107/170,c,2);
  drawEllipse(99/170,c,1);

  // Bull and outer bull
  drawEllipse(15.9/170,c,1.5);
  drawEllipse(6.35/170,c,2);

  if(showSegments){
    for(let i=0;i<20;i++){
      const angle=(
        i*18-9-90
      )*Math.PI/180;

      const ux=Math.cos(angle);
      const uy=Math.sin(angle);

      ctx.beginPath();

      ctx.moveTo(
        board.cx+ux*board.rx*.094,
        board.cy+uy*board.ry*.094
      );

      ctx.lineTo(
        board.cx+ux*board.rx,
        board.cy+uy*board.ry
      );

      ctx.strokeStyle=c;
      ctx.lineWidth=1;
      ctx.stroke();
    }
  }

  ctx.beginPath();
  ctx.arc(
    board.cx,
    board.cy,
    4,
    0,Math.PI*2
  );
  ctx.fillStyle=c;
  ctx.fill();

  ctx.restore();
}

function startCalibration(){
  if(!running){
    startCamera();
    return;
  }

  unlockVoice();

  calibrated=false;
  calibrating=true;

  darts=[];
  candidate=null;

  calibrationSamples=[];
  calibrateStart=performance.now();

  board=null;

  updateHUD();

  $("calibrate").disabled=true;
  $("calibrate").textContent=
    "CALIBRATING...";

  status(
    "CALIBRATING",
    "yellow",
    "Detecting board and drawing alignment lines"
  );
}

function processCalibration(now){
  if(now-calibrateStart<300)return;

  const frame=capture();
  const detected=estimateBoard(frame);

  if(detected){
    calibrationSamples.push(detected);

    if(calibrationSamples.length>18){
      calibrationSamples.shift();
    }

    board=combineCalibration(
      calibrationSamples
    );

    debug(
      "Board detected · "+
      calibrationSamples.length+
      " calibration samples"
    );
  }else{
    debug(
      "Searching for red/green scoring rings"
    );
  }

  const elapsed=now-calibrateStart;

  if(
    elapsed>=3000 &&
    calibrationSamples.length>=7
  ){
    finishCalibration();
    return;
  }

  if(elapsed>=10000){
    calibrating=false;

    $("calibrate").disabled=false;
    $("calibrate").textContent=
      "RETRY CALIBRATION";

    status(
      "CALIBRATION FAILED",
      "red",
      "Center the board, improve lighting, retry"
    );
  }
}

function finishCalibration(){
  calibrating=false;
  calibrated=true;

  // Calibration geometry remains internally,
  // but overlay lines disappear immediately.
  emptyFrame=capture();
  referenceFrame=emptyFrame;
  previousFrame=emptyFrame;

  candidate=null;
  darts=[];

  impactArmed=false;
  removalFrames=0;
  stableFrames=0;

  lastAccepted=performance.now();

  $("calibrate").disabled=false;
  $("calibrate").textContent=
    "RECALIBRATE";

  $("zoom").disabled=true;

  updateHUD();

  status(
    "LIVE MONITORING",
    "green",
    "Calibration complete · Throw your first dart"
  );

  debug(
    "Calibration successful · Monitoring active"
  );
}

/* IMAGE DIFFERENCE */

function luminance(data,p){
  return (
    data[p]*.299+
    data[p+1]*.587+
    data[p+2]*.114
  );
}

function colourDifference(
  a,b,p,q
){
  const dr=Math.abs(a[p]-b[q]);
  const dg=Math.abs(a[p+1]-b[q+1]);
  const db=Math.abs(a[p+2]-b[q+2]);

  return Math.max(
    dr,dg,db,
    (dr+dg+db)/2
  );
}

function insideBoard(x,y,scale=1.1){
  if(!board)return false;

  const dx=(x-board.cx)/
    (board.rx*scale);

  const dy=(y-board.cy)/
    (board.ry*scale);

  return dx*dx+dy*dy<=1;
}

function alignOffset(current,baseline){
  // Estimate small global camera shifts
  // from stable image texture.
  // This prevents minor tripod movement
  // from looking like dart impacts.

  const a=current.data;
  const b=baseline.data;

  let best={dx:0,dy:0,error:Infinity};

  for(let dy=-3;dy<=3;dy++){
    for(let dx=-3;dx<=3;dx++){
      let error=0;
      let count=0;

      for(let y=30;y<H-30;y+=14){
        for(let x=30;x<W-30;x+=14){
          // Exclude central scoring area
          // where darts are changing.
          if(insideBoard(x,y,.85))continue;

          const xx=x+dx;
          const yy=y+dy;

          if(
            xx<0||yy<0||
            xx>=W||yy>=H
          )continue;

          const p=(y*W+x)*4;
          const q=(yy*W+xx)*4;

          error+=Math.abs(
            luminance(a,p)-
            luminance(b,q)
          );

          count++;
        }
      }

      if(count){
        error/=count;
      }

      if(error<best.error){
        best={dx,dy,error};
      }
    }
  }

  return best;
}

function compareFrames(
  current,
  baseline,
  options={}
){
  const a=current.data;
  const b=baseline.data;

  const offset=alignOffset(
    current,baseline
  );

  const mask=new Uint8Array(W*H);

  let changed=0;
  let tested=0;

  const threshold=
    options.threshold ||
    CONFIG.differenceThreshold;

  const radius=
    options.radius || 1.08;

  for(let y=12;y<H-12;y+=1){
    for(let x=12;x<W-12;x+=1){
      if(!insideBoard(x,y,radius)){
        continue;
      }

      const xx=x+offset.dx;
      const yy=y+offset.dy;

      if(
        xx<0||yy<0||
        xx>=W||yy>=H
      )continue;

      const p=(y*W+x)*4;
      const q=(yy*W+xx)*4;

      tested++;

      const delta=colourDifference(
        a,b,p,q
      );

      if(delta>threshold){
        mask[y*W+x]=1;
        changed++;
      }
    }
  }

  return {
    mask,
    changed,
    tested,
    ratio:tested?changed/tested:0,
    offset
  };
}

/* DART CANDIDATES */

function collectComponents(mask){
  const visited=new Uint8Array(
    W*H
  );

  const components=[];
  const stack=[];

  for(let y=15;y<H-15;y+=2){
    for(let x=15;x<W-15;x+=2){
      const start=y*W+x;

      if(
        !mask[start]||
        visited[start]
      )continue;

      const points=[];

      stack.length=0;
      stack.push(start);
      visited[start]=1;

      while(stack.length){
        const p=stack.pop();

        const px=p%W;
        const py=(p/W)|0;

        points.push({
          x:px,y:py
        });

        for(let oy=-1;oy<=1;oy++){
          for(let ox=-1;ox<=1;ox++){
            if(!ox&&!oy)continue;

            const nx=px+ox;
            const ny=py+oy;

            if(
              nx<1||ny<1||
              nx>=W-1||ny>=H-1
            )continue;

            const np=ny*W+nx;

            if(
              mask[np]&&
              !visited[np]
            ){
              visited[np]=1;
              stack.push(np);
            }
          }
        }
      }

      if(points.length>=
        CONFIG.minCandidatePixels
      ){
        components.push(points);
      }
    }
  }

  return components.sort(
    (a,b)=>b.length-a.length
  ).slice(0,30);
}

function principalAxis(points){
  let mx=0,my=0;

  for(const p of points){
    mx+=p.x;
    my+=p.y;
  }

  mx/=points.length;
  my/=points.length;

  let xx=0,xy=0,yy=0;

  for(const p of points){
    const dx=p.x-mx;
    const dy=p.y-my;

    xx+=dx*dx;
    xy+=dx*dy;
    yy+=dy*dy;
  }

  xx/=points.length;
  xy/=points.length;
  yy/=points.length;

  const angle=.5*Math.atan2(
    2*xy,xx-yy
  );

  const ux=Math.cos(angle);
  const uy=Math.sin(angle);

  let min=Infinity;
  let max=-Infinity;

  let widthSum=0;

  for(const p of points){
    const dx=p.x-mx;
    const dy=p.y-my;

    const projection=
      dx*ux+dy*uy;

    const perpendicular=
      -dx*uy+dy*ux;

    min=Math.min(min,projection);
    max=Math.max(max,projection);

    widthSum+=Math.abs(
      perpendicular
    );
  }

  const length=max-min;
  const width=
    widthSum/points.length*2;

  return {
    mx,my,ux,uy,
    min,max,length,width
  };
}

function distance(a,b){
  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}

function tipFromComponent(points){
  const axis=principalAxis(points);

  if(
    axis.length<
      CONFIG.minCandidateLength
  ){
    return null;
  }

  const endA={
    x:axis.mx+axis.ux*axis.min,
    y:axis.my+axis.uy*axis.min
  };

  const endB={
    x:axis.mx+axis.ux*axis.max,
    y:axis.my+axis.uy*axis.max
  };

  // For a shaft extending from outside the
  // board, the point usually lies closer
  // to the bull than the flight end.
  const center={
    x:board.cx,
    y:board.cy
  };

  const normalizedRadius=p=>{
    Math.hypot(
      (p.x-board.cx)/board.rx,
      (p.y-board.cy)/board.ry
    )
  };

  const ra=normalizedRadius(endA);
  const rb=normalizedRadius(endB);

  const tip=ra<=rb?endA:endB;

  if(!insideBoard(tip.x,tip.y,1.02)){
    return null;
  }

  const aspect=
    axis.length/
    Math.max(1,axis.width);

  if(aspect<1.35)return null;

  return {
    x:tip.x,
    y:tip.y,
    length:axis.length,
    width:axis.width,
    aspect,
    pixels:points.length,
    centerDistance:distance(tip,center)
  };
}

function detectNewDart(diff){
  const components=collectComponents(
    diff.mask
  );

  const possible=[];

  for(const points of components){
    const dart=tipFromComponent(
      points
    );

    if(!dart)continue;

    const nearExisting=darts.some(
      existing=>
        distance(existing,dart)<9
    );

    if(nearExisting)continue;

    // Prefer a long, narrow change,
    // not a broad lighting fluctuation.
    const confidence=
      Math.min(dart.length,100)*
      Math.min(dart.aspect,5);

    possible.push({
      ...dart,
      confidence
    });
  }

  possible.sort(
    (a,b)=>b.confidence-a.confidence
  );

  return possible[0]||null;
}

/* SCORE MAPPING */

function scoreAt(x,y){
  const nx=(x-board.cx)/board.rx;
  const ny=(y-board.cy)/board.ry;

  const r=Math.hypot(nx,ny);

  if(r>1.025){
    return {
      score:0,
      label:"MISS"
    };
  }

  if(r<=6.35/170){
    return {
      score:50,
      label:"BULL"
    };
  }

  if(r<=15.9/170){
    return {
      score:25,
      label:"25"
    };
  }

  const angle=(
    Math.atan2(ny,nx)*180/Math.PI+
    90+360
  )%360;

  const index=
    Math.floor(
      (angle+9)/18
    )%20;

  const value=sectors[index];

  if(r>=162/170){
    return {
      score:value*2,
      label:"D"+value
    };
  }

  if(
    r>=99/170 &&
    r<=107/170
  ){
    return {
      score:value*3,
      label:"T"+value
    };
  }

  return {
    score:value,
    label:"S"+value
  };
}

function registerDart(
  point,
  frame,
  now
){
  if(darts.length>=3)return;

  const result=scoreAt(
    point.x,point.y
  );

  darts.push({
    ...point,
    ...result
  });

  referenceFrame=frame;
  previousFrame=frame;

  candidate=null;
  impactArmed=false;

  lastAccepted=now;
  removalFrames=0;

  updateHUD();

  status(
    "DART REGISTERED",
    "green",
    `Dart ${darts.length}: ${result.label} · ${result.score} points`
  );

  debug(
    "Impact "+
    Math.round(point.x)+","+
    Math.round(point.y)+
    " · Confidence "+
    Math.round(point.confidence||0)
  );

  if(darts.length===3){
    finishVisit();
  }
}

function finishVisit(){
  const total=darts.reduce(
    (sum,d)=>sum+d.score,0
  );

  status(
    "VISIT COMPLETE",
    "green",
    `3 darts · ${total} scored · Remove darts`
  );

  speak(
    `${playerName}, ${total} scored.`
  );
}

function drawAcceptedDarts(){
  ctx.save();

  for(let i=0;i<darts.length;i++){
    const d=darts[i];

    ctx.beginPath();
    ctx.arc(
      d.x,d.y,
      8,0,Math.PI*2
    );

    ctx.strokeStyle="#37f5a1";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(d.x-12,d.y);
    ctx.lineTo(d.x+12,d.y);
    ctx.moveTo(d.x,d.y-12);
    ctx.lineTo(d.x,d.y+12);

    ctx.stroke();

    ctx.fillStyle="#37f5a1";
    ctx.font="bold 14px Arial";
    ctx.fillText(
      d.label,
      d.x+11,
      d.y-10
    );
  }

  ctx.restore();
}

/* REMOVAL DETECTION */

function registeredTipSimilarity(
  frame,
  baseline
){
  const a=frame.data;
  const b=baseline.data;

  let changed=0;
  let tested=0;

  for(const dart of darts){
    const cx=Math.round(dart.x);
    const cy=Math.round(dart.y);

    for(let dy=-13;dy<=13;dy+=2){
      for(let dx=-13;dx<=13;dx+=2){
        if(dx*dx+dy*dy>169)continue;

        const x=cx+dx;
        const y=cy+dy;

        if(
          x<0||y<0||
          x>=W||y>=H
        )continue;

        const p=(y*W+x)*4;

        tested++;

        if(colourDifference(
          a,b,p,p
        )>CONFIG.differenceThreshold){
          changed++;
        }
      }
    }
  }

  return tested?changed/tested:1;
}

function checkRemoval(frame,now){
  if(!darts.length)return false;

  if(now-lastAccepted<1600){
    return false;
  }

  const emptyDiff=compareFrames(
    frame,
    emptyFrame,
    {threshold:45,radius:1.02}
  );

  lastEmptyRatio=emptyDiff.ratio;

  const tipDifference=
    registeredTipSimilarity(
      frame,
      emptyFrame
    );

  // Both whole-board and accepted-tip
  // areas must resemble the empty board.
  const looksEmpty=
    emptyDiff.ratio<
      CONFIG.removalSimilarity &&
    tipDifference<.12;

  if(looksEmpty){
    removalFrames++;
  }else{
    removalFrames=0;
  }

  if(
    removalFrames>=
    CONFIG.removalConfirmations
  ){
    startNextVisit(frame);
    return true;
  }

  return false;
}

function startNextVisit(frame){
  darts=[];
  candidate=null;

  referenceFrame=frame;
  previousFrame=frame;
  emptyFrame=frame;

  impactArmed=false;
  removalFrames=0;
  stableFrames=0;

  lastAccepted=performance.now();

  updateHUD();

  status(
    "NEW VISIT",
    "green",
    "Darts removed · Ready for first dart"
  );

  debug(
    "Automatic reset completed"
  );
}

/* LIVE MONITORING */

function monitor(now){
  if(!calibrated||!board)return;

  const frame=capture();

  if(!previousFrame){
    previousFrame=frame;
    return;
  }

  const shortDiff=compareFrames(
    frame,
    previousFrame,
    {threshold:52}
  );

  const baselineDiff=compareFrames(
    frame,
    referenceFrame,
    {threshold:43}
  );

  lastDiffRatio=baselineDiff.ratio;

  const globalMovement=
    shortDiff.offset.error>28 ||
    shortDiff.ratio>
      CONFIG.movementThreshold;

  if(globalMovement){
    motionFrames++;
    stableFrames=0;

    // Keep existing dart scores.
    // Do not reset a visit due to movement.
    candidate=null;

    status(
      "CAMERA / DART MOVEMENT",
      "yellow",
      "Monitoring movement"
    );

    previousFrame=frame;
    return;
  }

  stableFrames++;

  if(shortDiff.ratio>
    CONFIG.impactThreshold){
    impactArmed=true;
    lastImpact=now;
  }

  // Existing darts can only be cleared
  // after sustained empty-board evidence.
  if(checkRemoval(frame,now)){
    return;
  }

  if(darts.length===3){
    previousFrame=frame;

    status(
      "VISIT COMPLETE",
      "green",
      "Remove all three darts"
    );

    debug(
      "Empty-board difference "+
      lastEmptyRatio.toFixed(3)+
      " · reset "+
      removalFrames+"/"+
      CONFIG.removalConfirmations
    );

    return;
  }

  if(
    now-lastAccepted<
      CONFIG.dartCooldown
  ){
    previousFrame=frame;
    return;
  }

  // Require a meaningful new object
  // relative to the last accepted frame.
  if(
    baselineDiff.ratio<.0015
  ){
    candidate=null;
    previousFrame=frame;

    status(
      "LIVE MONITORING",
      "green",
      "Waiting for dart "+
      (darts.length+1)
    );

    return;
  }

  // Do not permanently block scoring
  // because the camera moved briefly.
  const detected=detectNewDart(
    baselineDiff
  );

  if(detected){
    if(
      candidate &&
      distance(
        candidate,detected
      )<CONFIG.candidateDistance
    ){
      candidate.confirmations++;

      candidate.x=
        candidate.x*.6+
        detected.x*.4;

      candidate.y=
        candidate.y*.6+
        detected.y*.4;

      candidate.confidence=
        detected.confidence;
    }else{
      candidate={
        ...detected,
        confirmations:1
      };
    }

    status(
      "DART CANDIDATE",
      "blue",
      "Confirming impact "+
      candidate.confirmations+
      "/"+
      CONFIG.candidateConfirmations
    );

    if(
      candidate.confirmations>=
      CONFIG.candidateConfirmations
    ){
      registerDart(
        candidate,
        frame,
        now
      );

      return;
    }
  }else{
    candidate=null;

    status(
      "LIVE MONITORING",
      "green",
      "Scanning for dart "+
      (darts.length+1)
    );
  }

  debug(
    "Change "+
    baselineDiff.ratio.toFixed(4)+
    " · motion "+
    shortDiff.ratio.toFixed(4)+
    " · candidates "+
    (candidate?
      candidate.confirmations:0)
  );

  previousFrame=frame;
}

/* MANUAL CORRECTION */

function openCorrection(){
  if(!darts.length){
    status(
      "NO DART TO CORRECT",
      "yellow",
      "A dart must be registered first"
    );
    return;
  }

  $("correction").style.display="flex";

  $("correctionInput").value=
    darts[darts.length-1].score;

  $("correctionInput").focus();
}

function saveCorrection(){
  if(!darts.length)return;

  const value=Number(
    $("correctionInput").value
  );

  if(
    !Number.isInteger(value)||
    value<0||
    value>60
  ){
    status(
      "INVALID SCORE",
      "red",
      "Enter a score from 0 to 60"
    );
    return;
  }

  const dart=darts[darts.length-1];

  dart.score=value;
  dart.label=String(value);

  $("correction").style.display="none";

  updateHUD();

  status(
    "SCORE CORRECTED",
    "green",
    "Last dart updated to "+value
  );

  if(darts.length===3){
    const total=darts.reduce(
      (sum,d)=>sum+d.score,0
    );

    speak(
      `${playerName}, corrected visit total ${total}.`
    );
  }
}

/* EVENTS */

$("zoom").addEventListener(
  "input",event=>{
    if(calibrated||calibrating)return;

    zoom=Number(event.target.value);

    $("zoomValue").textContent=
      zoom.toFixed(2)+"×";
  }
);

$("calibrate").addEventListener(
  "click",async()=>{
    unlockVoice();

    if(!running){
      await startCamera();
    }else{
      startCalibration();
    }
  }
);

$("restart").addEventListener(
  "click",async()=>{
    unlockVoice();

    $("zoom").disabled=false;

    await startCamera();
  }
);

$("correct").addEventListener(
  "click",openCorrection
);

$("saveCorrection").addEventListener(
  "click",saveCorrection
);

$("cancelCorrection").addEventListener(
  "click",()=>{
    $("correction").style.display="none";
  }
);

document.addEventListener(
  "visibilitychange",()=>{
    if(document.hidden){
      // Preserve scores.
      candidate=null;
    }else if(calibrated){
      previousFrame=capture();

      status(
        "LIVE MONITORING",
        "green",
        "Camera monitoring resumed"
      );
    }
  }
);

window.addEventListener(
  "beforeunload",stopCamera
);

updateHUD();

status(
  "READY",
  "blue",
  "Tap START CAMERA"
);

debug(
  "DARTIQ V15 · Standalone prototype"
);

</script>
