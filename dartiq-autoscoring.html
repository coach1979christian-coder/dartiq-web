<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b16">
<title>DARTIQ | Auto-Scoring V9</title>

<style>
:root{
  --bg:#050b16;
  --blue:#27b8ff;
  --green:#19e79a;
  --red:#ff5268;
  --muted:#b4c9dc;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:white;
  font-family:Arial,sans-serif;
}
button{font:inherit}
.app{
  position:relative;
  width:100%;
  max-width:800px;
  height:100vh;
  height:100dvh;
  margin:auto;
  overflow:hidden;
  background:#000;
}
video,canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
}
video{object-fit:contain}
canvas{pointer-events:none}
.top{
  position:absolute;
  top:0;
  left:0;
  right:0;
  z-index:2;
  padding:9px 12px 18px;
  text-align:center;
  background:linear-gradient(
    #020916fa,
    #020916a0,
    transparent
  );
}
.logo{
  margin:0;
  color:var(--blue);
  font-size:24px;
  letter-spacing:4px;
  text-shadow:0 0 14px #27b8ff99;
}
.subtitle{
  margin-top:3px;
  color:var(--muted);
  font-size:10px;
  letter-spacing:1px;
}
.camera-info{
  display:flex;
  justify-content:space-between;
  margin-top:7px;
  color:var(--muted);
  font-size:10px;
}
.bottom{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  z-index:3;
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:10px 10px max(12px,env(safe-area-inset-bottom));
  background:linear-gradient(
    transparent,
    #020916ed 12%,
    #020916 45%
  );
}
.status{
  min-height:18px;
  color:var(--blue);
  text-align:center;
  font-size:13px;
  font-weight:800;
}
button{
  min-height:42px;
  padding:10px 5px;
  background:var(--blue);
  color:#00121e;
  border:1px solid #27b8ff77;
  border-radius:9px;
  font-size:12px;
  font-weight:800;
}
button:disabled{opacity:.4}
.secondary{
  background:#18334d;
  color:white;
}
.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}
.metric{
  text-align:center;
  background:#031020ed;
  border:1px solid #27b8ff55;
  border-radius:9px;
  padding:9px 3px;
}
.metric small{
  display:block;
  color:var(--muted);
  font-size:9px;
}
.metric strong{
  display:block;
  margin-top:3px;
  color:var(--blue);
  font-size:27px;
}
.details,.message{
  text-align:center;
  color:var(--muted);
  font-size:11px;
}
.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
.indicator{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--muted);
  font-size:11px;
}
.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#64748b;
}
.dot.active{
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}
.dot.wait{background:#ffcc00}
.dot.error{background:var(--red)}
#calibrate.hidden{display:none}
@media(max-height:700px){
  .bottom{gap:4px;padding-top:5px}
  button{min-height:35px;padding:6px}
  .metric{padding:5px 2px}
  .metric strong{font-size:21px}
}
@media(max-height:560px){
  .logo{font-size:18px}
  .subtitle,.details{display:none}
  button{min-height:30px}
  .metric strong{font-size:18px}
}
</style>
</head>

<body>

<div class="app" id="app">

  <video id="camera" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>

  <div class="top">
    <h1 class="logo">DARTIQ</h1>
    <div class="subtitle">
      AUTO-SCORING V9 | AUTOMATIC LIVE VISION
    </div>
    <div class="camera-info">
      <span id="cameraStatus">Connecting camera...</span>
      <span id="resolution">---</span>
    </div>
  </div>

  <div class="bottom">

    <div class="status" id="status">
      WAITING FOR CAMERA
    </div>

    <div class="indicator">
      <span class="dot" id="liveDot"></span>
      <span id="liveText">SYSTEM IDLE</span>
    </div>

    <button id="calibrate" disabled>
      START AUTOMATIC CALIBRATION
    </button>

    <div class="metrics">
      <div class="metric">
        <small>LAST DART</small>
        <strong id="score">---</strong>
      </div>
      <div class="metric">
        <small>VISIT TOTAL</small>
        <strong id="total">0</strong>
      </div>
      <div class="metric">
        <small>DARTS</small>
        <strong id="darts">0/3</strong>
      </div>
    </div>

    <div class="details" id="details">
      Waiting for calibration
    </div>

    <div class="row">
      <button id="reset" class="secondary">
        RESET VISIT
      </button>
      <button id="restart" class="secondary">
        RESTART CAMERA
      </button>
    </div>

    <div class="message" id="message">
      One-touch calibration and monitoring
    </div>

  </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);

const video=$("camera");
const app=$("app");
const overlay=$("overlay");
const ctx=overlay.getContext("2d");

const work=document.createElement("canvas");
const wc=work.getContext("2d",{
  willReadFrequently:true
});

const SECTORS=[
  20,1,18,4,13,
  6,10,15,2,17,
  3,19,7,16,8,
  11,14,9,12,5
];

const CFG={
  calibrationDelay:3000,
  interval:400,
  stableRequired:5,
  stableThreshold:.025,
  sceneChange:.13,
  changeThreshold:55,
  minPixels:12,
  maxPixels:900,
  candidateRequired:4,
  candidateTolerance:7,
  removalThreshold:.012,
  removalFrames:5
};

let W=270;
let H=480;

let stream=null;
let cameraToken=0;
let loopToken=0;
let timer=null;

let board=null;
let calibrated=false;
let calibrating=false;
let monitoring=false;

let emptyBoard=null;
let referenceFrame=null;
let previousFrame=null;

let stableCount=0;
let candidateCount=0;
let previousCandidate=null;
let removalCount=0;

let visitTotal=0;
let dartCount=0;

let lastMarker=null;
let markerUntil=0;

let state="IDLE";

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function status(text){
  $("status").textContent=text;
}

function message(text){
  $("message").textContent=text;
}

function setLive(mode,text){
  $("liveDot").className="dot"+(
    mode?" "+mode:""
  );
  $("liveText").textContent=text;
}

function ready(){
  return !!stream &&
    video.readyState>=2 &&
    video.videoWidth>0 &&
    video.videoHeight>0;
}

function resize(){
  const dpr=window.devicePixelRatio||1;

  overlay.width=Math.round(app.clientWidth*dpr);
  overlay.height=Math.round(app.clientHeight*dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

function imageRect(){
  const vw=video.videoWidth||W;
  const vh=video.videoHeight||H;

  const scale=Math.min(
    app.clientWidth/vw,
    app.clientHeight/vh
  );

  return {
    x:(app.clientWidth-vw*scale)/2,
    y:(app.clientHeight-vh*scale)/2,
    w:vw*scale,
    h:vh*scale
  };
}

function toScreen(x,y){
  const r=imageRect();

  return {
    x:r.x+x/W*r.w,
    y:r.y+y/H*r.h
  };
}

function draw(){
  ctx.clearRect(
    0,0,
    app.clientWidth,
    app.clientHeight
  );

  if(!board)return;

  /*
    Calibration lines are shown only while
    calibration is not completed.
  */

  if(!calibrated){
    const r=imageRect();
    const c=toScreen(board.x,board.y);

    const rx=board.rx/W*r.w;
    const ry=board.ry/H*r.h;

    function ring(scale,color){
      ctx.beginPath();
      ctx.ellipse(
        c.x,c.y,
        rx*scale,
        ry*scale,
        0,0,Math.PI*2
      );
      ctx.strokeStyle=color;
      ctx.lineWidth=1.5;
      ctx.stroke();
    }

    ring(1,"#27b8ff");
    ring(162/170,"#27b8ff");
    ring(107/170,"#27b8ff");
    ring(99/170,"#27b8ff");
    ring(15.9/170,"#ffcc00");
    ring(6.35/170,"#ffcc00");

    for(let i=0;i<20;i++){
      const a=(
        -99+i*18+board.rotation
      )*Math.PI/180;

      ctx.beginPath();

      ctx.moveTo(
        c.x+Math.cos(a)*rx*.1,
        c.y+Math.sin(a)*ry*.1
      );

      ctx.lineTo(
        c.x+Math.cos(a)*rx,
        c.y+Math.sin(a)*ry
      );

      ctx.strokeStyle="#27b8ff55";
      ctx.lineWidth=1;
      ctx.stroke();
    }
  }

  /*
    After calibration only the temporary
    dart impact marker may be displayed.
  */

  if(lastMarker && Date.now()<markerUntil){
    const p=toScreen(
      lastMarker.x,
      lastMarker.y
    );

    ctx.beginPath();
    ctx.arc(p.x,p.y,11,0,Math.PI*2);
    ctx.strokeStyle="#19e79a";
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p.x-15,p.y);
    ctx.lineTo(p.x+15,p.y);
    ctx.moveTo(p.x,p.y-15);
    ctx.lineTo(p.x,p.y+15);
    ctx.stroke();
  }
}

function capture(){
  if(!ready())throw Error("Camera not ready");

  wc.drawImage(video,0,0,W,H);

  return wc.getImageData(0,0,W,H);
}

function pixelDifference(a,b,i){
  return (
    Math.abs(a.data[i]-b.data[i])+
    Math.abs(a.data[i+1]-b.data[i+1])+
    Math.abs(a.data[i+2]-b.data[i+2])
  )/3;
}

function motionRatio(a,b,step=8,threshold=35){
  let changed=0;
  let count=0;

  for(let y=0;y<H;y+=step){
    for(let x=0;x<W;x+=step){
      const i=(y*W+x)*4;
      count++;

      if(pixelDifference(a,b,i)>threshold){
        changed++;
      }
    }
  }

  return changed/Math.max(1,count);
}

async function waitForStability(token){
  let previous=null;
  let stable=0;

  const started=Date.now();

  while(Date.now()-started<15000){
    if(token!==cameraToken){
      throw Error("Camera changed");
    }

    await sleep(350);

    const frame=capture();

    if(previous){
      const movement=motionRatio(
        previous,frame
      );

      if(movement<CFG.stableThreshold){
        stable++;
      }else{
        stable=0;
      }

      status(
        "STABILIZING CAMERA "+
        stable+"/"+CFG.stableRequired
      );

      if(stable>=CFG.stableRequired){
        return frame;
      }
    }

    previous=frame;
  }

  throw Error("Camera could not stabilize");
}

async function startCamera(){
  stopLoop();

  const token=++cameraToken;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }

  stream=null;
  video.srcObject=null;

  board=null;
  calibrated=false;
  calibrating=false;

  emptyBoard=null;
  referenceFrame=null;
  previousFrame=null;

  lastMarker=null;

  $("calibrate").classList.remove("hidden");
  $("calibrate").disabled=true;

  setLive("","SYSTEM IDLE");
  status("CONNECTING CAMERA");

  try{
    const s=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      }
    });

    if(token!==cameraToken){
      s.getTracks().forEach(t=>t.stop());
      return;
    }

    stream=s;
    video.srcObject=s;

    await video.play();

    if(token!==cameraToken)return;

    const scale=Math.min(
      1,
      480/Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );

    W=Math.round(video.videoWidth*scale);
    H=Math.round(video.videoHeight*scale);

    work.width=W;
    work.height=H;

    $("resolution").textContent=
      video.videoWidth+" × "+
      video.videoHeight;

    $("cameraStatus").textContent="Camera active";

    $("calibrate").disabled=false;

    resize();

    status("READY FOR CALIBRATION");
    message("Ensure the board is empty");

  }catch(e){
    status("CAMERA ERROR");
    message(e.message);
  }
}

function classify(r,g,b){
  if(
    Math.max(r,g,b)-
    Math.min(r,g,b)<35
  )return 0;

  if(
    r>65&&r>g*1.3&&r>b*1.25
  )return 1;

  if(
    g>45&&g>r*1.15&&g>b*1.12
  )return 2;

  return 0;
}

function makeMask(frame){
  const mask=new Uint8Array(W*H);

  for(let i=0;i<W*H;i++){
    const j=i*4;

    mask[i]=classify(
      frame.data[j],
      frame.data[j+1],
      frame.data[j+2]
    );
  }

  return mask;
}

function maskAt(mask,x,y){
  x=Math.round(x);
  y=Math.round(y);

  if(x<0||y<0||x>=W||y>=H)return 0;

  return mask[y*W+x];
}

function ringStrength(mask,cx,cy,rx,ry){
  let hits=0;
  let valid=0;

  for(let i=0;i<80;i++){
    const a=i*Math.PI/40;

    const x=cx+Math.cos(a)*rx;
    const y=cy+Math.sin(a)*ry;

    if(x<0||y<0||x>=W||y>=H)continue;

    valid++;

    if(maskAt(mask,x,y))hits++;
  }

  return valid?hits/valid:0;
}

function geometrySearch(mask){
  let best=null;
  const md=Math.min(W,H);

  function scan(
    cx0,cy0,sx,sy,
    r0,r1,step,rs,ratios
  ){
    for(let cy=cy0-sy;cy<=cy0+sy;cy+=step){
      for(let cx=cx0-sx;cx<=cx0+sx;cx+=step){
        for(let rx=r0;rx<=r1;rx+=rs){
          for(const ratio of ratios){
            const ry=rx*ratio;

            if(
              cx-rx<2||cx+rx>=W-2||
              cy-ry<2||cy+ry>=H-2
            )continue;

            const outer=ringStrength(
              mask,cx,cy,rx*.965,ry*.965
            );

            const triple=ringStrength(
              mask,cx,cy,
              rx*103/170,
              ry*103/170
            );

            const bull=ringStrength(
              mask,cx,cy,
              rx*15.9/170,
              ry*15.9/170
            );

            const quality=
              outer*.45+
              triple*.40+
              bull*.15;

            if(!best||quality>best.quality){
              best={
                x:cx,y:cy,rx,ry,
                outer,triple,bull,quality
              };
            }
          }
        }
      }
    }
  }

  scan(
    W/2,H/2,
    W*.18,H*.18,
    md*.24,md*.49,
    8,6,
    [.75,.9,1,1.1,1.25]
  );

  if(best){
    const g=best;
    const ratio=g.ry/g.rx;

    scan(
      g.x,g.y,9,9,
      Math.max(10,g.rx-8),
      g.rx+8,
      3,3,
      [ratio-.07,ratio,ratio+.07]
    );
  }

  return best;
}

function estimateRotation(mask,g){
  let best={rotation:0,quality:0};

  for(let rot=-9;rot<=9;rot++){
    let hits=0;
    let count=0;

    for(let i=0;i<20;i++){
      const a=(-90+rot+i*18)*Math.PI/180;

      const color=maskAt(
        mask,
        g.x+Math.cos(a)*g.rx*.965,
        g.y+Math.sin(a)*g.ry*.965
      );

      if(!color)continue;

      count++;

      if(color===(i%2===0?1:2)){
        hits++;
      }
    }

    const quality=count?hits/count:0;

    if(quality>best.quality){
      best={rotation:rot,quality};
    }
  }

  return best;
}

async function calibrate(){
  if(calibrating||!ready())return;

  stopLoop();

  calibrating=true;
  calibrated=false;

  $("calibrate").disabled=true;

  const token=cameraToken;

  try{
    setLive("wait","CALIBRATING");

    for(let n=3;n>=1;n--){
      status("CALIBRATION STARTS IN "+n);
      await sleep(1000);

      if(token!==cameraToken)return;
    }

    status("STABILIZING CAMERA");

    const frame=await waitForStability(token);

    status("DETECTING SCORING RINGS");

    const mask=makeMask(frame);
    const g=geometrySearch(mask);

    if(
      !g||
      g.outer<.35||
      g.triple<.30||
      g.quality<.35
    ){
      throw Error(
        "Scoring rings could not be validated"
      );
    }

    const orientation=estimateRotation(mask,g);

    board={
      x:g.x,
      y:g.y,
      rx:g.rx,
      ry:g.ry,
      rotation:orientation.rotation,
      quality:g.quality
    };

    /*
      Calibration completed:
      remove all calibration overlays.
    */

    calibrated=true;
    draw();

    $("calibrate").classList.add("hidden");

    $("details").textContent=
      "Calibration complete | Board mapped";

    emptyBoard=frame;
    referenceFrame=frame;
    previousFrame=null;

    stableCount=0;
    candidateCount=0;
    previousCandidate=null;

    status("LIVE MONITORING");
    setLive("active","AUTOMATIC SCORING ACTIVE");

    message("Throw your first dart");

    startLoop();

  }catch(e){
    calibrated=false;
    board=null;

    draw();

    status("CALIBRATION FAILED");
    setLive("error","CALIBRATION ERROR");
    message(e.message);

  }finally{
    calibrating=false;

    if(!calibrated){
      $("calibrate").disabled=!ready();
    }
  }
}

function normalized(x,y){
  return {
    x:(x-board.x)/board.rx,
    y:(y-board.y)/board.ry
  };
}

function onBoard(x,y){
  const p=normalized(x,y);
  return Math.hypot(p.x,p.y)<=1.02;
}

function changedPixels(a,b){
  const pixels=[];

  for(let y=2;y<H-2;y+=2){
    for(let x=2;x<W-2;x+=2){
      if(!onBoard(x,y))continue;

      const i=(y*W+x)*4;
      const diff=pixelDifference(a,b,i);

      if(diff>CFG.changeThreshold){
        pixels.push({x,y,diff});
      }
    }
  }

  return pixels;
}

function findCandidate(pixels){
  if(pixels.length<CFG.minPixels)return null;
  if(pixels.length>CFG.maxPixels)return null;

  const cellSize=8;
  const cells=new Map();

  for(const p of pixels){
    const cx=Math.floor(p.x/cellSize);
    const cy=Math.floor(p.y/cellSize);
    const key=cx+","+cy;

    if(!cells.has(key)){
      cells.set(key,{
        cx,cy,
        points:[],
        seen:false
      });
    }

    cells.get(key).points.push(p);
  }

  const groups=[];

  for(const start of cells.values()){
    if(start.seen)continue;

    const queue=[start];
    const points=[];
    start.seen=true;

    for(let k=0;k<queue.length;k++){
      const c=queue[k];
      points.push(...c.points);

      for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
          if(!dx&&!dy)continue;

          const n=cells.get(
            (c.cx+dx)+","+(c.cy+dy)
          );

          if(n&&!n.seen){
            n.seen=true;
            queue.push(n);
          }
        }
      }
    }

    if(points.length>=CFG.minPixels){
      groups.push(points);
    }
  }

  if(groups.length!==1){
    return null;
  }

  const group=groups[0];

  let minX=Infinity;
  let minY=Infinity;
  let maxX=-Infinity;
  let maxY=-Infinity;

  for(const p of group){
    minX=Math.min(minX,p.x);
    minY=Math.min(minY,p.y);
    maxX=Math.max(maxX,p.x);
    maxY=Math.max(maxY,p.y);
  }

  const width=maxX-minX;
  const height=maxY-minY;

  /*
    Reject tiny changes and large diffuse areas.
  */

  if(width<5&&height<5)return null;
  if(width>W*.35||height>H*.35)return null;

  /*
    A single camera cannot reliably identify
    the actual dart tip from all silhouettes.
    Do not claim a score from an ambiguous tip.
  */

  let sx=0;
  let sy=0;

  for(const p of group){
    sx+=p.x;
    sy+=p.y;
  }

  return {
    x:sx/group.length,
    y:sy/group.length,
    width,height,
    pixels:group.length,
    ambiguous:true
  };
}

function scoreAt(x,y){
  const p=normalized(x,y);
  const radius=Math.hypot(p.x,p.y);

  if(radius>1){
    return {score:0,label:"MISS",x,y};
  }

  if(radius<=6.35/170){
    return {score:50,label:"BULL",x,y};
  }

  if(radius<=15.9/170){
    return {score:25,label:"OUTER BULL",x,y};
  }

  let angle=Math.atan2(p.y,p.x)*180/Math.PI;

  angle=(
    angle+90-board.rotation+360
  )%360;

  const index=Math.floor((angle+9)/18)%20;
  const number=SECTORS[index];

  let multiplier=1;
  let ring="SINGLE";

  if(radius>=99/170&&radius<=107/170){
    multiplier=3;
    ring="TRIPLE";
  }

  if(radius>=162/170&&radius<=1){
    multiplier=2;
    ring="DOUBLE";
  }

  return {
    score:number*multiplier,
    label:ring+" "+number,
    x,y
  };
}

function stopLoop(){
  monitoring=false;
  loopToken++;

  if(timer!==null){
    clearTimeout(timer);
    timer=null;
  }
}

function startLoop(){
  if(!calibrated||!ready())return;

  stopLoop();

  monitoring=true;
  state="MONITORING";

  const token=loopToken;

  function next(){
    if(!monitoring||token!==loopToken)return;

    timer=setTimeout(
      ()=>tick(token),
      CFG.interval
    );
  }

  function tick(id){
    if(!monitoring||id!==loopToken)return;

    try{
      const frame=capture();

      if(!previousFrame){
        previousFrame=frame;
        next();
        return;
      }

      const motion=motionRatio(
        previousFrame,frame
      );

      previousFrame=frame;

      if(motion>CFG.sceneChange){
        stableCount=0;
        candidateCount=0;
        previousCandidate=null;

        status("WAITING FOR CAMERA STABILITY");
        setLive("wait","CAMERA SETTLING");

        next();
        return;
      }

      stableCount++;

      if(stableCount<CFG.stableRequired){
        next();
        return;
      }

      if(!referenceFrame){
        referenceFrame=frame;
      }

      /*
        If three darts are recorded, wait until
        the board resembles the original empty
        baseline before starting another visit.
      */

      if(dartCount>=3){
        const emptyDifference=motionRatio(
          emptyBoard,frame,4,45
        );

        if(emptyDifference<CFG.removalThreshold){
          removalCount++;
        }else{
          removalCount=0;
        }

        if(removalCount>=CFG.removalFrames){
          resetVisit(false);

          emptyBoard=frame;
          referenceFrame=frame;

          status("NEW VISIT READY");
          message("Throw your first dart");
        }else{
          status("WAITING FOR DART REMOVAL");
          setLive("wait","REMOVE ALL DARTS");
        }

        next();
        return;
      }

      const changes=changedPixels(
        referenceFrame,frame
      );

      if(changes.length<CFG.minPixels){
        candidateCount=0;
        previousCandidate=null;

        status("LIVE MONITORING");
        setLive("active","AUTOMATIC SCORING ACTIVE");

        next();
        return;
      }

      const hit=findCandidate(changes);

      if(!hit){
        candidateCount=0;
        previousCandidate=null;

        status("ANALYSING BOARD");
        next();
        return;
      }

      if(previousCandidate){
        const distance=Math.hypot(
          hit.x-previousCandidate.x,
          hit.y-previousCandidate.y
        );

        if(distance<=CFG.candidateTolerance){
          candidateCount++;
        }else{
          candidateCount=1;
        }
      }else{
        candidateCount=1;
      }

      previousCandidate=hit;

      if(candidateCount<CFG.candidateRequired){
        status("VERIFYING DART DETECTION");
        next();
        return;
      }

      /*
        V9 deliberately rejects automatic scoring
        when only a changed-region centroid is
        available instead of a verified dart tip.
      */

      if(hit.ambiguous){
        status("DART DETECTED | SCORE UNVERIFIED");
        setLive("wait","TIP LOCATION NOT VERIFIED");

        message(
          "Automatic score blocked to prevent a false result"
        );

        candidateCount=0;
        previousCandidate=null;

        next();
        return;
      }

      const result=scoreAt(hit.x,hit.y);

      if(result){
        dartCount++;
        visitTotal+=result.score;

        $("score").textContent=result.score;
        $("total").textContent=visitTotal;
        $("darts").textContent=dartCount+"/3";

        lastMarker=result;
        markerUntil=Date.now()+1800;

        draw();

        setTimeout(()=>{
          if(Date.now()>=markerUntil){
            lastMarker=null;
            draw();
          }
        },1900);

        referenceFrame=frame;

        candidateCount=0;
        previousCandidate=null;

        status("DART SCORED: "+result.label);
        message("Monitoring next dart");
      }

    }catch(e){
      status("MONITORING ERROR");
      message(e.message);
      setLive("error","VISION ERROR");
    }

    next();
  }

  next();
}

function resetVisit(restart=true){
  visitTotal=0;
  dartCount=0;
  removalCount=0;

  candidateCount=0;
  previousCandidate=null;
  stableCount=0;

  lastMarker=null;

  $("score").textContent="---";
  $("total").textContent="0";
  $("darts").textContent="0/3";

  draw();

  if(restart&&calibrated){
    referenceFrame=null;
    previousFrame=null;

    status("RESETTING VISIT");
    message("Remove all darts");

    startLoop();
  }
}

$("calibrate").onclick=calibrate;
$("reset").onclick=()=>resetVisit(true);
$("restart").onclick=startCamera;

window.addEventListener("resize",resize);

if(window.ResizeObserver){
  new ResizeObserver(resize).observe(app);
}

window.addEventListener("pagehide",()=>{
  stopLoop();
  cameraToken++;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
});

window.addEventListener(
  "DOMContentLoaded",
  startCamera
);
</script>
