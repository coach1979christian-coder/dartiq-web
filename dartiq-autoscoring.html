<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b16">
<title>DARTIQ | Auto-Scoring V6</title>
<style>
:root{
  --blue:#27b8ff;
  --green:#19e79a;
  --red:#ff5268;
  --bg:#050b16;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:#000;color:#fff;
  font-family:Arial,sans-serif;
}
button,input{font:inherit}
.app{
  position:relative;width:100%;height:100dvh;
  max-width:800px;margin:auto;overflow:hidden;
  background:#000;
}
video,canvas{
  position:absolute;inset:0;width:100%;height:100%;
}
video{object-fit:contain}
canvas{pointer-events:none}
.top{
  position:absolute;top:0;left:0;right:0;
  text-align:center;padding:9px 12px 18px;
  background:linear-gradient(#020916f5,#020916aa,transparent);
}
.logo{
  margin:0;color:var(--blue);font-size:24px;
  letter-spacing:4px;text-shadow:0 0 14px #27b8ff99;
}
.subtitle{
  color:#a9c5dd;font-size:10px;
  letter-spacing:1px;margin-top:3px;
}
.camera-info{
  display:flex;justify-content:space-between;
  color:#a9c5dd;font-size:10px;margin-top:7px;
}
.bottom{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;flex-direction:column;gap:5px;
  padding:8px 10px max(10px,env(safe-area-inset-bottom));
  background:linear-gradient(
    transparent,
    #020916e8 12%,
    #020916 40%
  );
}
.status{
  text-align:center;color:var(--blue);
  font-size:12px;font-weight:800;
  min-height:16px;
}
button{
  background:var(--blue);color:#00121e;
  border:1px solid #27b8ff77;border-radius:8px;
  min-height:37px;padding:7px 5px;
  font-size:11px;font-weight:800;
}
button:disabled{opacity:.4}
.secondary{background:#18334d;color:#fff}
.metrics{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:5px;
}
.metric{
  text-align:center;background:#031020e8;
  border:1px solid #27b8ff55;
  border-radius:8px;padding:6px 2px;
}
.metric small{
  display:block;font-size:9px;color:#a9c5dd;
}
.metric strong{
  display:block;color:var(--blue);
  font-size:24px;margin-top:2px;
}
.row{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.score-row{
  display:grid;grid-template-columns:1fr 40%;gap:5px;
}
input{
  width:100%;min-width:0;background:#031020e8;
  border:1px solid #27b8ff55;border-radius:8px;
  color:#fff;padding:8px;font-size:13px;
}
.details,.message{
  color:#b4c9dc;text-align:center;font-size:10px;
}
.review{
  display:none;
  border:1px solid #ffcc00;
  background:#292109ee;
  border-radius:8px;padding:7px;
  text-align:center;font-size:11px;
}
.review.show{display:block}
.review strong{color:#ffdd55}
@media(max-height:700px){
  .bottom{gap:3px;padding-top:4px}
  button{min-height:30px;padding:5px}
  .metric{padding:3px}
  .metric strong{font-size:19px}
}
@media(max-height:560px){
  .logo{font-size:18px}
  .subtitle,.details{display:none}
  button{min-height:26px}
  .metric strong{font-size:17px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>

  <div class="top">
    <h1 class="logo">DARTIQ</h1>
    <div class="subtitle">AUTO-SCORING V6 | LIVE VISION</div>
    <div class="camera-info">
      <span id="cameraStatus">Connecting...</span>
      <span id="resolution">---</span>
    </div>
  </div>

  <div class="bottom">
    <div class="status" id="status">WAITING FOR CAMERA</div>

    <button id="calibrate" disabled>
      START AUTOMATIC CALIBRATION
    </button>

    <div class="metrics">
      <div class="metric">
        <small>DART SCORE</small>
        <strong id="score">---</strong>
      </div>
      <div class="metric">
        <small>VISIT TOTAL</small>
        <strong id="total">0</strong>
      </div>
      <div class="metric">
        <small>DARTS</small>
        <strong id="darts">0/3</strong>
      </div>
    </div>

    <div class="details" id="details">
      Calibration required
    </div>

    <div class="review" id="review">
      <strong id="candidateLabel">CANDIDATE</strong>
      <div>Check the marker before accepting</div>
    </div>

    <div class="row">
      <button id="monitor" disabled>START MONITORING</button>
      <button id="pause" class="secondary" disabled>
        PAUSE
      </button>
    </div>

    <div class="score-row">
      <input id="manualScore" type="number"
        min="0" max="60"
        placeholder="Detected / manual score">
      <button id="confirm">CONFIRM DART</button>
    </div>

    <div class="row">
      <button id="newVisit" class="secondary">
        NEW VISIT
      </button>
      <button id="restart" class="secondary">
        RESTART CAMERA
      </button>
    </div>

    <div class="message" id="message">
      Keep the camera stationary
    </div>
  </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const video=$("camera");
const app=$("app");
const canvas=$("overlay");
const ctx=canvas.getContext("2d");

const work=document.createElement("canvas");
const wc=work.getContext("2d",{
  willReadFrequently:true
});

const SECTORS=[
  20,1,18,4,13,6,10,15,2,17,
  3,19,7,16,8,11,14,9,12,5
];

const VALID=new Set([0,25,50]);
for(let n=1;n<=20;n++){
  VALID.add(n);
  VALID.add(n*2);
  VALID.add(n*3);
}

let W=270,H=480;
let stream=null;
let cameraToken=0;
let board=null;
let baseline=null;
let candidate=null;
let marker=null;

let monitoring=false;
let busy=false;
let timer=null;
let visitTotal=0;
let dartCount=0;

let stableFrames=0;
let changeFrames=0;
let previousSignature=null;
let lastAcceptedSignature=null;
let lastAcceptedAt=0;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function status(s){$("status").textContent=s}
function message(s){$("message").textContent=s}

function ready(){
  return !!stream&&video.readyState>=2&&
    video.videoWidth>0&&video.videoHeight>0;
}

function resize(){
  const dpr=devicePixelRatio||1;
  canvas.width=Math.round(app.clientWidth*dpr);
  canvas.height=Math.round(app.clientHeight*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

function imageRect(){
  const vw=video.videoWidth||W;
  const vh=video.videoHeight||H;
  const scale=Math.min(
    app.clientWidth/vw,
    app.clientHeight/vh
  );
  return {
    x:(app.clientWidth-vw*scale)/2,
    y:(app.clientHeight-vh*scale)/2,
    w:vw*scale,h:vh*scale
  };
}

function screenPoint(x,y){
  const r=imageRect();
  return {
    x:r.x+x/W*r.w,
    y:r.y+y/H*r.h
  };
}

function draw(){
  ctx.clearRect(0,0,app.clientWidth,app.clientHeight);
  if(!board)return;

  const r=imageRect();
  const c=screenPoint(board.x,board.y);
  const rx=board.rx/W*r.w;
  const ry=board.ry/H*r.h;

  function ring(scale,color){
    ctx.beginPath();
    ctx.ellipse(
      c.x,c.y,rx*scale,ry*scale,
      0,0,Math.PI*2
    );
    ctx.strokeStyle=color;
    ctx.lineWidth=1.5;
    ctx.stroke();
  }

  ring(1,"#27b8ff");
  ring(162/170,"#27b8ff");
  ring(107/170,"#27b8ff");
  ring(99/170,"#27b8ff");
  ring(15.9/170,"#ffcc00");
  ring(6.35/170,"#ffcc00");

  for(let i=0;i<20;i++){
    const a=(
      -99+i*18+board.rotation
    )*Math.PI/180;

    ctx.beginPath();
    ctx.moveTo(
      c.x+Math.cos(a)*rx*.1,
      c.y+Math.sin(a)*ry*.1
    );
    ctx.lineTo(
      c.x+Math.cos(a)*rx,
      c.y+Math.sin(a)*ry
    );
    ctx.strokeStyle="#27b8ff66";
    ctx.lineWidth=1;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(c.x,c.y,4,0,Math.PI*2);
  ctx.fillStyle="#27b8ff";
  ctx.fill();

  if(marker){
    const p=screenPoint(marker.x,marker.y);
    ctx.beginPath();
    ctx.arc(p.x,p.y,11,0,Math.PI*2);
    ctx.strokeStyle="#19e79a";
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p.x-16,p.y);
    ctx.lineTo(p.x+16,p.y);
    ctx.moveTo(p.x,p.y-16);
    ctx.lineTo(p.x,p.y+16);
    ctx.stroke();
  }
}

function capture(){
  if(!ready())throw Error("Camera not ready");
  wc.drawImage(video,0,0,W,H);
  return wc.getImageData(0,0,W,H);
}

async function startCamera(){
  stopMonitoring();

  const token=++cameraToken;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }

  stream=null;
  board=null;
  baseline=null;
  candidate=null;
  marker=null;

  $("calibrate").disabled=true;
  $("monitor").disabled=true;
  $("review").classList.remove("show");

  status("CONNECTING CAMERA");

  try{
    const s=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      }
    });

    if(token!==cameraToken){
      s.getTracks().forEach(t=>t.stop());
      return;
    }

    stream=s;
    video.srcObject=s;
    await video.play();

    if(token!==cameraToken)return;

    const scale=Math.min(
      1,480/Math.max(video.videoWidth,video.videoHeight)
    );

    W=Math.round(video.videoWidth*scale);
    H=Math.round(video.videoHeight*scale);

    work.width=W;
    work.height=H;

    $("resolution").textContent=
      video.videoWidth+" × "+video.videoHeight;

    $("cameraStatus").textContent="Camera active";
    $("calibrate").disabled=false;

    resize();
    status("READY FOR CALIBRATION");

  }catch(e){
    status("CAMERA ERROR");
    message(e.message);
  }
}

function classify(r,g,b){
  if(Math.max(r,g,b)-Math.min(r,g,b)<35)return 0;
  if(r>65&&r>g*1.3&&r>b*1.25)return 1;
  if(g>45&&g>r*1.15&&g>b*1.12)return 2;
  return 0;
}

function maskFrom(frame){
  const mask=new Uint8Array(W*H);

  for(let i=0;i<W*H;i++){
    const j=i*4;
    mask[i]=classify(
      frame.data[j],
      frame.data[j+1],
      frame.data[j+2]
    );
  }

  return mask;
}

function maskAt(mask,x,y){
  x=Math.round(x);
  y=Math.round(y);
  if(x<0||y<0||x>=W||y>=H)return 0;
  return mask[y*W+x];
}

function ringStrength(mask,cx,cy,rx,ry){
  let hits=0,valid=0;

  for(let i=0;i<80;i++){
    const a=i*Math.PI/40;
    const x=cx+Math.cos(a)*rx;
    const y=cy+Math.sin(a)*ry;

    if(x<0||y<0||x>=W||y>=H)continue;
    valid++;
    if(maskAt(mask,x,y))hits++;
  }

  return valid?hits/valid:0;
}

function geometrySearch(mask){
  let best=null;
  const md=Math.min(W,H);

  function scan(cx0,cy0,sx,sy,r0,r1,step,rs,ratios){
    for(let cy=cy0-sy;cy<=cy0+sy;cy+=step){
      for(let cx=cx0-sx;cx<=cx0+sx;cx+=step){
        for(let rx=r0;rx<=r1;rx+=rs){
          for(const ratio of ratios){
            const ry=rx*ratio;

            if(
              cx-rx<2||cx+rx>=W-2||
              cy-ry<2||cy+ry>=H-2
            )continue;

            const outer=ringStrength(
              mask,cx,cy,rx*.965,ry*.965
            );

            const triple=ringStrength(
              mask,cx,cy,
              rx*103/170,ry*103/170
            );

            const bull=ringStrength(
              mask,cx,cy,
              rx*15.9/170,ry*15.9/170
            );

            const quality=
              outer*.45+triple*.40+bull*.15;

            if(!best||quality>best.quality){
              best={
                x:cx,y:cy,rx,ry,
                outer,triple,bull,quality
              };
            }
          }
        }
      }
    }
  }

  scan(
    W/2,H/2,W*.18,H*.18,
    md*.24,md*.49,8,6,
    [.75,.9,1,1.1,1.25]
  );

  if(best){
    const g=best;
    const ratio=g.ry/g.rx;

    scan(
      g.x,g.y,9,9,
      Math.max(10,g.rx-8),
      g.rx+8,3,3,
      [ratio-.07,ratio,ratio+.07]
    );
  }

  return best;
}

function estimateRotation(mask,g){
  let best={rotation:0,quality:0};

  for(let rot=-9;rot<=9;rot++){
    let hits=0,count=0;

    for(let i=0;i<20;i++){
      const a=(-90+rot+i*18)*Math.PI/180;

      const color=maskAt(
        mask,
        g.x+Math.cos(a)*g.rx*.965,
        g.y+Math.sin(a)*g.ry*.965
      );

      if(!color)continue;
      count++;

      if(color===(i%2===0?1:2))hits++;
    }

    const quality=count?hits/count:0;

    if(quality>best.quality){
      best={rotation:rot,quality};
    }
  }

  return best;
}

async function calibrate(){
  if(busy||!ready())return;

  stopMonitoring();
  busy=true;
  $("calibrate").disabled=true;
  $("monitor").disabled=true;

  try{
    status("DETECTING BOARD");

    await sleep(50);

    const frame=capture();
    const mask=maskFrom(frame);
    const g=geometrySearch(mask);

    if(
      !g||
      g.outer<.35||
      g.triple<.30||
      g.quality<.35
    ){
      throw Error("Scoring rings not reliably detected");
    }

    status("MAPPING SECTORS");

    await sleep(30);

    const orientation=estimateRotation(mask,g);

    board={
      x:g.x,y:g.y,
      rx:g.rx,ry:g.ry,
      rotation:orientation.rotation,
      quality:g.quality
    };

    baseline=null;
    candidate=null;
    marker=null;

    $("details").textContent=
      "Rings detected | 20 sectors | Upright orientation assumed";

    draw();

    status("CALIBRATION COMPLETE");
    message("Checking empty board automatically");

    $("monitor").disabled=false;

    startMonitoring();

  }catch(e){
    board=null;
    status("CALIBRATION FAILED");
    message(e.message);
  }finally{
    busy=false;
    $("calibrate").disabled=!ready();
  }
}

function normalized(x,y){
  return {
    x:(x-board.x)/board.rx,
    y:(y-board.y)/board.ry
  };
}

function onBoard(x,y){
  const p=normalized(x,y);
  return Math.hypot(p.x,p.y)<=1.02;
}

function difference(a,b,i){
  return (
    Math.abs(a.data[i]-b.data[i])+
    Math.abs(a.data[i+1]-b.data[i+1])+
    Math.abs(a.data[i+2]-b.data[i+2])
  )/3;
}

function frameChange(a,b){
  let changed=0,count=0;

  for(let y=0;y<H;y+=6){
    for(let x=0;x<W;x+=6){
      const i=(y*W+x)*4;
      count++;
      if(difference(a,b,i)>45)changed++;
    }
  }

  return changed/Math.max(1,count);
}

function changedPixels(a,b){
  const pixels=[];

  for(let y=2;y<H-2;y+=2){
    for(let x=2;x<W-2;x+=2){
      if(!onBoard(x,y))continue;

      const i=(y*W+x)*4;
      const diff=difference(a,b,i);

      if(diff>43)pixels.push({x,y,diff});
    }
  }

  return pixels;
}

function findCandidate(pixels){
  if(pixels.length<10)return null;

  const size=8;
  const cells=new Map();

  for(const p of pixels){
    const cx=Math.floor(p.x/size);
    const cy=Math.floor(p.y/size);
    const key=cx+","+cy;

    if(!cells.has(key)){
      cells.set(key,{
        cx,cy,points:[],seen:false
      });
    }

    cells.get(key).points.push(p);
  }

  const groups=[];

  for(const start of cells.values()){
    if(start.seen)continue;

    const queue=[start];
    const points=[];
    start.seen=true;

    for(let k=0;k<queue.length;k++){
      const c=queue[k];
      points.push(...c.points);

      for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
          if(!dx&&!dy)continue;

          const n=cells.get(
            (c.cx+dx)+","+(c.cy+dy)
          );

          if(n&&!n.seen){
            n.seen=true;
            queue.push(n);
          }
        }
      }
    }

    if(points.length>=10)groups.push(points);
  }

  if(!groups.length)return null;

  groups.sort((a,b)=>b.length-a.length);

  const group=groups[0];

  if(group.length>pixels.length*.85&&pixels.length>600){
    return null;
  }

  /*
    Candidate only. The point closest to the
    bull is not guaranteed to be the dart tip.
  */

  let best=null;
  let distance=Infinity;

  for(const p of group){
    const n=normalized(p.x,p.y);
    const d=Math.hypot(n.x,n.y);

    if(d<distance){
      distance=d;
      best=p;
    }
  }

  if(!best)return null;

  return {
    x:best.x,
    y:best.y,
    pixels:group.length
  };
}

function scoreAt(x,y){
  const p=normalized(x,y);
  const radius=Math.hypot(p.x,p.y);

  if(radius>1){
    return {score:0,label:"MISS",x,y};
  }

  if(radius<=6.35/170){
    return {score:50,label:"BULL",x,y};
  }

  if(radius<=15.9/170){
    return {score:25,label:"OUTER BULL",x,y};
  }

  let angle=Math.atan2(p.y,p.x)*180/Math.PI;

  angle=(
    angle+90-board.rotation+360
  )%360;

  const index=Math.floor((angle+9)/18)%20;
  const number=SECTORS[index];

  let multiplier=1;
  let ring="SINGLE";

  if(radius>=99/170&&radius<=107/170){
    multiplier=3;
    ring="TRIPLE";
  }

  if(radius>=162/170&&radius<=1){
    multiplier=2;
    ring="DOUBLE";
  }

  return {
    score:number*multiplier,
    label:ring+" "+number,
    x,y
  };
}

function signature(hit){
  return (
    Math.round(hit.x/8)+":"+
    Math.round(hit.y/8)
  );
}

function stopMonitoring(){
  monitoring=false;

  if(timer!==null){
    clearTimeout(timer);
    timer=null;
  }

  $("pause").disabled=true;
  $("monitor").disabled=!board;
}

function startMonitoring(){
  if(!board||!ready()||monitoring)return;

  if(dartCount>=3){
    status("VISIT COMPLETE");
    return;
  }

  monitoring=true;
  stableFrames=0;
  changeFrames=0;
  previousSignature=null;

  $("monitor").disabled=true;
  $("pause").disabled=false;

  status("LIVE MONITORING");

  schedule();
}

function schedule(){
  if(!monitoring)return;

  timer=setTimeout(monitorFrame,350);
}

function monitorFrame(){
  if(!monitoring||!board||!ready())return;

  try{
    const frame=capture();

    if(!baseline){
      baseline=frame;
      status("EMPTY BOARD BASELINE READY");
      message("Throw one dart");
      schedule();
      return;
    }

    if(candidate){
      schedule();
      return;
    }

    const movement=frameChange(baseline,frame);

    if(movement>.30){
      stableFrames=0;
      changeFrames=0;
      status("CAMERA MOVEMENT DETECTED");
      message("Keep phone and dartboard stationary");
      schedule();
      return;
    }

    if(movement<.008){
      stableFrames++;

      if(stableFrames>=3){
        changeFrames=0;
        previousSignature=null;
      }

      schedule();
      return;
    }

    stableFrames=0;

    const pixels=changedPixels(baseline,frame);
    const hit=findCandidate(pixels);

    if(!hit){
      changeFrames=0;
      schedule();
      return;
    }

    const sig=signature(hit);

    if(sig===previousSignature){
      changeFrames++;
    }else{
      previousSignature=sig;
      changeFrames=1;
    }

    if(changeFrames<3){
      status("CHECKING DART STABILITY");
      schedule();
      return;
    }

    if(
      sig===lastAcceptedSignature &&
      Date.now()-lastAcceptedAt<4000
    ){
      schedule();
      return;
    }

    const result=scoreAt(hit.x,hit.y);

    candidate={
      ...result,
      signature:sig,
      after:frame
    };

    marker=result;

    $("score").textContent=result.score;
    $("manualScore").value=result.score;

    $("candidateLabel").textContent=
      result.label+" = "+result.score;

    $("review").classList.add("show");

    draw();

    status("DART CANDIDATE DETECTED");
    message("Check marker and score before confirming");

    stopMonitoring();

  }catch(e){
    status("MONITOR ERROR");
    message(e.message);
    stopMonitoring();
    return;
  }

  schedule();
}

function confirmDart(){
  if(dartCount>=3){
    status("VISIT COMPLETE");
    return;
  }

  const raw=$("manualScore").value.trim();

  if(raw===""){
    status("ENTER DART SCORE");
    return;
  }

  const value=Number(raw);

  if(!Number.isInteger(value)||!VALID.has(value)){
    status("INVALID SCORE");
    return;
  }

  dartCount++;
  visitTotal+=value;

  $("score").textContent=value;
  $("total").textContent=visitTotal;
  $("darts").textContent=dartCount+"/3";

  if(candidate){
    baseline=candidate.after;
    lastAcceptedSignature=candidate.signature;
    lastAcceptedAt=Date.now();
  }else{
    baseline=null;
    lastAcceptedSignature=null;
  }

  candidate=null;
  marker=null;

  $("manualScore").value="";
  $("review").classList.remove("show");

  draw();

  if(dartCount>=3){
    stopMonitoring();
    status("VISIT COMPLETE");
    message("Remove darts and press NEW VISIT");
  }else{
    status("DART CONFIRMED");
    message("Monitoring next dart");
    startMonitoring();
  }
}

function newVisit(){
  stopMonitoring();

  dartCount=0;
  visitTotal=0;

  baseline=null;
  candidate=null;
  marker=null;
  lastAcceptedSignature=null;
  lastAcceptedAt=0;

  $("score").textContent="---";
  $("total").textContent="0";
  $("darts").textContent="0/3";
  $("manualScore").value="";

  $("review").classList.remove("show");

  draw();

  if(board){
    status("NEW VISIT");
    message("Remove all darts before monitoring");
    $("monitor").disabled=false;
  }else{
    status("CALIBRATION REQUIRED");
  }
}

$("calibrate").onclick=calibrate;
$("monitor").onclick=startMonitoring;
$("pause").onclick=()=>{
  stopMonitoring();
  status("MONITORING PAUSED");
};
$("confirm").onclick=confirmDart;
$("newVisit").onclick=newVisit;
$("restart").onclick=startCamera;

window.addEventListener("resize",resize);

if(window.ResizeObserver){
  new ResizeObserver(resize).observe(app);
}

window.addEventListener("pagehide",()=>{
  stopMonitoring();
  cameraToken++;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
});

window.addEventListener("DOMContentLoaded",startCamera);
</script>
</body>
</html>
