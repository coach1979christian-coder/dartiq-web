
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b16">
<title>DARTIQ | Auto-Scoring V3</title>
<style>
:root{
 --bg:#050b16;
 --panel:#0d1a2b;
 --blue:#27b8ff;
 --line:#245078;
 --text:#eef8ff;
 --muted:#a6bdd5;
}
*{box-sizing:border-box}
html,body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
}
main{
 width:100%;
 max-width:700px;
 margin:auto;
 padding:10px;
}
h1{
 margin:8px 0 2px;
 text-align:center;
 color:var(--blue);
 letter-spacing:3px;
 text-shadow:0 0 18px #27b8ff88;
}
.subtitle{
 text-align:center;
 color:var(--muted);
 margin:3px 0 12px;
 font-size:12px;
}
.panel{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:14px;
 padding:10px;
}
.stage{
 position:relative;
 width:100%;
 background:#000;
 border-radius:10px;
 overflow:hidden;
}
video{
 display:block;
 width:100%;
 height:100%;
 object-fit:contain;
}
#overlay{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 touch-action:none;
}
.status{
 text-align:center;
 color:var(--muted);
 font-size:13px;
 padding:7px 0;
 min-height:30px;
}
#instruction{
 color:var(--blue);
 font-weight:700;
}
button{
 border:0;
 border-radius:8px;
 background:var(--blue);
 color:#00121e;
 padding:12px 6px;
 font-size:12px;
 font-weight:800;
 cursor:pointer;
}
button:disabled{opacity:.4}
.secondary{
 background:#19334c;
 color:#fff;
 border:1px solid #376181;
}
.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:7px;
 margin-top:7px;
}
.full{width:100%}
.scorebar{
 display:grid;
 grid-template-columns:1fr 1fr 1fr;
 gap:6px;
 margin:9px 0;
}
.metric{
 background:#071321;
 border:1px solid var(--line);
 border-radius:8px;
 text-align:center;
 padding:7px 3px;
}
.metric small{
 display:block;
 color:var(--muted);
 font-size:10px;
}
.metric strong{
 display:block;
 color:var(--blue);
 font-size:24px;
 margin-top:3px;
}
input{
 width:100%;
 background:#071321;
 border:1px solid var(--line);
 border-radius:8px;
 color:white;
 font-size:16px;
 padding:11px;
 margin:7px 0;
}
.details{
 display:flex;
 justify-content:space-between;
 gap:8px;
 color:var(--muted);
 font-size:11px;
 padding:6px 0;
}
#difference{
 display:none;
 width:100%;
 margin-top:8px;
 border-radius:8px;
}
</style>
</head>
<body>
<main>
<h1>DARTIQ</h1>
<p class="subtitle">AUTO-SCORING V3 | STEEL TIP</p>

<section class="panel">

<div class="stage" id="stage">
 <video id="camera" autoplay muted playsinline></video>
 <canvas id="overlay"></canvas>
</div>

<div class="details">
 <span id="cameraStatus">Connecting camera...</span>
 <span id="resolution">---</span>
</div>

<div class="status" id="instruction">
 Press START CALIBRATION
</div>

<button class="full" id="calibrate" disabled>
 START CALIBRATION
</button>

<div class="scorebar">
 <div class="metric">
  <small>DART SCORE</small>
  <strong id="score">---</strong>
 </div>
 <div class="metric">
  <small>VISIT TOTAL</small>
  <strong id="visitTotal">0</strong>
 </div>
 <div class="metric">
  <small>DARTS</small>
  <strong id="dartCount">0/3</strong>
 </div>
</div>

<div class="details">
 <span id="segment">Segment: ---</span>
 <span id="multiplier">Multiplier: ---</span>
 <span id="confidence">Confidence: ---</span>
</div>

<div class="actions">
 <button id="baseline" disabled>
  CAPTURE BEFORE
 </button>
 <button id="detect" disabled>
  DETECT DART
 </button>
</div>

<input id="manualScore" type="number"
 min="0" max="60"
 placeholder="Correct dart score">

<div class="actions">
 <button id="confirm">CONFIRM DART</button>
 <button id="newVisit" class="secondary">NEW VISIT</button>
</div>

<div class="actions">
 <button id="restartCamera" class="secondary">
  RESTART CAMERA
 </button>
 <button id="stopCamera" class="secondary">
  STOP CAMERA
 </button>
</div>

<div class="status" id="detectionStatus">
 Waiting for camera
</div>

<canvas id="difference"></canvas>

<div class="status" id="saveStatus">
 Local prototype. No database writes.
</div>

</section>
</main>

<script>
"use strict";

const $=id=>document.getElementById(id);
const video=$("camera");
const stage=$("stage");
const overlay=$("overlay");
const ctx=overlay.getContext("2d");
const diff=$("difference");
const dctx=diff.getContext("2d");
const work=document.createElement("canvas");
const wctx=work.getContext("2d",{willReadFrequently:true});

let W=480,H=640;
let stream=null,requestId=0;
let points=[],board=null,calibrating=false;
let before=null,pending=null;
let total=0,darts=0;

const names=[
 "BULL CENTER",
 "TOP OF DOUBLE RING",
 "RIGHT OF DOUBLE RING",
 "BOTTOM OF DOUBLE RING",
 "LEFT OF DOUBLE RING"
];

const numbers=[
 20,1,18,4,13,6,10,15,2,17,
 3,19,7,16,8,11,14,9,12,5
];

const valid=new Set([0,25,50]);
for(let n=1;n<=20;n++){
 valid.add(n);valid.add(n*2);valid.add(n*3);
}

function status(text){
 $("instruction").textContent=text;
}
function ready(){
 return !!stream&&video.readyState>=2&&video.videoWidth>0;
}
function configure(){
 const vw=video.videoWidth,vh=video.videoHeight;
 if(!vw||!vh)return;
 stage.style.aspectRatio=vw+"/"+vh;
 const scale=Math.min(1,640/Math.max(vw,vh));
 W=Math.max(1,Math.round(vw*scale));
 H=Math.max(1,Math.round(vh*scale));
 work.width=W;work.height=H;
 diff.width=W;diff.height=H;
 $("resolution").textContent=vw+" × "+vh;
 resize();
}
function resize(){
 const r=stage.getBoundingClientRect();
 const dpr=devicePixelRatio||1;
 overlay.width=Math.round(r.width*dpr);
 overlay.height=Math.round(r.height*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 draw();
}
function rect(){
 const sw=video.videoWidth||W;
 const sh=video.videoHeight||H;
 const cw=overlay.clientWidth,ch=overlay.clientHeight;
 const scale=Math.min(cw/sw,ch/sh);
 return {
  x:(cw-sw*scale)/2,y:(ch-sh*scale)/2,
  w:sw*scale,h:sh*scale
 };
}
function toScreen(p){
 const r=rect();
 return {x:r.x+p.x/W*r.w,y:r.y+p.y/H*r.h};
}
function toImage(e){
 const r=overlay.getBoundingClientRect();
 const v=rect();
 const x=(e.clientX-r.left-v.x)/v.w*W;
 const y=(e.clientY-r.top-v.y)/v.h*H;
 if(x<0||x>W||y<0||y>H)return null;
 return {x,y};
}
function draw(){
 ctx.clearRect(0,0,overlay.clientWidth,overlay.clientHeight);
 function dot(p,color,label){
  const s=toScreen(p);
  ctx.beginPath();
  ctx.arc(s.x,s.y,6,0,Math.PI*2);
  ctx.fillStyle=color;ctx.fill();
  ctx.strokeStyle="white";ctx.lineWidth=1.5;ctx.stroke();
  ctx.fillStyle="white";ctx.font="12px Arial";
  ctx.fillText(label,s.x+9,s.y-9);
 }
 points.forEach((p,i)=>dot(p,"#27b8ff",String(i+1)));
 if(board){
  ctx.beginPath();
  for(let i=0;i<=120;i++){
   const a=i/120*Math.PI*2;
   const p={
    x:board.c.x+Math.cos(a)*board.vx.x+Math.sin(a)*board.vy.x,
    y:board.c.y+Math.cos(a)*board.vx.y+Math.sin(a)*board.vy.y
   };
   const s=toScreen(p);
   if(i===0)ctx.moveTo(s.x,s.y);
   else ctx.lineTo(s.x,s.y);
  }
  ctx.strokeStyle="#27b8ff";
  ctx.lineWidth=2;ctx.stroke();
 }
 if(pending?.position)dot(pending.position,"#ffcc00","DART");
}
async function startCamera(){
 const id=++requestId;
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;video.srcObject=null;
 board=null;points=[];pending=null;before=null;
 calibrating=false;
 $("calibrate").disabled=true;
 $("baseline").disabled=true;
 $("detect").disabled=true;
 $("cameraStatus").textContent="Connecting...";
 status("Connecting camera...");
 try{
  const s=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:{ideal:"environment"},
    width:{ideal:1280},
    height:{ideal:720}
   }
  });
  if(id!==requestId){
   s.getTracks().forEach(t=>t.stop());return;
  }
  stream=s;video.srcObject=s;
  await video.play();
  if(id!==requestId)return;
  configure();
  $("calibrate").disabled=false;
  $("cameraStatus").textContent="Camera active";
  status("PRESS START CALIBRATION");
  $("detectionStatus").textContent="Ready for calibration";
 }catch(e){
  if(id!==requestId)return;
  $("cameraStatus").textContent="Camera error";
  status(e.message);
 }
}
function stopCamera(){
 requestId++;
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;video.srcObject=null;
 board=null;points=[];before=null;pending=null;
 calibrating=false;
 $("calibrate").disabled=true;
 $("baseline").disabled=true;
 $("detect").disabled=true;
 $("cameraStatus").textContent="Camera stopped";
 status("Camera stopped");
 draw();
}
function capture(){
 if(!ready())throw Error("Camera not ready");
 wctx.drawImage(video,0,0,W,H);
 return wctx.getImageData(0,0,W,H);
}
function startCalibration(){
 if(!ready())return;
 points=[];board=null;pending=null;before=null;
 calibrating=true;
 $("baseline").disabled=true;
 $("detect").disabled=true;
 $("calibrate").textContent="RESTART CALIBRATION";
 status("STEP 1/5: TAP "+names[0]);
 draw();
}
function finishCalibration(){
 const [c,t,r,b,l]=points;
 const vx={x:(r.x-l.x)/2,y:(r.y-l.y)/2};
 const vy={x:(b.x-t.x)/2,y:(b.y-t.y)/2};
 const det=vx.x*vy.y-vx.y*vy.x;
 const top={x:c.x-vy.x,y:c.y-vy.y};
 const radius=Math.hypot(vy.x,vy.y);
 const error=Math.hypot(top.x-t.x,top.y-t.y);
 calibrating=false;
 if(Math.abs(det)<100||radius<35||error>radius*.3){
  points=[];
  status("CALIBRATION FAILED - PRESS RESTART");
  draw();return;
 }
 board={c,vx,vy,det};
 $("baseline").disabled=darts>=3;
 status("CALIBRATION COMPLETE");
 $("detectionStatus").textContent="Capture the empty board before throwing";
 draw();
}
function normalize(p){
 const dx=p.x-board.c.x,dy=p.y-board.c.y,d=board.det;
 return {
  x:(dx*board.vy.y-dy*board.vy.x)/d,
  y:(board.vx.x*dy-board.vx.y*dx)/d
 };
}
function scoring(p){
 if(!board)return null;
 const n=normalize(p);
 const mm=Math.hypot(n.x,n.y)*170;
 if(mm>170)return {score:0,segment:"MISS",multi:0};
 if(mm<=6.35)return {score:50,segment:"BULL",multi:2};
 if(mm<=15.9)return {score:25,segment:"OUTER BULL",multi:1};
 const a=(Math.atan2(n.x,-n.y)+Math.PI*2)%(Math.PI*2);
 const index=Math.floor((a+Math.PI/20)/(Math.PI/10))%20;
 const segment=numbers[index];
 let multi=1;
 if(mm>=99&&mm<=107)multi=3;
 if(mm>=162&&mm<=170)multi=2;
 return {score:segment*multi,segment,multi};
}
function candidate(p,confidence,corrected=false){
 const s=scoring(p);if(!s)return;
 pending={...s,position:p,confidence,corrected};
 $("score").textContent=s.score;
 $("segment").textContent="Segment: "+s.segment;
 $("multiplier").textContent="Multiplier: "+s.multi;
 $("confidence").textContent="Confidence: "+
  (confidence===null?"MANUAL":confidence+"%");
 $("manualScore").value=s.score;
 draw();
}
overlay.addEventListener("pointerdown",e=>{
 if(!ready())return;
 const p=toImage(e);if(!p)return;
 if(calibrating){
  points.push(p);
  if(points.length===5)finishCalibration();
  else status("STEP "+(points.length+1)+"/5: TAP "+names[points.length]);
  draw();return;
 }
 if(board){
  candidate(p,null,true);
  status("DART POSITION SELECTED");
  $("detectionStatus").textContent="Verify score and confirm";
 }
});
function baseline(){
 try{
  before=capture();pending=null;
  $("detect").disabled=false;
  $("detectionStatus").textContent="Throw one dart, then press DETECT";
  status("BASELINE CAPTURED");
  draw();
 }catch(e){status(e.message);}
}
function detect(){
 if(!before){status("CAPTURE BEFORE FIRST");return;}
 let after;
 try{after=capture();}catch(e){status(e.message);return;}
 const mask=new Uint8Array(W*H);
 let changed=0;
 for(let i=0;i<W*H;i++){
  const j=i*4;
  const delta=
   Math.abs(after.data[j]-before.data[j])+
   Math.abs(after.data[j+1]-before.data[j+1])+
   Math.abs(after.data[j+2]-before.data[j+2]);
  if(delta>85){mask[i]=1;changed++;}
 }
 if(changed/(W*H)>.12){
  status("CAMERA MOVEMENT DETECTED");return;
 }
 const visited=new Uint8Array(W*H),stack=[],components=[];
 for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
  const start=y*W+x;
  if(!mask[start]||visited[start])continue;
  visited[start]=1;stack.push(start);
  let count=0,sx=0,sy=0;
  while(stack.length){
   const i=stack.pop(),px=i%W,py=Math.floor(i/W);
   count++;sx+=px;sy+=py;
   for(const ni of [i-1,i+1,i-W,i+W]){
    if(ni<0||ni>=W*H||visited[ni]||!mask[ni])continue;
    const nx=ni%W,ny=Math.floor(ni/W);
    if(Math.abs(nx-px)+Math.abs(ny-py)!==1)continue;
    visited[ni]=1;stack.push(ni);
   }
  }
  if(count>=8&&count<12000){
   const p={x:sx/count,y:sy/count,count};
   const n=normalize(p);
   if(Math.hypot(n.x,n.y)<=1.05)components.push(p);
  }
 }
 const output=dctx.createImageData(W,H);
 for(let i=0;i<W*H;i++){
  const j=i*4;
  output.data[j]=mask[i]?39:after.data[j]*.25;
  output.data[j+1]=mask[i]?184:after.data[j+1]*.25;
  output.data[j+2]=mask[i]?255:after.data[j+2]*.25;
  output.data[j+3]=255;
 }
 dctx.putImageData(output,0,0);
 components.sort((a,b)=>b.count-a.count);
 if(!components.length){
  status("NO DART FOUND - TAP ENTRY POINT");
  return;
 }
 candidate(components[0],components.length>1?15:25);
 status("VERIFY DART ENTRY POINT");
 $("detectionStatus").textContent="Tap the dart tip if the candidate is incorrect";
}
function confirm(){
 if(darts>=3){status("VISIT COMPLETE");return;}
 const raw=$("manualScore").value.trim();
 if(raw===""){status("ENTER A SCORE");return;}
 const score=Number(raw);
 if(!Number.isInteger(score)||!valid.has(score)){
  status("INVALID DART SCORE");return;
 }
 darts++;total+=score;
 $("score").textContent=score;
 $("visitTotal").textContent=total;
 $("dartCount").textContent=darts+"/3";
 $("manualScore").value="";
 before=null;pending=null;
 $("detect").disabled=true;
 $("baseline").disabled=darts>=3;
 status(darts===3?"VISIT COMPLETE":"DART CONFIRMED");
 $("detectionStatus").textContent=darts===3?
  "Start a new visit":"Capture baseline for next dart";
 $("saveStatus").textContent="Confirmed locally. No database writes.";
 draw();
}
function newVisit(){
 darts=0;total=0;before=null;pending=null;
 $("score").textContent="---";
 $("visitTotal").textContent="0";
 $("dartCount").textContent="0/3";
 $("segment").textContent="Segment: ---";
 $("multiplier").textContent="Multiplier: ---";
 $("confidence").textContent="Confidence: ---";
 $("manualScore").value="";
 $("baseline").disabled=!board||!ready();
 $("detect").disabled=true;
 status(board?"NEW VISIT READY":"CALIBRATE BOARD");
 $("detectionStatus").textContent="Capture baseline";
 draw();
}
$("calibrate").onclick=startCalibration;
$("baseline").onclick=baseline;
$("detect").onclick=detect;
$("confirm").onclick=confirm;
$("newVisit").onclick=newVisit;
$("restartCamera").onclick=startCamera;
$("stopCamera").onclick=stopCamera;
window.addEventListener("resize",resize);
window.addEventListener("pagehide",stopCamera);
window.addEventListener("DOMContentLoaded",startCamera);
</script>
</body>
</html>
