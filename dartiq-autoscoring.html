
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b16">
<title>DARTIQ | Automatic Calibration</title>
<style>
:root{
 --bg:#050b16;
 --panel:#0d1a2b;
 --blue:#27b8ff;
 --line:#245078;
 --text:#eef8ff;
 --muted:#a6bdd5;
}
*{box-sizing:border-box}
body{
 margin:0;
 background:var(--bg);
 color:var(--text);
 font-family:Arial,sans-serif;
}
main{
 max-width:700px;
 margin:auto;
 padding:10px;
}
h1{
 text-align:center;
 color:var(--blue);
 letter-spacing:3px;
 text-shadow:0 0 18px #27b8ff88;
 margin:8px 0 3px;
}
.subtitle{
 text-align:center;
 font-size:12px;
 color:var(--muted);
 margin:0 0 12px;
}
.panel{
 background:var(--panel);
 border:1px solid var(--line);
 border-radius:14px;
 padding:10px;
}
.stage{
 position:relative;
 width:100%;
 background:#000;
 border-radius:10px;
 overflow:hidden;
}
video{
 display:block;
 width:100%;
 height:100%;
 object-fit:contain;
}
#overlay{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 pointer-events:none;
}
.status{
 text-align:center;
 padding:10px 4px;
 font-size:13px;
 color:var(--muted);
}
#instruction{
 color:var(--blue);
 font-weight:800;
}
button{
 border:0;
 border-radius:9px;
 padding:13px 8px;
 font-weight:800;
 font-size:12px;
 background:var(--blue);
 color:#00121e;
 cursor:pointer;
}
button:disabled{opacity:.4}
.secondary{
 background:#19334c;
 color:white;
 border:1px solid #376181;
}
.full{
 width:100%;
 margin-top:8px;
}
.actions{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
 margin-top:8px;
}
.scorebar{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:7px;
 margin-top:10px;
}
.metric{
 background:#071321;
 border:1px solid var(--line);
 border-radius:9px;
 text-align:center;
 padding:10px 3px;
}
.metric small{
 display:block;
 color:var(--muted);
 font-size:10px;
}
.metric strong{
 display:block;
 color:var(--blue);
 font-size:26px;
 margin-top:4px;
}
.details{
 display:flex;
 justify-content:space-between;
 gap:5px;
 color:var(--muted);
 font-size:11px;
 margin:10px 0;
}
input{
 width:100%;
 background:#071321;
 color:white;
 border:1px solid var(--line);
 border-radius:8px;
 padding:12px;
 font-size:16px;
 margin-top:10px;
}
#diagnostic{
 display:none;
 width:100%;
 margin-top:10px;
 border-radius:8px;
}
</style>
</head>
<body>
<main>
<h1>DARTIQ</h1>
<p class="subtitle">
 AUTO-SCORING | AUTOMATIC CALIBRATION
</p>

<section class="panel">

<div class="stage" id="stage">
 <video id="camera" autoplay muted playsinline></video>
 <canvas id="overlay"></canvas>
</div>

<div class="details">
 <span id="cameraStatus">Connecting camera...</span>
 <span id="resolution">---</span>
</div>

<div class="status" id="instruction">
 Waiting for camera
</div>

<button class="full" id="calibrate" disabled>
 START AUTOMATIC CALIBRATION
</button>

<div class="scorebar">
 <div class="metric">
  <small>DART SCORE</small>
  <strong id="score">---</strong>
 </div>
 <div class="metric">
  <small>VISIT TOTAL</small>
  <strong id="visitTotal">0</strong>
 </div>
 <div class="metric">
  <small>DARTS</small>
  <strong id="dartCount">0/3</strong>
 </div>
</div>

<div class="details">
 <span id="segment">Segment: ---</span>
 <span id="multiplier">Multiplier: ---</span>
 <span id="confidence">Detection: ---</span>
</div>

<div class="actions">
 <button id="baseline" disabled>CAPTURE BEFORE</button>
 <button id="detect" disabled>DETECT DART</button>
</div>

<input
 id="manualScore"
 type="number"
 min="0"
 max="60"
 placeholder="Confirm or correct dart score"
>

<div class="actions">
 <button id="confirm">CONFIRM DART</button>
 <button id="newVisit" class="secondary">NEW VISIT</button>
</div>

<div class="actions">
 <button id="restartCamera" class="secondary">
 RESTART CAMERA
 </button>
 <button id="stopCamera" class="secondary">
 STOP CAMERA
 </button>
</div>

<div class="status" id="detectionStatus">
 Awaiting calibration
</div>

<canvas id="diagnostic"></canvas>

<div class="status" id="saveStatus">
 Local prototype. No database writes.
</div>

</section>
</main>

<script>
"use strict";

const $=id=>document.getElementById(id);
const video=$("camera");
const stage=$("stage");
const overlay=$("overlay");
const ctx=overlay.getContext("2d");
const diagnostic=$("diagnostic");
const dctx=diagnostic.getContext("2d");

const work=document.createElement("canvas");
const wctx=work.getContext("2d",{
 willReadFrequently:true
});

let W=480,H=640;
let stream=null;
let requestId=0;
let board=null;
let before=null;
let pending=null;
let total=0;
let darts=0;
let calibrating=false;

const numbers=[
 20,1,18,4,13,6,10,15,2,17,
 3,19,7,16,8,11,14,9,12,5
];

const valid=new Set([0,25,50]);
for(let n=1;n<=20;n++){
 valid.add(n);
 valid.add(n*2);
 valid.add(n*3);
}

function status(s){
 $("instruction").textContent=s;
}

function ready(){
 return !!stream &&
 video.readyState>=2 &&
 video.videoWidth>0;
}

function configure(){
 const vw=video.videoWidth;
 const vh=video.videoHeight;
 if(!vw||!vh)return;

 stage.style.aspectRatio=vw+"/"+vh;

 const scale=Math.min(1,640/Math.max(vw,vh));
 W=Math.round(vw*scale);
 H=Math.round(vh*scale);

 work.width=W;
 work.height=H;
 diagnostic.width=W;
 diagnostic.height=H;

 $("resolution").textContent=vw+" × "+vh;
 resize();
}

function resize(){
 const r=stage.getBoundingClientRect();
 const dpr=devicePixelRatio||1;
 overlay.width=Math.round(r.width*dpr);
 overlay.height=Math.round(r.height*dpr);
 ctx.setTransform(dpr,0,0,dpr,0,0);
 draw();
}

function screenPoint(x,y){
 return {
  x:x/W*overlay.clientWidth,
  y:y/H*overlay.clientHeight
 };
}

function draw(){
 ctx.clearRect(
  0,0,
  overlay.clientWidth,
  overlay.clientHeight
 );

 if(board){
  const c=screenPoint(board.x,board.y);
  const sx=overlay.clientWidth/W;
  const sy=overlay.clientHeight/H;

  ctx.strokeStyle="#27b8ff";
  ctx.lineWidth=2;

  // Detected outer double-ring ellipse.
  ctx.beginPath();
  ctx.ellipse(
   c.x,c.y,
   board.rx*sx,
   board.ry*sy,
   0,0,Math.PI*2
  );
  ctx.stroke();

  // Bull reference.
  ctx.beginPath();
  ctx.arc(c.x,c.y,5,0,Math.PI*2);
  ctx.fillStyle="#27b8ff";
  ctx.fill();

  // Reference crosshair.
  ctx.beginPath();
  ctx.moveTo(c.x-12,c.y);
  ctx.lineTo(c.x+12,c.y);
  ctx.moveTo(c.x,c.y-12);
  ctx.lineTo(c.x,c.y+12);
  ctx.stroke();
 }

 if(pending){
  const p=screenPoint(pending.x,pending.y);
  ctx.beginPath();
  ctx.arc(p.x,p.y,7,0,Math.PI*2);
  ctx.fillStyle="#ffcc00";
  ctx.fill();
 }
}

async function startCamera(){
 const id=++requestId;

 if(stream){
  stream.getTracks().forEach(t=>t.stop());
 }

 stream=null;
 video.srcObject=null;
 board=null;
 before=null;
 pending=null;
 calibrating=false;

 $("calibrate").disabled=true;
 $("baseline").disabled=true;
 $("detect").disabled=true;

 status("CONNECTING CAMERA");

 try{
  if(!navigator.mediaDevices?.getUserMedia){
   throw Error("Camera access unavailable");
  }

  const s=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:{ideal:"environment"},
    width:{ideal:1280},
    height:{ideal:720}
   }
  });

  if(id!==requestId){
   s.getTracks().forEach(t=>t.stop());
   return;
  }

  stream=s;
  video.srcObject=s;
  await video.play();

  if(id!==requestId)return;

  configure();

  $("calibrate").disabled=false;
  $("cameraStatus").textContent="Camera active";
  status("PRESS START AUTOMATIC CALIBRATION");

 }catch(e){
  if(id!==requestId)return;
  $("cameraStatus").textContent="Camera error";
  status(e.message);
 }
}

function stopCamera(){
 requestId++;
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;
 video.srcObject=null;
 board=null;
 before=null;
 pending=null;
 calibrating=false;

 $("calibrate").disabled=true;
 $("baseline").disabled=true;
 $("detect").disabled=true;
 $("cameraStatus").textContent="Camera stopped";
 status("CAMERA STOPPED");
 draw();
}

function capture(){
 if(!ready())throw Error("Camera not ready");
 wctx.drawImage(video,0,0,W,H);
 return wctx.getImageData(0,0,W,H);
}

// Extract brightness and edge strength.
function imageEdges(frame){
 const gray=new Float32Array(W*H);
 const edge=new Float32Array(W*H);

 for(let i=0;i<W*H;i++){
  const j=i*4;
  gray[i]=
   frame.data[j]*.299+
   frame.data[j+1]*.587+
   frame.data[j+2]*.114;
 }

 for(let y=1;y<H-1;y++){
  for(let x=1;x<W-1;x++){
   const i=y*W+x;
   const gx=gray[i+1]-gray[i-1];
   const gy=gray[i+W]-gray[i-W];
   edge[i]=Math.hypot(gx,gy);
  }
 }

 return edge;
}

function edgeAt(edge,x,y){
 const ix=Math.round(x);
 const iy=Math.round(y);
 if(ix<1||iy<1||ix>=W-1||iy>=H-1)return 0;
 return edge[iy*W+ix];
}

// Sample elliptical ring edge strength.
function ringStrength(edge,cx,cy,rx,ry){
 let sum=0;
 let hits=0;
 const samples=96;

 for(let i=0;i<samples;i++){
  const a=i*Math.PI*2/samples;
  const x=cx+Math.cos(a)*rx;
  const y=cy+Math.sin(a)*ry;
  const e=edgeAt(edge,x,y);
  sum+=Math.min(e,100);
  if(e>18)hits++;
 }

 return {
  strength:sum/samples,
  coverage:hits/samples
 };
}

// Search for a centered, approximately elliptical
// dartboard ring. This is experimental and does not
// guarantee correct calibration.
function findBoard(frame){
 const edge=imageEdges(frame);

 const maxR=Math.min(W,H)*.48;
 const minR=Math.min(W,H)*.15;

 let best=null;

 // Candidate centers near image center.
 const cx0=W/2;
 const cy0=H/2;

 for(let cy=cy0-H*.2;cy<=cy0+H*.2;cy+=12){
  for(let cx=cx0-W*.2;cx<=cx0+W*.2;cx+=12){
   for(let r=minR;r<=maxR;r+=7){
    for(const ratio of [.7,.8,.9,1,1.1,1.2,1.3]){
     const rx=r;
     const ry=r*ratio;

     if(
      cx-rx<2||cx+rx>=W-2||
      cy-ry<2||cy+ry>=H-2
     )continue;

     const a=ringStrength(edge,cx,cy,rx,ry);

     // Prefer strong, continuous rings.
     const quality=a.strength*a.coverage;

     if(!best||quality>best.quality){
      best={cx,cy,rx,ry,quality,coverage:a.coverage};
     }
    }
   }
  }
 }

 if(!best)return null;

 // Refine the strongest candidate.
 let refined=best;

 for(let cy=best.cy-12;cy<=best.cy+12;cy+=3){
  for(let cx=best.cx-12;cx<=best.cx+12;cx+=3){
   for(let rx=best.rx-9;rx<=best.rx+9;rx+=3){
    for(let ry=best.ry-9;ry<=best.ry+9;ry+=3){
     if(
      rx<=0||ry<=0||
      cx-rx<2||cx+rx>=W-2||
      cy-ry<2||cy+ry>=H-2
     )continue;

     const a=ringStrength(edge,cx,cy,rx,ry);
     const quality=a.strength*a.coverage;

     if(quality>refined.quality){
      refined={
       cx,cy,rx,ry,
       quality,
       coverage:a.coverage
      };
     }
    }
   }
  }
 }

 return refined;
}

async function autoCalibrate(){
 if(!ready()||calibrating)return;

 calibrating=true;
 board=null;
 before=null;
 pending=null;

 $("calibrate").disabled=true;
 $("baseline").disabled=true;
 $("detect").disabled=true;

 status("ANALYZING DARTBOARD...");

 // Allow the status message to render.
 await new Promise(resolve=>
  requestAnimationFrame(()=>resolve())
 );

 try{
  const frame=capture();
  const found=findBoard(frame);

  if(!found){
   throw Error("Board ring not detected");
  }

  // Conservative geometry validation.
  if(
   found.coverage<.55||
   found.quality<13||
   found.rx<40||
   found.ry<40
  ){
   throw Error("Insufficient ring detection");
  }

  // This candidate is only a preliminary ellipse.
  // Ring identity and sector orientation are not
  // verified by the image-processing prototype.
  board={
   x:found.cx,
   y:found.cy,
   rx:found.rx,
   ry:found.ry,
   orientationVerified:false
  };

  draw();

  // Do not enable scoring until the actual outer
  // double ring and the 20 orientation are verified.
  status("BOARD CANDIDATE FOUND - NOT YET VERIFIED");

  $("detectionStatus").textContent=
   "Automatic ring candidate detected. "+
   "Scoring remains locked until ring and "+
   "sector orientation can be verified.";

  $("baseline").disabled=true;

 }catch(e){
  board=null;
  status("CALIBRATION FAILED");
  $("detectionStatus").textContent=e.message+
   ". Adjust the camera view and retry.";
  draw();
 }finally{
  calibrating=false;
  $("calibrate").disabled=!ready();
 }
}

// Scoring remains disabled until calibration
// is verified by a future detection engine.
function scoreAt(p){
 if(!board||!board.orientationVerified)return null;

 const nx=(p.x-board.x)/board.rx;
 const ny=(p.y-board.y)/board.ry;
 const mm=Math.hypot(nx,ny)*170;

 if(mm>170)return {score:0,segment:"MISS",multi:0};
 if(mm<=6.35)return {score:50,segment:"BULL",multi:2};
 if(mm<=15.9)return {score:25,segment:"OUTER BULL",multi:1};

 const a=(Math.atan2(nx,-ny)+Math.PI*2)%(Math.PI*2);
 const i=Math.floor((a+Math.PI/20)/(Math.PI/10))%20;
 const segment=numbers[i];

 let multi=1;
 if(mm>=99&&mm<=107)multi=3;
 if(mm>=162&&mm<=170)multi=2;

 return {score:segment*multi,segment,multi};
}

function baseline(){
 if(!board?.orientationVerified){
  status("CALIBRATION NOT VERIFIED");
  return;
 }
 before=capture();
 $("detect").disabled=false;
 status("BASELINE CAPTURED");
}

function detect(){
 if(!before||!board?.orientationVerified){
  status("CALIBRATION REQUIRED");
  return;
 }

 // Dart-tip detection requires a separately
 // validated algorithm, not an arbitrary
 // changed-pixel centroid.
 status("DART-TIP DETECTION NOT YET VERIFIED");
}

function confirm(){
 if(darts>=3){
  status("VISIT COMPLETE");
  return;
 }

 const raw=$("manualScore").value.trim();

 if(raw===""){
  status("ENTER A SCORE");
  return;
 }

 const value=Number(raw);

 if(!Number.isInteger(value)||!valid.has(value)){
  status("INVALID DART SCORE");
  return;
 }

 darts++;
 total+=value;

 $("score").textContent=value;
 $("visitTotal").textContent=total;
 $("dartCount").textContent=darts+"/3";
 $("manualScore").value="";

 status(darts===3?"VISIT COMPLETE":"DART CONFIRMED");
 $("saveStatus").textContent=
  "Confirmed locally. No database writes.";
}

function newVisit(){
 darts=0;
 total=0;
 before=null;
 pending=null;

 $("score").textContent="---";
 $("visitTotal").textContent="0";
 $("dartCount").textContent="0/3";
 $("segment").textContent="Segment: ---";
 $("multiplier").textContent="Multiplier: ---";
 $("confidence").textContent="Detection: ---";
 $("manualScore").value="";

 $("detect").disabled=true;
 $("baseline").disabled=!board?.orientationVerified;

 status(board?"BOARD CANDIDATE FOUND":"START CALIBRATION");
 draw();
}

$("calibrate").onclick=autoCalibrate;
$("baseline").onclick=baseline;
$("detect").onclick=detect;
$("confirm").onclick=confirm;
$("newVisit").onclick=newVisit;
$("restartCamera").onclick=startCamera;
$("stopCamera").onclick=stopCamera;

window.addEventListener("resize",resize);
window.addEventListener("pagehide",stopCamera);
window.addEventListener("DOMContentLoaded",startCamera);
</script>
</body>
</html>
