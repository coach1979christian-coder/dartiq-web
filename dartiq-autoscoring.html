<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b16">
<title>DARTIQ | Auto-Scoring V7</title>
<style>
:root{
  --bg:#050b16;
  --blue:#27b8ff;
  --green:#19e79a;
  --red:#ff5268;
  --muted:#b4c9dc;
}
*{box-sizing:border-box}
html,body{
  margin:0;width:100%;height:100%;
  overflow:hidden;background:#000;color:#fff;
  font-family:Arial,sans-serif;
}
button,input{font:inherit}
.app{
  position:relative;width:100%;max-width:800px;
  height:100vh;height:100dvh;
  margin:auto;overflow:hidden;background:#000;
}
video,canvas{
  position:absolute;inset:0;width:100%;height:100%;
}
video{object-fit:contain}
canvas{pointer-events:none}
.top{
  position:absolute;top:0;left:0;right:0;
  text-align:center;padding:8px 12px 17px;
  background:linear-gradient(#020916fa,#020916a0,transparent);
}
.logo{
  margin:0;color:var(--blue);font-size:24px;
  letter-spacing:4px;text-shadow:0 0 14px #27b8ff99;
}
.subtitle{
  color:var(--muted);font-size:10px;
  letter-spacing:1px;margin-top:3px;
}
.camera-info{
  display:flex;justify-content:space-between;
  margin-top:7px;font-size:10px;color:var(--muted);
}
.bottom{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;flex-direction:column;gap:5px;
  padding:8px 10px max(10px,env(safe-area-inset-bottom));
  background:linear-gradient(
    transparent,#020916ed 12%,#020916 42%
  );
}
.status{
  min-height:16px;text-align:center;
  color:var(--blue);font-size:12px;font-weight:800;
}
button{
  min-height:36px;padding:7px 5px;
  border:1px solid #27b8ff77;
  border-radius:8px;background:var(--blue);
  color:#00121e;font-size:11px;font-weight:800;
}
button:disabled{opacity:.38}
.secondary{background:#18334d;color:#fff}
.metrics{
  display:grid;grid-template-columns:repeat(3,1fr);
  gap:5px;
}
.metric{
  text-align:center;background:#031020ed;
  border:1px solid #27b8ff55;
  border-radius:8px;padding:6px 2px;
}
.metric small{
  display:block;font-size:9px;color:var(--muted);
}
.metric strong{
  display:block;color:var(--blue);
  font-size:24px;margin-top:2px;
}
.row{
  display:grid;grid-template-columns:1fr 1fr;gap:5px;
}
.score-row{
  display:grid;grid-template-columns:1fr 40%;gap:5px;
}
input{
  width:100%;min-width:0;min-height:36px;
  background:#031020ed;color:#fff;
  border:1px solid #27b8ff55;
  border-radius:8px;padding:8px;font-size:13px;
}
.details,.message{
  text-align:center;color:var(--muted);font-size:10px;
}
.review{
  display:none;border:1px solid #ffcc00;
  background:#292109ee;border-radius:8px;
  padding:7px;text-align:center;font-size:11px;
}
.review.show{display:block}
.review strong{color:#ffdd55}
@media(max-height:700px){
  .bottom{gap:3px;padding-top:4px}
  button{min-height:29px;padding:5px}
  .metric{padding:3px}
  .metric strong{font-size:19px}
  input{min-height:29px}
}
@media(max-height:560px){
  .logo{font-size:18px}
  .subtitle,.details{display:none}
  button{min-height:26px}
  .metric strong{font-size:17px}
}
</style>
</head>
<body>

<div class="app" id="app">
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="overlay"></canvas>

  <div class="top">
    <h1 class="logo">DARTIQ</h1>
    <div class="subtitle">
      AUTO-SCORING V7 | STABILIZED LIVE VISION
    </div>
    <div class="camera-info">
      <span id="cameraStatus">Connecting...</span>
      <span id="resolution">---</span>
    </div>
  </div>

  <div class="bottom">
    <div class="status" id="status">
      WAITING FOR CAMERA
    </div>

    <button id="calibrate" disabled>
      START AUTOMATIC CALIBRATION
    </button>

    <div class="metrics">
      <div class="metric">
        <small>DART SCORE</small>
        <strong id="score">---</strong>
      </div>
      <div class="metric">
        <small>VISIT TOTAL</small>
        <strong id="total">0</strong>
      </div>
      <div class="metric">
        <small>DARTS</small>
        <strong id="darts">0/3</strong>
      </div>
    </div>

    <div class="details" id="details">
      Calibration required
    </div>

    <div class="review" id="review">
      <strong id="candidateLabel">CANDIDATE</strong>
      <div>Verify dart position before confirming</div>
    </div>

    <div class="row">
      <button id="monitor" disabled>
        START MONITORING
      </button>
      <button id="pause" class="secondary" disabled>
        PAUSE
      </button>
    </div>

    <div class="score-row">
      <input
        id="manualScore"
        type="number"
        min="0"
        max="60"
        placeholder="Detected / manual score"
      >
      <button id="confirm">CONFIRM DART</button>
    </div>

    <div class="row">
      <button id="newVisit" class="secondary">
        NEW VISIT
      </button>
      <button id="restart" class="secondary">
        RESTART CAMERA
      </button>
    </div>

    <div class="message" id="message">
      Automatic stabilization enabled
    </div>
  </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const video=$("camera");
const app=$("app");
const canvas=$("overlay");
const ctx=canvas.getContext("2d");

const work=document.createElement("canvas");
const wc=work.getContext("2d",{
  willReadFrequently:true
});

const SECTORS=[
  20,1,18,4,13,6,10,15,2,17,
  3,19,7,16,8,11,14,9,12,5
];

const VALID=new Set([0,25,50]);
for(let n=1;n<=20;n++){
  VALID.add(n);
  VALID.add(n*2);
  VALID.add(n*3);
}

const CFG={
  calibrationDelay:3000,
  stableFrames:5,
  monitorInterval:400,
  motionThreshold:32,
  motionFraction:.045,
  majorMotionFraction:.12,
  changeThreshold:48,
  minimumPixels:12,
  maximumChangeFraction:.14,
  candidateFrames:3,
  duplicateCooldown:4500
};

let W=270,H=480;
let stream=null;
let cameraToken=0;
let board=null;
let baseline=null;
let candidate=null;
let marker=null;

let monitoring=false;
let calibrating=false;
let timer=null;
let generation=0;

let visitTotal=0;
let dartCount=0;

let previousFrame=null;
let stableCount=0;
let motionCount=0;
let candidateCount=0;
let previousCandidate=null;

let lastAcceptedSignature=null;
let lastAcceptedAt=0;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function status(s){
  $("status").textContent=s;
}

function message(s){
  $("message").textContent=s;
}

function ready(){
  return !!stream &&
    video.readyState>=2 &&
    video.videoWidth>0 &&
    video.videoHeight>0;
}

function resize(){
  const dpr=devicePixelRatio||1;

  canvas.width=Math.round(app.clientWidth*dpr);
  canvas.height=Math.round(app.clientHeight*dpr);

  ctx.setTransform(dpr,0,0,dpr,0,0);
  draw();
}

function imageRect(){
  const vw=video.videoWidth||W;
  const vh=video.videoHeight||H;

  const scale=Math.min(
    app.clientWidth/vw,
    app.clientHeight/vh
  );

  return {
    x:(app.clientWidth-vw*scale)/2,
    y:(app.clientHeight-vh*scale)/2,
    w:vw*scale,
    h:vh*scale
  };
}

function screenPoint(x,y){
  const r=imageRect();

  return {
    x:r.x+x/W*r.w,
    y:r.y+y/H*r.h
  };
}

function draw(){
  ctx.clearRect(
    0,0,app.clientWidth,app.clientHeight
  );

  if(!board)return;

  const r=imageRect();
  const c=screenPoint(board.x,board.y);

  const rx=board.rx/W*r.w;
  const ry=board.ry/H*r.h;

  function ring(scale,color){
    ctx.beginPath();
    ctx.ellipse(
      c.x,c.y,
      rx*scale,ry*scale,
      0,0,Math.PI*2
    );
    ctx.strokeStyle=color;
    ctx.lineWidth=1.5;
    ctx.stroke();
  }

  ring(1,"#27b8ff");
  ring(162/170,"#27b8ff");
  ring(107/170,"#27b8ff");
  ring(99/170,"#27b8ff");
  ring(15.9/170,"#ffcc00");
  ring(6.35/170,"#ffcc00");

  for(let i=0;i<20;i++){
    const a=(
      -99+i*18+board.rotation
    )*Math.PI/180;

    ctx.beginPath();

    ctx.moveTo(
      c.x+Math.cos(a)*rx*.1,
      c.y+Math.sin(a)*ry*.1
    );

    ctx.lineTo(
      c.x+Math.cos(a)*rx,
      c.y+Math.sin(a)*ry
    );

    ctx.strokeStyle="#27b8ff66";
    ctx.lineWidth=1;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(c.x,c.y,4,0,Math.PI*2);
  ctx.fillStyle="#27b8ff";
  ctx.fill();

  if(marker){
    const p=screenPoint(marker.x,marker.y);

    ctx.beginPath();
    ctx.arc(p.x,p.y,11,0,Math.PI*2);
    ctx.strokeStyle="#19e79a";
    ctx.lineWidth=3;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(p.x-16,p.y);
    ctx.lineTo(p.x+16,p.y);
    ctx.moveTo(p.x,p.y-16);
    ctx.lineTo(p.x,p.y+16);
    ctx.stroke();
  }
}

function capture(){
  if(!ready()){
    throw Error("Camera not ready");
  }

  wc.drawImage(video,0,0,W,H);
  return wc.getImageData(0,0,W,H);
}

function pixelDifference(a,b,i){
  return (
    Math.abs(a.data[i]-b.data[i])+
    Math.abs(a.data[i+1]-b.data[i+1])+
    Math.abs(a.data[i+2]-b.data[i+2])
  )/3;
}

function motionRatio(a,b,step=8){
  let changed=0;
  let count=0;

  for(let y=0;y<H;y+=step){
    for(let x=0;x<W;x+=step){
      const i=(y*W+x)*4;

      count++;

      if(
        pixelDifference(a,b,i)>
        CFG.motionThreshold
      ){
        changed++;
      }
    }
  }

  return changed/Math.max(1,count);
}

async function waitForStability(token,timeout=12000){
  const start=Date.now();

  let previous=null;
  let stable=0;

  while(Date.now()-start<timeout){
    if(token!==cameraToken){
      throw Error("Camera changed");
    }

    await sleep(350);

    const current=capture();

    if(previous){
      const motion=motionRatio(
        previous,current
      );

      if(motion<CFG.motionFraction){
        stable++;
      }else{
        stable=0;
      }

      status(
        stable>=CFG.stableFrames
          ?"CAMERA STABLE"
          :"STABILIZING CAMERA "+stable+
           "/"+CFG.stableFrames
      );

      if(stable>=CFG.stableFrames){
        return current;
      }
    }

    previous=current;
  }

  throw Error(
    "Camera did not stabilize. Check tripod."
  );
}

async function startCamera(){
  stopMonitoring();

  const token=++cameraToken;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }

  stream=null;
  video.srcObject=null;

  board=null;
  baseline=null;
  candidate=null;
  marker=null;

  $("calibrate").disabled=true;
  $("monitor").disabled=true;
  $("review").classList.remove("show");

  status("CONNECTING CAMERA");

  try{
    const s=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720}
      }
    });

    if(token!==cameraToken){
      s.getTracks().forEach(t=>t.stop());
      return;
    }

    stream=s;
    video.srcObject=s;

    await video.play();

    if(token!==cameraToken)return;

    const scale=Math.min(
      1,
      480/Math.max(
        video.videoWidth,
        video.videoHeight
      )
    );

    W=Math.round(video.videoWidth*scale);
    H=Math.round(video.videoHeight*scale);

    work.width=W;
    work.height=H;

    $("resolution").textContent=
      video.videoWidth+" × "+
      video.videoHeight;

    $("cameraStatus").textContent=
      "Camera active";

    $("calibrate").disabled=false;

    resize();

    status("READY FOR CALIBRATION");
    message("One tap, then release the tripod");

  }catch(e){
    status("CAMERA ERROR");
    message(e.message);
  }
}

function classify(r,g,b){
  if(
    Math.max(r,g,b)-
    Math.min(r,g,b)<35
  )return 0;

  if(
    r>65&&
    r>g*1.3&&
    r>b*1.25
  )return 1;

  if(
    g>45&&
    g>r*1.15&&
    g>b*1.12
  )return 2;

  return 0;
}

function maskFrom(frame){
  const mask=new Uint8Array(W*H);

  for(let i=0;i<W*H;i++){
    const j=i*4;

    mask[i]=classify(
      frame.data[j],
      frame.data[j+1],
      frame.data[j+2]
    );
  }

  return mask;
}

function maskAt(mask,x,y){
  x=Math.round(x);
  y=Math.round(y);

  if(
    x<0||y<0||
    x>=W||y>=H
  )return 0;

  return mask[y*W+x];
}

function ringStrength(mask,cx,cy,rx,ry){
  let hits=0;
  let valid=0;

  for(let i=0;i<80;i++){
    const a=i*Math.PI/40;

    const x=cx+Math.cos(a)*rx;
    const y=cy+Math.sin(a)*ry;

    if(
      x<0||y<0||
      x>=W||y>=H
    )continue;

    valid++;

    if(maskAt(mask,x,y)){
      hits++;
    }
  }

  return valid?hits/valid:0;
}

function geometrySearch(mask){
  let best=null;
  const md=Math.min(W,H);

  function scan(
    cx0,cy0,sx,sy,
    r0,r1,step,rs,ratios
  ){
    for(
      let cy=cy0-sy;
      cy<=cy0+sy;
      cy+=step
    ){
      for(
        let cx=cx0-sx;
        cx<=cx0+sx;
        cx+=step
      ){
        for(
          let rx=r0;
          rx<=r1;
          rx+=rs
        ){
          for(const ratio of ratios){
            const ry=rx*ratio;

            if(
              cx-rx<2||
              cx+rx>=W-2||
              cy-ry<2||
              cy+ry>=H-2
            )continue;

            const outer=ringStrength(
              mask,cx,cy,
              rx*.965,ry*.965
            );

            const triple=ringStrength(
              mask,cx,cy,
              rx*103/170,
              ry*103/170
            );

            const bull=ringStrength(
              mask,cx,cy,
              rx*15.9/170,
              ry*15.9/170
            );

            const quality=
              outer*.45+
              triple*.40+
              bull*.15;

            if(
              !best||
              quality>best.quality
            ){
              best={
                x:cx,y:cy,rx,ry,
                outer,triple,bull,
                quality
              };
            }
          }
        }
      }
    }
  }

  scan(
    W/2,H/2,
    W*.18,H*.18,
    md*.24,md*.49,
    8,6,
    [.75,.9,1,1.1,1.25]
  );

  if(best){
    const g=best;
    const ratio=g.ry/g.rx;

    scan(
      g.x,g.y,9,9,
      Math.max(10,g.rx-8),
      g.rx+8,
      3,3,
      [
        ratio-.07,
        ratio,
        ratio+.07
      ]
    );
  }

  return best;
}

function estimateRotation(mask,g){
  let best={
    rotation:0,
    quality:0
  };

  for(let rot=-9;rot<=9;rot++){
    let hits=0;
    let count=0;

    for(let i=0;i<20;i++){
      const a=(
        -90+rot+i*18
      )*Math.PI/180;

      const color=maskAt(
        mask,
        g.x+Math.cos(a)*g.rx*.965,
        g.y+Math.sin(a)*g.ry*.965
      );

      if(!color)continue;

      count++;

      if(color===(i%2===0?1:2)){
        hits++;
      }
    }

    const quality=count?hits/count:0;

    if(quality>best.quality){
      best={rotation:rot,quality};
    }
  }

  return best;
}

async function calibrate(){
  if(calibrating||!ready())return;

  stopMonitoring();

  calibrating=true;

  $("calibrate").disabled=true;
  $("monitor").disabled=true;

  board=null;
  baseline=null;
  candidate=null;
  marker=null;

  const token=cameraToken;

  try{
    for(let n=3;n>=1;n--){
      status("STABILIZATION STARTS IN "+n);
      await sleep(1000);
    }

    status("WAITING FOR STABLE CAMERA");

    const frame=await waitForStability(token);

    status("DETECTING SCORING RINGS");

    await sleep(30);

    const mask=maskFrom(frame);
    const g=geometrySearch(mask);

    if(
      !g||
      g.outer<.35||
      g.triple<.30||
      g.quality<.35
    ){
      throw Error(
        "Scoring rings not reliably detected"
      );
    }

    status("MAPPING SECTORS");

    const orientation=estimateRotation(
      mask,g
    );

    board={
      x:g.x,
      y:g.y,
      rx:g.rx,
      ry:g.ry,
      rotation:orientation.rotation,
      quality:g.quality
    };

    draw();

    $("details").textContent=
      "Rings detected | 20 sectors | Camera stabilized";

    baseline=null;

    $("monitor").disabled=false;

    status("CALIBRATION COMPLETE");
    message("Automatic monitoring starting");

    startMonitoring();

  }catch(e){
    board=null;
    draw();

    status("CALIBRATION FAILED");
    message(e.message);

  }finally{
    calibrating=false;
    $("calibrate").disabled=!ready();
  }
}

function normalized(x,y){
  return {
    x:(x-board.x)/board.rx,
    y:(y-board.y)/board.ry
  };
}

function onBoard(x,y){
  const p=normalized(x,y);

  return Math.hypot(
    p.x,p.y
  )<=1.02;
}

function changedPixels(a,b){
  const pixels=[];

  for(let y=2;y<H-2;y+=2){
    for(let x=2;x<W-2;x+=2){
      if(!onBoard(x,y))continue;

      const i=(y*W+x)*4;
      const diff=pixelDifference(a,b,i);

      if(diff>CFG.changeThreshold){
        pixels.push({x,y,diff});
      }
    }
  }

  return pixels;
}

function findCandidate(pixels){
  if(pixels.length<CFG.minimumPixels){
    return null;
  }

  const cellSize=8;
  const cells=new Map();

  for(const p of pixels){
    const cx=Math.floor(
      p.x/cellSize
    );

    const cy=Math.floor(
      p.y/cellSize
    );

    const key=cx+","+cy;

    if(!cells.has(key)){
      cells.set(key,{
        cx,cy,
        points:[],
        seen:false
      });
    }

    cells.get(key).points.push(p);
  }

  const groups=[];

  for(const start of cells.values()){
    if(start.seen)continue;

    const queue=[start];
    const points=[];

    start.seen=true;

    for(let k=0;k<queue.length;k++){
      const c=queue[k];

      points.push(...c.points);

      for(let dy=-1;dy<=1;dy++){
        for(let dx=-1;dx<=1;dx++){
          if(!dx&&!dy)continue;

          const neighbor=cells.get(
            (c.cx+dx)+","+
            (c.cy+dy)
          );

          if(
            neighbor&&
            !neighbor.seen
          ){
            neighbor.seen=true;
            queue.push(neighbor);
          }
        }
      }
    }

    if(points.length>=CFG.minimumPixels){
      groups.push(points);
    }
  }

  if(!groups.length)return null;

  groups.sort(
    (a,b)=>b.length-a.length
  );

  const group=groups[0];

  let best=null;
  let distance=Infinity;

  for(const p of group){
    const n=normalized(p.x,p.y);

    const d=Math.hypot(
      n.x,n.y
    );

    if(d<distance){
      distance=d;
      best=p;
    }
  }

  if(!best)return null;

  return {
    x:best.x,
    y:best.y,
    pixels:group.length
  };
}

function scoreAt(x,y){
  const p=normalized(x,y);
  const radius=Math.hypot(p.x,p.y);

  if(radius>1){
    return {
      score:0,
      label:"MISS",x,y
    };
  }

  if(radius<=6.35/170){
    return {
      score:50,
      label:"BULL",x,y
    };
  }

  if(radius<=15.9/170){
    return {
      score:25,
      label:"OUTER BULL",x,y
    };
  }

  let angle=Math.atan2(
    p.y,p.x
  )*180/Math.PI;

  angle=(
    angle+90-board.rotation+360
  )%360;

  const index=Math.floor(
    (angle+9)/18
  )%20;

  const number=SECTORS[index];

  let multiplier=1;
  let ring="SINGLE";

  if(
    radius>=99/170&&
    radius<=107/170
  ){
    multiplier=3;
    ring="TRIPLE";
  }

  if(
    radius>=162/170&&
    radius<=1
  ){
    multiplier=2;
    ring="DOUBLE";
  }

  return {
    score:number*multiplier,
    label:ring+" "+number,
    x,y
  };
}

function signature(hit){
  return (
    Math.round(hit.x/8)+":"+
    Math.round(hit.y/8)
  );
}

function stopMonitoring(){
  monitoring=false;
  generation++;

  if(timer!==null){
    clearTimeout(timer);
    timer=null;
  }

  $("pause").disabled=true;
  $("monitor").disabled=!board;
}

function startMonitoring(){
  if(
    !board||
    !ready()||
    monitoring||
    candidate
  )return;

  if(dartCount>=3){
    status("VISIT COMPLETE");
    return;
  }

  monitoring=true;
  const id=++generation;

  previousFrame=null;
  stableCount=0;
  motionCount=0;
  candidateCount=0;
  previousCandidate=null;

  $("monitor").disabled=true;
  $("pause").disabled=false;

  status("STABILIZING LIVE MONITOR");

  monitorLoop(id);
}

function monitorLoop(id){
  if(
    !monitoring||
    id!==generation
  )return;

  timer=setTimeout(
    ()=>monitorFrame(id),
    CFG.monitorInterval
  );
}

function monitorFrame(id){
  if(
    !monitoring||
    id!==generation||
    !board||
    !ready()
  )return;

  try{
    const frame=capture();

    if(!previousFrame){
      previousFrame=frame;
      monitorLoop(id);
      return;
    }

    const frameMotion=motionRatio(
      previousFrame,frame
    );

    previousFrame=frame;

    if(frameMotion>CFG.motionFraction){
      stableCount=0;
      motionCount++;

      status("WAITING FOR CAMERA TO SETTLE");

      if(motionCount>=2){
        baseline=null;
        candidateCount=0;
        previousCandidate=null;
      }

      monitorLoop(id);
      return;
    }

    motionCount=0;
    stableCount++;

    if(!baseline){
      if(stableCount>=CFG.stableFrames){
        baseline=frame;
        status("BASELINE READY");
        message("Throw one dart");
      }else{
        status(
          "STABILIZING "+
          stableCount+"/"+CFG.stableFrames
        );
      }

      monitorLoop(id);
      return;
    }

    const change=motionRatio(
      baseline,frame,4
    );

    if(change<.008){
      candidateCount=0;
      previousCandidate=null;
      monitorLoop(id);
      return;
    }

    if(change>CFG.maximumChangeFraction){
      /*
        Significant scene change.
        Do not interpret this as a dart.
      */
      baseline=null;
      stableCount=0;
      candidateCount=0;
      previousCandidate=null;

      status("SCENE CHANGED");
      message("Waiting for stable baseline");

      monitorLoop(id);
      return;
    }

    const pixels=changedPixels(
      baseline,frame
    );

    const hit=findCandidate(pixels);

    if(!hit){
      candidateCount=0;
      previousCandidate=null;
      monitorLoop(id);
      return;
    }

    if(previousCandidate){
      const distance=Math.hypot(
        hit.x-previousCandidate.x,
        hit.y-previousCandidate.y
      );

      if(distance<=8){
        candidateCount++;
      }else{
        candidateCount=1;
      }
    }else{
      candidateCount=1;
    }

    previousCandidate=hit;

    if(candidateCount<CFG.candidateFrames){
      status("VERIFYING DART CANDIDATE");
      monitorLoop(id);
      return;
    }

    const sig=signature(hit);

    if(
      sig===lastAcceptedSignature&&
      Date.now()-lastAcceptedAt<
      CFG.duplicateCooldown
    ){
      monitorLoop(id);
      return;
    }

    const result=scoreAt(
      hit.x,hit.y
    );

    candidate={
      ...result,
      signature:sig,
      after:frame
    };

    marker=result;

    $("score").textContent=result.score;
    $("manualScore").value=result.score;

    $("candidateLabel").textContent=
      result.label+" = "+result.score;

    $("review").classList.add("show");

    draw();

    stopMonitoring();

    status("DART CANDIDATE DETECTED");
    message("Check marker and confirm score");

  }catch(e){
    stopMonitoring();
    status("MONITOR ERROR");
    message(e.message);
    return;
  }

  monitorLoop(id);
}

function confirmDart(){
  if(dartCount>=3){
    status("VISIT COMPLETE");
    return;
  }

  const raw=$("manualScore").value.trim();

  if(raw===""){
    status("ENTER DART SCORE");
    return;
  }

  const value=Number(raw);

  if(
    !Number.isInteger(value)||
    !VALID.has(value)
  ){
    status("INVALID SCORE");
    return;
  }

  dartCount++;
  visitTotal+=value;

  $("score").textContent=value;
  $("total").textContent=visitTotal;
  $("darts").textContent=
    dartCount+"/3";

  if(candidate){
    baseline=candidate.after;
    lastAcceptedSignature=
      candidate.signature;

    lastAcceptedAt=Date.now();
  }else{
    baseline=null;
    lastAcceptedSignature=null;
  }

  candidate=null;
  marker=null;

  $("manualScore").value="";
  $("review").classList.remove("show");

  draw();

  if(dartCount>=3){
    stopMonitoring();

    status("VISIT COMPLETE");
    message("Remove darts and start new visit");
  }else{
    status("DART CONFIRMED");
    message("Monitoring next dart");
    startMonitoring();
  }
}

function newVisit(){
  stopMonitoring();

  dartCount=0;
  visitTotal=0;

  baseline=null;
  candidate=null;
  marker=null;

  lastAcceptedSignature=null;
  lastAcceptedAt=0;

  $("score").textContent="---";
  $("total").textContent="0";
  $("darts").textContent="0/3";
  $("manualScore").value="";

  $("review").classList.remove("show");

  draw();

  if(board){
    status("NEW VISIT READY");
    message("Remove all darts before monitoring");
    $("monitor").disabled=false;
  }else{
    status("CALIBRATION REQUIRED");
  }
}

$("calibrate").onclick=calibrate;

$("monitor").onclick=startMonitoring;

$("pause").onclick=()=>{
  stopMonitoring();
  status("MONITORING PAUSED");
};

$("confirm").onclick=confirmDart;
$("newVisit").onclick=newVisit;
$("restart").onclick=startCamera;

window.addEventListener("resize",resize);

if(window.ResizeObserver){
  new ResizeObserver(resize).observe(app);
}

window.addEventListener("pagehide",()=>{
  stopMonitoring();
  cameraToken++;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }
});

window.addEventListener(
  "DOMContentLoaded",
  startCamera
);
</script>
