<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b16">
<title>DARTIQ | Auto-Scoring V4</title>
<style>
:root{
 --bg:#050b16;
 --blue:#27b8ff;
 --muted:#a6bdd5;
 --line:#245078;
}
*{box-sizing:border-box}
html,body{
 margin:0;
 width:100%;
 height:100%;
 overflow:hidden;
 background:var(--bg);
 color:white;
 font-family:Arial,sans-serif;
}
main{
 width:100%;
 max-width:700px;
 height:100dvh;
 margin:auto;
 padding:5px 8px;
 display:flex;
 flex-direction:column;
 gap:5px;
}
header{text-align:center;flex:none}
h1{
 margin:0;
 font-size:20px;
 letter-spacing:3px;
 color:var(--blue);
 text-shadow:0 0 12px #27b8ff88;
}
.subtitle{
 font-size:9px;
 color:var(--muted);
 margin:2px;
}
.stage{
 position:relative;
 flex:1;
 min-height:80px;
 border:1px solid var(--line);
 border-radius:9px;
 overflow:hidden;
 background:black;
 display:flex;
 align-items:center;
 justify-content:center;
}
video{
 width:100%;
 height:100%;
 object-fit:contain;
}
#overlay{
 position:absolute;
 inset:0;
 width:100%;
 height:100%;
 pointer-events:none;
}
.status{
 text-align:center;
 font-size:11px;
 color:var(--blue);
 font-weight:bold;
 min-height:14px;
}
button{
 border:0;
 border-radius:7px;
 background:var(--blue);
 color:#00121e;
 font-size:11px;
 font-weight:bold;
 min-height:36px;
 padding:7px 4px;
}
button:disabled{opacity:.35}
.secondary{
 background:#19334c;
 color:white;
 border:1px solid #376181;
}
.grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:5px;
 flex:none;
}
.metrics{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:5px;
 flex:none;
}
.metric{
 background:#071321;
 border:1px solid var(--line);
 border-radius:7px;
 text-align:center;
 padding:5px;
}
.metric small{
 display:block;
 font-size:9px;
 color:var(--muted);
}
.metric strong{
 display:block;
 font-size:22px;
 color:var(--blue);
}
input{
 width:100%;
 min-width:0;
 border:1px solid var(--line);
 background:#071321;
 border-radius:7px;
 color:white;
 padding:8px;
 font-size:13px;
}
.score-input{
 display:grid;
 grid-template-columns:1fr 42%;
 gap:5px;
 flex:none;
}
#message{
 text-align:center;
 font-size:10px;
 color:var(--muted);
 min-height:12px;
}
#cameraInfo{
 display:flex;
 justify-content:space-between;
 color:var(--muted);
 font-size:10px;
}
@media(max-height:650px){
 main{gap:3px;padding:3px 6px}
 h1{font-size:17px}
 button{min-height:29px;padding:4px}
 .metric{padding:3px}
 .metric strong{font-size:18px}
 input{padding:5px}
}
</style>
</head>
<body>

<main>
<header>
<h1>DARTIQ</h1>
<p class="subtitle">AUTO-SCORING V4 | ONE-TOUCH CALIBRATION</p>
</header>

<div class="stage" id="stage">
 <video id="camera" autoplay muted playsinline></video>
 <canvas id="overlay"></canvas>
</div>

<div id="cameraInfo">
 <span id="cameraStatus">Connecting camera...</span>
 <span id="resolution">---</span>
</div>

<div class="status" id="instruction">
 WAITING FOR CAMERA
</div>

<button id="calibrate" disabled>
 START AUTOMATIC CALIBRATION
</button>

<div class="metrics">
 <div class="metric">
  <small>DART SCORE</small>
  <strong id="score">---</strong>
 </div>
 <div class="metric">
  <small>VISIT TOTAL</small>
  <strong id="total">0</strong>
 </div>
 <div class="metric">
  <small>DARTS</small>
  <strong id="darts">0/3</strong>
 </div>
</div>

<div class="status" id="details">
 NOT CALIBRATED
</div>

<div class="grid">
 <button id="baseline" disabled>CAPTURE BEFORE</button>
 <button id="detect" disabled>DETECT DART</button>
</div>

<div class="score-input">
 <input id="manualScore" type="number" min="0" max="60" placeholder="Dart score">
 <button id="confirm">CONFIRM DART</button>
</div>

<div class="grid">
 <button id="newVisit" class="secondary">NEW VISIT</button>
 <button id="restartCamera" class="secondary">RESTART CAMERA</button>
</div>

<div id="message">Local prototype | No database writes</div>
</main>

<script>
"use strict";

const $=id=>document.getElementById(id);
const video=$("camera");
const stage=$("stage");
const overlay=$("overlay");
const ctx=overlay.getContext("2d");

const work=document.createElement("canvas");
const wctx=work.getContext("2d",{
 willReadFrequently:true
});

let W=480,H=640;
let stream=null;
let requestId=0;
let board=null;
let before=null;
let visitTotal=0;
let dartCount=0;
let calibrating=false;
let candidate=null;

const SEGMENTS=[
 20,1,18,4,13,6,10,15,2,17,
 3,19,7,16,8,11,14,9,12,5
];

const validScores=new Set([0,25,50]);
for(let i=1;i<=20;i++){
 validScores.add(i);
 validScores.add(i*2);
 validScores.add(i*3);
}

function status(text){
 $("instruction").textContent=text;
}
function message(text){
 $("message").textContent=text;
}
function ready(){
 return !!stream &&
 video.readyState>=2 &&
 video.videoWidth>0 &&
 video.videoHeight>0;
}

function configure(){
 const vw=video.videoWidth;
 const vh=video.videoHeight;

 const scale=Math.min(1,640/Math.max(vw,vh));

 W=Math.max(1,Math.round(vw*scale));
 H=Math.max(1,Math.round(vh*scale));

 work.width=W;
 work.height=H;

 $("resolution").textContent=vw+" × "+vh;
 resize();
}

function videoRect(){
 const vw=video.videoWidth||W;
 const vh=video.videoHeight||H;
 const cw=stage.clientWidth;
 const ch=stage.clientHeight;
 const scale=Math.min(cw/vw,ch/vh);

 return {
  x:(cw-vw*scale)/2,
  y:(ch-vh*scale)/2,
  w:vw*scale,
  h:vh*scale
 };
}

function resize(){
 const r=stage.getBoundingClientRect();
 const dpr=devicePixelRatio||1;

 overlay.width=Math.round(r.width*dpr);
 overlay.height=Math.round(r.height*dpr);

 ctx.setTransform(dpr,0,0,dpr,0,0);
 draw();
}

function toScreen(x,y){
 const r=videoRect();

 return {
  x:r.x+x/W*r.w,
  y:r.y+y/H*r.h
 };
}

function draw(){
 ctx.clearRect(
  0,0,
  overlay.clientWidth,
  overlay.clientHeight
 );

 if(!board)return;

 const c=toScreen(board.x,board.y);
 const r=videoRect();

 function ellipse(radius,color){
  ctx.beginPath();
  ctx.ellipse(
   c.x,c.y,
   board.rx*radius/W*r.w,
   board.ry*radius/H*r.h,
   0,0,Math.PI*2
  );
  ctx.strokeStyle=color;
  ctx.lineWidth=1.5;
  ctx.stroke();
 }

 ellipse(1,"#27b8ff");
 ellipse(103/170,"#27b8ff");
 ellipse(15.9/170,"#ffcc00");

 ctx.beginPath();
 ctx.arc(c.x,c.y,4,0,Math.PI*2);
 ctx.fillStyle="#27b8ff";
 ctx.fill();

 if(candidate){
  const p=toScreen(candidate.x,candidate.y);
  ctx.beginPath();
  ctx.arc(p.x,p.y,7,0,Math.PI*2);
  ctx.fillStyle="#ffcc00";
  ctx.fill();
 }
}

async function startCamera(){
 const id=++requestId;

 if(stream){
  stream.getTracks().forEach(t=>t.stop());
 }

 stream=null;
 video.srcObject=null;
 board=null;
 before=null;
 candidate=null;

 $("calibrate").disabled=true;
 $("baseline").disabled=true;
 $("detect").disabled=true;

 status("CONNECTING CAMERA");

 try{
  const s=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:{ideal:"environment"},
    width:{ideal:1280},
    height:{ideal:720}
   }
  });

  if(id!==requestId){
   s.getTracks().forEach(t=>t.stop());
   return;
  }

  stream=s;
  video.srcObject=s;

  await video.play();

  if(id!==requestId)return;

  configure();

  $("calibrate").disabled=false;
  $("cameraStatus").textContent="Camera active";

  status("PRESS START AUTOMATIC CALIBRATION");
  message("Ensure the full board is visible");

 }catch(e){
  if(id!==requestId)return;
  status("CAMERA ERROR");
  message(e.message);
 }
}

function capture(){
 if(!ready())throw Error("Camera not ready");

 wctx.drawImage(video,0,0,W,H);

 return wctx.getImageData(0,0,W,H);
}

// Red and green dartboard scoring-band detector.
function classifyPixel(r,g,b){
 const max=Math.max(r,g,b);
 const min=Math.min(r,g,b);
 const delta=max-min;

 if(delta<35)return 0;

 if(r>65 && r>g*1.3 && r>b*1.25){
  return 1;
 }

 if(g>45 && g>r*1.15 && g>b*1.12){
  return 2;
 }

 return 0;
}

function makeColorMask(frame){
 const mask=new Uint8Array(W*H);

 for(let i=0;i<W*H;i++){
  const j=i*4;

  mask[i]=classifyPixel(
   frame.data[j],
   frame.data[j+1],
   frame.data[j+2]
  );
 }

 return mask;
}

function colorAt(mask,x,y){
 const ix=Math.round(x);
 const iy=Math.round(y);

 if(ix<0||iy<0||ix>=W||iy>=H)return 0;

 return mask[iy*W+ix];
}

// Search colored annular bands.
function ringColorStrength(mask,cx,cy,rx,ry){
 let hits=0;
 let valid=0;

 const samples=120;

 for(let i=0;i<samples;i++){
  const a=i/samples*Math.PI*2;

  const x=cx+Math.cos(a)*rx;
  const y=cy+Math.sin(a)*ry;

  if(x<1||y<1||x>=W-1||y>=H-1)continue;

  valid++;

  if(colorAt(mask,x,y)>0)hits++;
 }

 return valid?hits/valid:0;
}

// Find colored double ring and triple ring jointly.
// Assumes a roughly elliptical projected board.
function detectBoardGeometry(mask){
 const minDim=Math.min(W,H);

 const centerX=W/2;
 const centerY=H/2;

 let best=null;

 const minRadius=minDim*.24;
 const maxRadius=minDim*.49;

 for(
  let cy=centerY-H*.18;
  cy<=centerY+H*.18;
  cy+=8
 ){
  for(
   let cx=centerX-W*.18;
   cx<=centerX+W*.18;
   cx+=8
  ){
   for(
    let rx=minRadius;
    rx<=maxRadius;
    rx+=5
   ){
    for(const ratio of [.75,.85,.95,1,1.05,1.15,1.25]){
     const ry=rx*ratio;

     if(
      cx-rx<2||cx+rx>=W-2||
      cy-ry<2||cy+ry>=H-2
     )continue;

     const outer=ringColorStrength(
      mask,cx,cy,rx*.965,ry*.965
     );

     const triple=ringColorStrength(
      mask,cx,cy,
      rx*(103/170),
      ry*(103/170)
     );

     const inner=ringColorStrength(
      mask,cx,cy,
      rx*(15.9/170),
      ry*(15.9/170)
     );

     const quality=
      outer*.45+
      triple*.40+
      inner*.15;

     if(!best||quality>best.quality){
      best={
       x:cx,y:cy,
       rx,ry,
       quality,
       outer,triple,inner
      };
     }
    }
   }
  }
 }

 if(!best)return null;

 // Fine search.
 let refined=best;

 for(let cy=best.y-8;cy<=best.y+8;cy+=2){
  for(let cx=best.x-8;cx<=best.x+8;cx+=2){
   for(let rx=best.rx-8;rx<=best.rx+8;rx+=2){
    for(let ry=best.ry-8;ry<=best.ry+8;ry+=2){
     if(
      rx<=0||ry<=0||
      cx-rx<2||cx+rx>=W-2||
      cy-ry<2||cy+ry>=H-2
     )continue;

     const outer=ringColorStrength(
      mask,cx,cy,rx*.965,ry*.965
     );

     const triple=ringColorStrength(
      mask,cx,cy,
      rx*(103/170),
      ry*(103/170)
     );

     const inner=ringColorStrength(
      mask,cx,cy,
      rx*(15.9/170),
      ry*(15.9/170)
     );

     const quality=
      outer*.45+
      triple*.40+
      inner*.15;

     if(quality>refined.quality){
      refined={
       x:cx,y:cy,
       rx,ry,
       quality,
       outer,triple,inner
      };
     }
    }
   }
  }
 }

 return refined;
}

// Automatic bull refinement based on red/green pixels.
function refineBull(mask,geometry){
 const searchX=geometry.rx*.12;
 const searchY=geometry.ry*.12;

 let best=null;

 for(
  let y=geometry.y-searchY;
  y<=geometry.y+searchY;
  y+=2
 ){
  for(
   let x=geometry.x-searchX;
   x<=geometry.x+searchX;
   x+=2
  ){
   let hits=0;
   let samples=0;

   for(let dy=-5;dy<=5;dy+=2){
    for(let dx=-5;dx<=5;dx+=2){
     samples++;

     if(colorAt(mask,x+dx,y+dy)){
      hits++;
     }
    }
   }

   const score=hits/samples;

   if(!best||score>best.score){
    best={x,y,score};
   }
  }
 }

 return best;
}

function validateGeometry(g,bull){
 if(!g||!bull)return false;

 if(g.outer<.40)return false;
 if(g.triple<.35)return false;
 if(g.quality<.40)return false;
 if(bull.score<.30)return false;

 const dx=(bull.x-g.x)/g.rx;
 const dy=(bull.y-g.y)/g.ry;

 if(Math.hypot(dx,dy)>.10)return false;

 return true;
}

async function automaticCalibration(){
 if(!ready()||calibrating)return;

 calibrating=true;

 $("calibrate").disabled=true;
 $("baseline").disabled=true;
 $("detect").disabled=true;

 board=null;
 candidate=null;

 const stages=[
  "CAPTURING BOARD",
  "DETECTING SCORING RINGS",
  "LOCATING BULLSEYE",
  "VALIDATING BOARD GEOMETRY"
 ];

 try{
  status(stages[0]);

  await new Promise(r=>requestAnimationFrame(r));

  const frame=capture();
  const mask=makeColorMask(frame);

  status(stages[1]);

  await new Promise(r=>setTimeout(r,30));

  const geometry=detectBoardGeometry(mask);

  if(!geometry){
   throw Error("Scoring rings not found");
  }

  status(stages[2]);

  await new Promise(r=>setTimeout(r,30));

  const bull=refineBull(mask,geometry);

  status(stages[3]);

  await new Promise(r=>setTimeout(r,30));

  if(!validateGeometry(geometry,bull)){
   throw Error(
    "Board geometry could not be validated"
   );
  }

  board={
   x:geometry.x,
   y:geometry.y,
   rx:geometry.rx,
   ry:geometry.ry,
   bullX:bull.x,
   bullY:bull.y,
   geometryVerified:true,
   orientationVerified:false
  };

  draw();

  // The 20 sector cannot be reliably determined
  // from red/green ring colors alone.
  // Keep scoring locked until orientation is known.
  status("GEOMETRY DETECTED");

  $("details").textContent=
   "Rings: OK | Bull: OK | Orientation: UNVERIFIED";

  message(
   "Automatic sector identification still required"
  );

 }catch(e){
  board=null;
  draw();

  status("CALIBRATION FAILED");
  message(e.message);

 }finally{
  calibrating=false;
  $("calibrate").disabled=!ready();
 }
}

function captureBaseline(){
 if(!board?.orientationVerified){
  status("CALIBRATION INCOMPLETE");
  return;
 }

 before=capture();

 $("detect").disabled=false;

 status("BASELINE CAPTURED");
 message("Throw one dart");
}

function detectDart(){
 if(!before||!board?.orientationVerified){
  status("CALIBRATION REQUIRED");
  return;
 }

 status("DART DETECTION NOT YET VALIDATED");
}

function confirmDart(){
 if(dartCount>=3){
  status("VISIT COMPLETE");
  return;
 }

 const raw=$("manualScore").value.trim();

 if(raw===""){
  status("ENTER SCORE");
  return;
 }

 const score=Number(raw);

 if(!Number.isInteger(score)||!validScores.has(score)){
  status("INVALID DART SCORE");
  return;
 }

 dartCount++;
 visitTotal+=score;

 $("score").textContent=score;
 $("total").textContent=visitTotal;
 $("darts").textContent=dartCount+"/3";

 $("manualScore").value="";

 status(
  dartCount===3
   ?"VISIT COMPLETE"
   :"DART CONFIRMED"
 );

 message("Score stored locally");
}

function newVisit(){
 dartCount=0;
 visitTotal=0;
 before=null;
 candidate=null;

 $("score").textContent="---";
 $("total").textContent="0";
 $("darts").textContent="0/3";
 $("manualScore").value="";

 $("detect").disabled=true;
 $("baseline").disabled=!board?.orientationVerified;

 status(board?"BOARD GEOMETRY DETECTED":"START CALIBRATION");
 draw();
}

$("calibrate").onclick=automaticCalibration;
$("baseline").onclick=captureBaseline;
$("detect").onclick=detectDart;
$("confirm").onclick=confirmDart;
$("newVisit").onclick=newVisit;
$("restartCamera").onclick=startCamera;

window.addEventListener("resize",resize);

if(window.ResizeObserver){
 new ResizeObserver(resize).observe(stage);
}

window.addEventListener("pagehide",()=>{
 requestId++;

 if(stream){
  stream.getTracks().forEach(t=>t.stop());
 }
});

window.addEventListener("DOMContentLoaded",startCamera);
</script>
</body>
</html>
