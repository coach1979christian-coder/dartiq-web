
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050b16">
<title>DARTIQ | Auto-Scoring V16</title>
<style>
:root{
  --bg:#050b16;
  --blue:#27b8ff;
  --green:#37f5a1;
  --red:#ff6578;
  --yellow:#ffd166;
  --muted:#9db6cc;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:var(--bg);
  color:#fff;
  font-family:Arial,sans-serif;
}
button,input{font:inherit}
button{
  border:1px solid var(--blue);
  border-radius:10px;
  background:#102b45;
  color:#fff;
  padding:10px;
  font-weight:800;
}
#app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:env(safe-area-inset-top) 8px env(safe-area-inset-bottom);
}
header{
  height:44px;
  flex-shrink:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.brand{
  color:var(--blue);
  font-size:23px;
  font-weight:900;
  letter-spacing:2px;
  text-shadow:0 0 12px #27b8ff77;
}
.version{
  color:var(--muted);
  font-size:10px;
  text-align:right;
}
#stage{
  position:relative;
  flex:1;
  min-height:0;
  border:1px solid #245477;
  border-radius:12px;
  overflow:hidden;
  background:#000;
}
#camera{display:none}
#view{
  display:block;
  width:100%;
  height:100%;
}
#statusBox{
  position:absolute;
  top:8px;
  left:8px;
  right:8px;
  display:flex;
  justify-content:space-between;
  pointer-events:none;
}
.pill{
  background:#04101de8;
  border:1px solid #285675;
  border-radius:8px;
  padding:7px 9px;
  font-size:10px;
  font-weight:800;
}
#dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  background:var(--red);
  margin-right:5px;
}
#bottomStatus{
  position:absolute;
  bottom:8px;
  left:8px;
  right:8px;
  padding:9px;
  text-align:center;
  background:#04101de8;
  border:1px solid #285675;
  border-radius:8px;
  font-size:11px;
  font-weight:800;
}
#controls{
  flex-shrink:0;
  padding:7px 0 3px;
}
#zoomRow{
  display:flex;
  gap:8px;
  align-items:center;
  margin-bottom:7px;
  font-size:11px;
  color:var(--muted);
}
#zoom{flex:1;accent-color:var(--blue)}
#zoomValue{color:#fff;min-width:40px}
#calibrate{
  width:100%;
  background:linear-gradient(90deg,#0874bd,#27b8ff);
  color:#00101d;
  border:0;
  margin-bottom:7px;
}
#scores{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:6px;
}
.scoreBox{
  padding:8px 4px;
  text-align:center;
  background:#0b1c2d;
  border:1px solid #244864;
  border-radius:10px;
}
.scoreBox small{
  display:block;
  color:var(--muted);
  font-size:9px;
  margin-bottom:4px;
}
.scoreBox strong{
  display:block;
  color:var(--blue);
  font-size:23px;
}
#darts{
  display:flex;
  justify-content:center;
  gap:7px;
  margin:6px 0;
}
.dartChip{
  border:1px solid #285675;
  border-radius:7px;
  padding:5px 9px;
  font-size:12px;
  min-width:55px;
  text-align:center;
  background:#0a1b2b;
}
.dartChip.active{
  border-color:var(--green);
  color:var(--green);
}
#actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
}
#actions button{
  font-size:11px;
  padding:8px 4px;
}
#correction{
  display:none;
  gap:6px;
  margin-top:7px;
}
#correction input{
  width:100%;
  min-width:0;
  background:#0b2034;
  color:#fff;
  border:1px solid var(--blue);
  border-radius:8px;
  padding:9px;
}
#debug{
  color:#7899b4;
  font-size:9px;
  text-align:center;
  padding-top:5px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
</style>
</head>
<body>

<div id="app">
<header>
  <div class="brand">DARTIQ</div>
  <div class="version">
    AUTO-SCORING<br>
    PROTOTYPE V16
  </div>
</header>

<div id="stage">
  <video id="camera" autoplay muted playsinline></video>
  <canvas id="view"></canvas>

  <div id="statusBox">
    <div class="pill">
      <span id="dot"></span>
      <span id="status">START CAMERA</span>
    </div>
    <div class="pill" id="counter">0 / 3</div>
  </div>

  <div id="bottomStatus">CAMERA NOT STARTED</div>
</div>

<div id="controls">
  <div id="zoomRow">
    <span>ZOOM</span>
    <input id="zoom" type="range"
      min="1" max="2.5" step=".05" value="1.3">
    <strong id="zoomValue">1.30×</strong>
  </div>

  <button id="calibrate">START CAMERA</button>

  <div id="scores">
    <div class="scoreBox">
      <small>LAST DART</small>
      <strong id="last">0</strong>
    </div>
    <div class="scoreBox">
      <small>VISIT TOTAL</small>
      <strong id="total">0</strong>
    </div>
    <div class="scoreBox">
      <small>DARTS</small>
      <strong id="count">0/3</strong>
    </div>
  </div>

  <div id="darts">
    <div class="dartChip" id="dart0">D1 · —</div>
    <div class="dartChip" id="dart1">D2 · —</div>
    <div class="dartChip" id="dart2">D3 · —</div>
  </div>

  <div id="actions">
    <button id="correct">CORRECT SCORE</button>
    <button id="restart">RESTART CAMERA</button>
  </div>

  <div id="correction">
    <input id="correctionInput" type="number"
      min="0" max="60"
      placeholder="Correct last dart score">
    <button id="saveCorrection">SAVE</button>
    <button id="cancelCorrection">✕</button>
  </div>

  <div id="debug">Waiting for camera</div>
</div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const video=$("camera");
const canvas=$("view");
const ctx=canvas.getContext("2d",{alpha:false});
const work=document.createElement("canvas");
const wc=work.getContext("2d",{willReadFrequently:true});

const W=420,H=560;
work.width=W;
work.height=H;

const SECTORS=[
  20,1,18,4,13,6,10,15,2,17,
  3,19,7,16,8,11,14,9,12,5
];

const CONFIG={
  calibrationFrames:12,
  calibrationTolerance:5,
  calibrationTimeout:15000,
  analysisInterval:240,
  differenceThreshold:46,
  candidateConfirmations:3,
  dartCooldown:850,
  removalConfirmations:12,
  removalThreshold:.018,
  alignmentThreshold:18
};

const params=new URLSearchParams(location.search);
const playerName=
  params.get("playername")||
  params.get("player")||
  "Player";

let stream=null;
let running=false;
let mode="idle";
let zoom=1.3;

let board=null;
let samples=[];
let calibrationStarted=0;
let lastCalibrationSample=0;
let calibrationTimer=null;

let emptyFrame=null;
let referenceFrame=null;
let previousFrame=null;

let darts=[];
let candidate=null;

let lastAnalysis=0;
let lastAccepted=0;
let removalCount=0;
let alignmentFailures=0;

let voiceReady=false;
let chosenVoice=null;

function setStatus(title,color,description){
  $("status").textContent=title;
  $("bottomStatus").textContent=description;

  $("dot").style.background=
    color==="green"?"#37f5a1":
    color==="yellow"?"#ffd166":
    color==="blue"?"#27b8ff":
    "#ff6578";
}

function debug(text){
  $("debug").textContent=text;
}

function updateHUD(){
  const total=darts.reduce((s,d)=>s+d.score,0);

  $("last").textContent=
    darts.length?darts[darts.length-1].score:0;

  $("total").textContent=total;
  $("count").textContent=darts.length+"/3";
  $("counter").textContent=darts.length+" / 3";

  for(let i=0;i<3;i++){
    const el=$("dart"+i);
    const dart=darts[i];

    el.textContent=dart
      ?`D${i+1} · ${dart.label}`
      :`D${i+1} · —`;

    el.classList.toggle("active",!!dart);
  }
}

function chooseVoice(){
  if(!("speechSynthesis" in window))return;

  const voices=speechSynthesis.getVoices();

  chosenVoice=
    voices.find(v=>
      /^en/i.test(v.lang)&&
      /male|david|daniel|george|guy|ryan/i
        .test(v.name)
    )||
    voices.find(v=>/^en/i.test(v.lang))||
    voices[0]||
    null;
}

function unlockVoice(){
  if(!("speechSynthesis" in window))return;

  chooseVoice();
  voiceReady=true;

  try{
    speechSynthesis.cancel();
    const warmup=new SpeechSynthesisUtterance(" ");
    warmup.volume=0;
    speechSynthesis.speak(warmup);
  }catch(e){}
}

function speak(text){
  if(!voiceReady||!("speechSynthesis" in window))return;

  speechSynthesis.cancel();

  const u=new SpeechSynthesisUtterance(text);
  u.lang="en-GB";
  u.rate=.92;
  u.pitch=.9;
  u.volume=1;

  if(chosenVoice)u.voice=chosenVoice;

  speechSynthesis.speak(u);
}

if("speechSynthesis" in window){
  speechSynthesis.onvoiceschanged=chooseVoice;
}

function stopCamera(){
  running=false;
  mode="idle";

  clearTimeout(calibrationTimer);
  calibrationTimer=null;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }

  stream=null;
  video.srcObject=null;
}

async function startCamera(){
  stopCamera();

  setStatus(
    "STARTING CAMERA","yellow",
    "Requesting rear camera"
  );

  try{
    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:{ideal:"environment"},
        width:{ideal:1280},
        height:{ideal:720},
        frameRate:{ideal:30}
      }
    });

    video.srcObject=stream;
    await video.play();

    running=true;
    mode="ready";

    board=null;
    darts=[];
    candidate=null;
    samples=[];

    $("zoom").disabled=false;
    $("calibrate").disabled=false;
    $("calibrate").textContent="START AUTO CALIBRATION";

    updateHUD();

    setStatus(
      "CAMERA READY","blue",
      "Adjust zoom before calibration"
    );

    requestAnimationFrame(renderLoop);
  }catch(err){
    $("calibrate").disabled=false;
    $("calibrate").textContent="START CAMERA";

    setStatus(
      "CAMERA ERROR","red",err.message
    );
  }
}

function drawCamera(){
  if(!video.videoWidth)return;

  const vw=video.videoWidth;
  const vh=video.videoHeight;
  const aspect=W/H;

  let sw,sh;

  if(vw/vh>aspect){
    sh=vh/zoom;
    sw=sh*aspect;
  }else{
    sw=vw/zoom;
    sh=sw/aspect;
  }

  wc.drawImage(
    video,
    (vw-sw)/2,(vh-sh)/2,sw,sh,
    0,0,W,H
  );
}

function capture(){
  drawCamera();
  return wc.getImageData(0,0,W,H);
}

function isRingColor(r,g,b){
  const red=
    r>75&&r>g*1.3&&r>b*1.25;

  const green=
    g>65&&g>r*1.2&&g>b*1.1;

  return red||green;
}

function quantile(values,q){
  if(!values.length)return 0;

  const sorted=[...values].sort((a,b)=>a-b);
  return sorted[Math.floor(q*(sorted.length-1))];
}

function estimateBoard(frame){
  const data=frame.data;
  const points=[];

  for(let y=15;y<H-15;y+=2){
    for(let x=15;x<W-15;x+=2){
      const p=(y*W+x)*4;

      if(isRingColor(
        data[p],data[p+1],data[p+2]
      )){
        points.push({x,y});
      }
    }
  }

  if(points.length<130)return null;

  const xs=points.map(p=>p.x);
  const ys=points.map(p=>p.y);

  const x1=quantile(xs,.015);
  const x2=quantile(xs,.985);
  const y1=quantile(ys,.015);
  const y2=quantile(ys,.985);

  const cx=(x1+x2)/2;
  const cy=(y1+y2)/2;

  let rx=(x2-x1)/2;
  let ry=(y2-y1)/2;

  if(rx<65||ry<75)return null;

  const radial=points.map(p=>
    Math.hypot(
      (p.x-cx)/rx,
      (p.y-cy)/ry
    )
  );

  const outer=quantile(radial,.92);

  if(outer<.65||outer>1.25)return null;

  rx*=outer;
  ry*=outer;

  return {
    cx,cy,rx,ry,
    confidence:Math.min(
      100,Math.round(points.length/18)
    )
  };
}

function median(values){
  return quantile(values,.5);
}

function combineBoards(list){
  return {
    cx:median(list.map(b=>b.cx)),
    cy:median(list.map(b=>b.cy)),
    rx:median(list.map(b=>b.rx)),
    ry:median(list.map(b=>b.ry)),
    confidence:median(list.map(b=>b.confidence))
  };
}

function boardDistance(a,b){
  if(!a||!b)return Infinity;

  return Math.max(
    Math.abs(a.cx-b.cx),
    Math.abs(a.cy-b.cy),
    Math.abs(a.rx-b.rx),
    Math.abs(a.ry-b.ry)
  );
}

function verifyCalibration(){
  if(samples.length<CONFIG.calibrationFrames){
    return false;
  }

  const proposed=combineBoards(samples);

  let stable=0;

  for(const sample of samples){
    if(
      boardDistance(sample,proposed)<
      CONFIG.calibrationTolerance
    ){
      stable++;
    }
  }

  if(stable<CONFIG.calibrationFrames-1){
    return false;
  }

  const frame=capture();
  const data=frame.data;

  function ringSupport(radius){
    let hits=0;
    let valid=0;

    for(let i=0;i<360;i+=3){
      const a=i*Math.PI/180;

      const x=Math.round(
        proposed.cx+
        Math.cos(a)*proposed.rx*radius
      );

      const y=Math.round(
        proposed.cy+
        Math.sin(a)*proposed.ry*radius
      );

      if(x<2||y<2||x>=W-2||y>=H-2){
        continue;
      }

      valid++;

      let found=false;

      for(let dy=-4;dy<=4&&!found;dy+=2){
        for(let dx=-4;dx<=4;dx+=2){
          const xx=x+dx;
          const yy=y+dy;

          if(xx<0||yy<0||xx>=W||yy>=H)continue;

          const p=(yy*W+xx)*4;

          if(isRingColor(
            data[p],data[p+1],data[p+2]
          )){
            found=true;
            break;
          }
        }
      }

      if(found)hits++;
    }

    return valid?hits/valid:0;
  }

  const outer=ringSupport(1);
  const triple=ringSupport(103/170);

  debug(
    "Outer "+
    Math.round(outer*100)+"% · Triple "+
    Math.round(triple*100)+"%"
  );

  if(outer<.40||triple<.35){
    return false;
  }

  board=proposed;
  return true;
}

function drawEllipse(radius,color,width=1){
  ctx.beginPath();
  ctx.ellipse(
    board.cx,board.cy,
    board.rx*radius,
    board.ry*radius,
    0,0,Math.PI*2
  );
  ctx.strokeStyle=color;
  ctx.lineWidth=width;
  ctx.stroke();
}

function drawCalibration(){
  if(!board)return;

  const color=
    mode==="verified"?"#37f5a1":"#ffd166";

  ctx.save();
  ctx.shadowColor=color;
  ctx.shadowBlur=4;

  drawEllipse(1,color,2);
  drawEllipse(162/170,color,1);
  drawEllipse(107/170,color,2);
  drawEllipse(99/170,color,1);
  drawEllipse(15.9/170,color,2);
  drawEllipse(6.35/170,color,2);

  for(let i=0;i<20;i++){
    const a=(i*18-99)*Math.PI/180;

    const ux=Math.cos(a);
    const uy=Math.sin(a);

    ctx.beginPath();
    ctx.moveTo(
      board.cx+ux*board.rx*.094,
      board.cy+uy*board.ry*.094
    );
    ctx.lineTo(
      board.cx+ux*board.rx,
      board.cy+uy*board.ry
    );
    ctx.strokeStyle=color;
    ctx.lineWidth=1;
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.arc(board.cx,board.cy,4,0,Math.PI*2);
  ctx.fillStyle=color;
  ctx.fill();

  ctx.restore();
}

function startCalibration(){
  if(!running)return;

  clearTimeout(calibrationTimer);
  calibrationTimer=null;

  mode="calibrating";
  samples=[];
  board=null;
  darts=[];
  candidate=null;

  calibrationStarted=performance.now();
  lastCalibrationSample=0;

  $("zoom").disabled=false;
  $("calibrate").disabled=false;
  $("calibrate").textContent="RESTART CALIBRATION";

  updateHUD();

  setStatus(
    "CALIBRATING","yellow",
    "Verifying board geometry"
  );
}

function calibrationStep(now){
  if(now-lastCalibrationSample<240)return;
  lastCalibrationSample=now;

  const detected=estimateBoard(capture());

  if(detected){
    samples.push(detected);

    if(samples.length>CONFIG.calibrationFrames){
      samples.shift();
    }

    board=combineBoards(samples);
  }

  if(samples.length>=CONFIG.calibrationFrames){
    if(verifyCalibration()){
      mode="verified";

      $("zoom").disabled=true;

      setStatus(
        "CALIBRATION VERIFIED","green",
        "Board alignment accepted"
      );

      clearTimeout(calibrationTimer);

      calibrationTimer=setTimeout(()=>{
        calibrationTimer=null;

        if(mode==="verified"){
          beginMonitoring();
        }
      },700);

      return;
    }
  }

  if(
    now-calibrationStarted>
    CONFIG.calibrationTimeout
  ){
    samples=[];
    calibrationStarted=now;

    $("calibrate").disabled=false;
    $("zoom").disabled=false;

    setStatus(
      "CALIBRATION RETRY","yellow",
      "Alignment not verified · Retrying automatically"
    );
  }
}

function beginMonitoring(){
  if(mode!=="verified"||!board)return;

  emptyFrame=capture();
  referenceFrame=emptyFrame;
  previousFrame=emptyFrame;

  darts=[];
  candidate=null;
  removalCount=0;
  alignmentFailures=0;

  lastAccepted=performance.now();

  mode="monitoring";

  $("zoom").disabled=true;
  $("calibrate").disabled=false;
  $("calibrate").textContent="RECALIBRATE";

  updateHUD();

  setStatus(
    "LIVE MONITORING","green",
    "Calibration verified · Ready for dart 1"
  );
}

function insideBoard(x,y,radius=1.06){
  if(!board)return false;

  const dx=(x-board.cx)/(board.rx*radius);
  const dy=(y-board.cy)/(board.ry*radius);

  return dx*dx+dy*dy<=1;
}

function difference(a,b,p){
  const x=a.data;
  const y=b.data;

  return Math.max(
    Math.abs(x[p]-y[p]),
    Math.abs(x[p+1]-y[p+1]),
    Math.abs(x[p+2]-y[p+2])
  );
}

function compare(a,b,threshold=CONFIG.differenceThreshold){
  const mask=new Uint8Array(W*H);

  let changed=0;
  let tested=0;

  for(let y=8;y<H-8;y++){
    for(let x=8;x<W-8;x++){
      if(!insideBoard(x,y))continue;

      const p=(y*W+x)*4;
      tested++;

      if(difference(a,b,p)>threshold){
        mask[y*W+x]=1;
        changed++;
      }
    }
  }

  return {
    mask,
    ratio:tested?changed/tested:0
  };
}

function components(mask){
  const visited=new Uint8Array(W*H);
  const output=[];
  const stack=[];

  for(let y=12;y<H-12;y+=2){
    for(let x=12;x<W-12;x+=2){
      const start=y*W+x;

      if(!mask[start]||visited[start])continue;

      stack.length=0;
      stack.push(start);
      visited[start]=1;

      const points=[];

      while(stack.length){
        const p=stack.pop();
        const px=p%W;
        const py=(p/W)|0;

        points.push({x:px,y:py});

        for(let dy=-1;dy<=1;dy++){
          for(let dx=-1;dx<=1;dx++){
            const nx=px+dx;
            const ny=py+dy;

            if(nx<0||ny<0||nx>=W||ny>=H)continue;

            const np=ny*W+nx;

            if(mask[np]&&!visited[np]){
              visited[np]=1;
              stack.push(np);
            }
          }
        }
      }

      if(points.length>=15){
        output.push(points);
      }
    }
  }

  return output.sort((a,b)=>b.length-a.length);
}

function detectCandidate(diff){
  const groups=components(diff.mask);
  const possible=[];

  for(const points of groups.slice(0,20)){
    let mx=0,my=0;

    for(const p of points){
      mx+=p.x;
      my+=p.y;
    }

    mx/=points.length;
    my/=points.length;

    let xx=0,xy=0,yy=0;

    for(const p of points){
      const dx=p.x-mx;
      const dy=p.y-my;

      xx+=dx*dx;
      xy+=dx*dy;
      yy+=dy*dy;
    }

    const angle=.5*Math.atan2(
      2*xy,xx-yy
    );

    const ux=Math.cos(angle);
    const uy=Math.sin(angle);

    let min=Infinity,max=-Infinity;

    for(const p of points){
      const projection=
        (p.x-mx)*ux+
        (p.y-my)*uy;

      min=Math.min(min,projection);
      max=Math.max(max,projection);
    }

    const length=max-min;
    if(length<15)continue;

    const a={
      x:mx+ux*min,
      y:my+uy*min
    };

    const b={
      x:mx+ux*max,
      y:my+uy*max
    };

    const radius=p=>Math.hypot(
      (p.x-board.cx)/board.rx,
      (p.y-board.cy)/board.ry
    );

    const tip=radius(a)<radius(b)?a:b;

    if(!insideBoard(tip.x,tip.y,1.01)){
      continue;
    }

    if(darts.some(d=>
      Math.hypot(d.x-tip.x,d.y-tip.y)<9
    )){
      continue;
    }

    possible.push({
      ...tip,
      confidence:length,
      length
    });
  }

  possible.sort(
    (a,b)=>b.confidence-a.confidence
  );

  return possible[0]||null;
}

function scoreAt(x,y){
  const nx=(x-board.cx)/board.rx;
  const ny=(y-board.cy)/board.ry;

  const r=Math.hypot(nx,ny);

  if(r>1.025)return {score:0,label:"MISS"};
  if(r<=6.35/170)return {score:50,label:"BULL"};
  if(r<=15.9/170)return {score:25,label:"25"};

  const angle=(
    Math.atan2(ny,nx)*180/Math.PI+
    90+360
  )%360;

  const index=Math.floor((angle+9)/18)%20;
  const value=SECTORS[index];

  if(r>=162/170){
    return {score:value*2,label:"D"+value};
  }

  if(r>=99/170&&r<=107/170){
    return {score:value*3,label:"T"+value};
  }

  return {score:value,label:"S"+value};
}

function acceptDart(point,frame,now){
  if(mode!=="monitoring"||darts.length>=3)return;

  const result=scoreAt(point.x,point.y);

  darts.push({...point,...result});

  referenceFrame=frame;
  previousFrame=frame;

  candidate=null;
  lastAccepted=now;
  removalCount=0;

  updateHUD();

  setStatus(
    "DART REGISTERED","green",
    `Dart ${darts.length}: ${result.label}`
  );

  if(darts.length===3){
    const total=darts.reduce((s,d)=>s+d.score,0);

    setStatus(
      "VISIT COMPLETE","green",
      "Remove all three darts"
    );

    speak(`${playerName}, ${total} scored.`);
  }
}

function resetVisit(frame){
  darts=[];
  candidate=null;

  emptyFrame=frame;
  referenceFrame=frame;
  previousFrame=frame;

  removalCount=0;
  lastAccepted=performance.now();

  updateHUD();

  setStatus(
    "NEW VISIT","green",
    "Darts removed · Ready for dart 1"
  );
}

function checkRemoval(frame,now){
  if(!darts.length||now-lastAccepted<1700){
    return false;
  }

  const empty=compare(frame,emptyFrame,48);

  if(empty.ratio<CONFIG.removalThreshold){
    removalCount++;
  }else{
    removalCount=0;
  }

  if(removalCount>=CONFIG.removalConfirmations){
    resetVisit(frame);
    return true;
  }

  return false;
}

function verifyAlignment(frame){
  const detected=estimateBoard(frame);

  if(!detected)return false;

  return boardDistance(detected,board)<
    CONFIG.alignmentThreshold;
}

function monitor(now){
  if(mode!=="monitoring")return;

  const frame=capture();

  if(!previousFrame){
    previousFrame=frame;
    return;
  }

  if(!verifyAlignment(frame)){
    alignmentFailures++;
  }else{
    alignmentFailures=0;
  }

  if(alignmentFailures>=5){
    mode="calibrating";
    samples=[];
    candidate=null;
    board=null;

    calibrationStarted=now;
    lastCalibrationSample=0;

    $("calibrate").disabled=false;
    $("calibrate").textContent="RESTART CALIBRATION";
    $("zoom").disabled=false;

    setStatus(
      "ALIGNMENT LOST","yellow",
      "Scoring suspended · Recalibrating"
    );

    return;
  }

  if(checkRemoval(frame,now)){
    return;
  }

  if(darts.length===3){
    previousFrame=frame;
    return;
  }

  if(now-lastAccepted<CONFIG.dartCooldown){
    previousFrame=frame;
    return;
  }

  const diff=compare(frame,referenceFrame);

  if(diff.ratio<.0015){
    candidate=null;
    previousFrame=frame;
    return;
  }

  const detected=detectCandidate(diff);

  if(detected){
    if(
      candidate&&
      Math.hypot(
        candidate.x-detected.x,
        candidate.y-detected.y
      )<20
    ){
      candidate.confirmations++;
      candidate.x=.6*candidate.x+.4*detected.x;
      candidate.y=.6*candidate.y+.4*detected.y;
    }else{
      candidate={
        ...detected,
        confirmations:1
      };
    }

    if(candidate.confirmations>=
      CONFIG.candidateConfirmations
    ){
      acceptDart(candidate,frame,now);
      return;
    }

    setStatus(
      "DART CANDIDATE","blue",
      "Confirming impact "+
      candidate.confirmations+"/"+
      CONFIG.candidateConfirmations
    );
  }else{
    candidate=null;
  }

  previousFrame=frame;

  debug(
    "Frame change "+
    diff.ratio.toFixed(4)+
    " · Calibration verified"
  );
}

function drawAccepted(){
  ctx.save();

  for(const d of darts){
    ctx.beginPath();
    ctx.arc(d.x,d.y,8,0,Math.PI*2);
    ctx.strokeStyle="#37f5a1";
    ctx.lineWidth=2;
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(d.x-12,d.y);
    ctx.lineTo(d.x+12,d.y);
    ctx.moveTo(d.x,d.y-12);
    ctx.lineTo(d.x,d.y+12);
    ctx.stroke();

    ctx.fillStyle="#37f5a1";
    ctx.font="bold 14px Arial";
    ctx.fillText(d.label,d.x+12,d.y-10);
  }

  ctx.restore();
}

function renderLoop(now){
  if(!running)return;

  drawCamera();

  const cw=$("stage").clientWidth;
  const ch=$("stage").clientHeight;

  if(canvas.width!==cw||canvas.height!==ch){
    canvas.width=cw;
    canvas.height=ch;
  }

  ctx.drawImage(work,0,0,cw,ch);

  ctx.save();
  ctx.scale(cw/W,ch/H);

  if(
    board&&
    (mode==="calibrating"||mode==="verified")
  ){
    drawCalibration();
  }

  if(mode==="monitoring"){
    drawAccepted();
  }

  ctx.restore();

  if(mode==="calibrating"){
    calibrationStep(now);
  }else if(
    mode==="monitoring"&&
    now-lastAnalysis>=CONFIG.analysisInterval
  ){
    lastAnalysis=now;
    monitor(now);
  }

  requestAnimationFrame(renderLoop);
}

/* ZOOM AND CALIBRATION CONTROL FIX */

$("zoom").addEventListener("input",e=>{
  if(!running)return;

  if(mode==="monitoring"||mode==="verified"){
    return;
  }

  clearTimeout(calibrationTimer);
  calibrationTimer=null;

  zoom=Number(e.target.value);

  $("zoomValue").textContent=
    zoom.toFixed(2)+"×";

  board=null;
  samples=[];
  candidate=null;

  calibrationStarted=0;
  lastCalibrationSample=0;

  mode="ready";

  $("zoom").disabled=false;
  $("calibrate").disabled=false;

  $("calibrate").textContent=
    "START AUTO CALIBRATION";

  setStatus(
    "ZOOM ADJUSTED",
    "blue",
    "Tap START AUTO CALIBRATION"
  );
});

$("calibrate").addEventListener("click",async()=>{
  unlockVoice();

  if(!running){
    await startCamera();
    return;
  }

  $("calibrate").disabled=false;

  startCalibration();
});

$("restart").addEventListener("click",async()=>{
  unlockVoice();
  await startCamera();
});

$("correct").addEventListener("click",()=>{
  if(!darts.length)return;

  $("correction").style.display="flex";
  $("correctionInput").value=
    darts[darts.length-1].score;
});

$("saveCorrection").addEventListener("click",()=>{
  if(!darts.length)return;

  const value=Number($("correctionInput").value);

  if(
    !Number.isInteger(value)||
    value<0||value>60
  )return;

  const d=darts[darts.length-1];
  d.score=value;
  d.label=String(value);

  $("correction").style.display="none";

  updateHUD();

  if(darts.length===3){
    const total=darts.reduce((s,d)=>s+d.score,0);
    speak(`${playerName}, corrected total ${total}.`);
  }
});

$("cancelCorrection").addEventListener("click",()=>{
  $("correction").style.display="none";
});

document.addEventListener("visibilitychange",()=>{
  if(document.hidden){
    candidate=null;
  }else if(mode==="monitoring"){
    previousFrame=capture();
  }
});

window.addEventListener("beforeunload",stopCamera);

updateHUD();

setStatus(
  "READY","blue",
  "Tap START CAMERA"
);

debug("DARTIQ V16 · Calibration verification enabled");

</script>
