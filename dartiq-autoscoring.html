<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050b16">
<title>DARTIQ | Auto-Scoring V13</title>
<style>
:root{
 --bg:#050b16;
 --blue:#27b8ff;
 --green:#19e79a;
 --muted:#b0c3d8;
}
*{box-sizing:border-box}
html,body{
 margin:0;width:100%;height:100%;
 overflow:hidden;background:#000;color:white;
 font-family:Arial,sans-serif;
}
button,input{font:inherit}
.app{
 position:relative;width:100%;
 max-width:800px;height:100dvh;
 margin:auto;overflow:hidden;background:#000;
}
#video{display:none}
#view,#overlay{
 position:absolute;inset:0;
 width:100%;height:100%;
 object-fit:contain;
}
#overlay{pointer-events:none}
.top{
 position:absolute;z-index:3;
 top:0;left:0;right:0;
 padding:9px 12px 20px;text-align:center;
 background:linear-gradient(#020916f5,#02091690,transparent);
}
.logo{
 margin:0;color:var(--blue);
 font-size:27px;letter-spacing:4px;
 text-shadow:0 0 14px #27b8ff99;
}
.sub{
 font-size:10px;letter-spacing:1px;
 color:var(--muted);margin-top:3px;
}
.info{
 display:flex;justify-content:space-between;
 margin-top:9px;font-size:10px;color:var(--muted);
}
.bottom{
 position:absolute;z-index:4;
 bottom:0;left:0;right:0;
 display:flex;flex-direction:column;gap:6px;
 padding:12px 10px max(12px,env(safe-area-inset-bottom));
 background:linear-gradient(transparent,#020916ed 13%,#020916 45%);
}
.status{
 text-align:center;color:var(--blue);
 font-size:12px;font-weight:800;
 min-height:17px;
}
.live{
 display:flex;align-items:center;
 justify-content:center;gap:7px;
 font-size:11px;color:var(--muted);
}
.dot{
 width:9px;height:9px;border-radius:50%;
 background:#64748b;
}
.dot.on{background:var(--green);box-shadow:0 0 12px var(--green)}
.dot.wait{background:#ffd447}
.dot.err{background:#ff5268}
button{
 min-height:40px;border-radius:9px;
 border:1px solid #27b8ff77;
 background:var(--blue);color:#00121e;
 padding:8px 6px;font-size:11px;font-weight:800;
}
button:disabled{opacity:.45}
.secondary{background:#18334d;color:white}
.zoom{
 padding:9px 12px;border-radius:10px;
 border:1px solid #27b8ff88;
 background:#031020ed;
}
.zoom-title{
 display:flex;justify-content:space-between;
 font-size:12px;font-weight:800;
}
.zoom-title span:last-child{color:var(--blue)}
.zoom-row{
 display:flex;align-items:center;gap:8px;
 margin-top:7px;
}
.zoom-row button{
 flex:0 0 35px;min-height:34px;
 font-size:21px;padding:0;
}
input[type=range]{flex:1;min-width:0;accent-color:var(--blue)}
.metrics{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:6px;
}
.metric{
 text-align:center;padding:8px 3px;
 background:#031020ed;
 border:1px solid #27b8ff55;
 border-radius:9px;
}
.metric small{
 display:block;color:var(--muted);font-size:9px;
}
.metric strong{
 display:block;margin-top:3px;
 color:var(--blue);font-size:26px;
}
.row{
 display:grid;grid-template-columns:1fr 1fr;gap:6px;
}
.note{
 text-align:center;font-size:10px;
 color:var(--muted);
}
.hidden{display:none!important}
.correction{
 background:#031020f5;
 border:1px solid var(--blue);
 border-radius:10px;padding:10px;
}
.correction input{
 width:100%;background:#061527;
 border:1px solid #27b8ff77;
 border-radius:8px;color:white;
 padding:9px;font-size:16px;
}
@media(max-height:700px){
 .bottom{gap:4px;padding-top:5px}
 button{min-height:32px}
 .metric{padding:5px 2px}
 .metric strong{font-size:20px}
 .zoom{padding:6px 9px}
}
</style>
</head>
<body>

<div class="app" id="app">
 <video id="video" autoplay muted playsinline></video>
 <canvas id="view"></canvas>
 <canvas id="overlay"></canvas>

 <div class="top">
  <h1 class="logo">DARTIQ</h1>
  <div class="sub">AUTO-SCORING V13 | VOICE VISION</div>
  <div class="info">
   <span id="cameraInfo">Connecting camera...</span>
   <span id="resolution">---</span>
  </div>
 </div>

 <div class="bottom">
  <div class="status" id="status">WAITING FOR CAMERA</div>
  <div class="live">
   <span class="dot" id="dot"></span>
   <span id="liveText">SYSTEM IDLE</span>
  </div>

  <div class="zoom" id="zoomPanel">
   <div class="zoom-title">
    <span>CAMERA ZOOM</span>
    <span id="zoomText">1.0×</span>
   </div>
   <div class="zoom-row">
    <button id="minus">−</button>
    <input id="zoomSlider" type="range"
      min="1" max="3" step=".1" value="1">
    <button id="plus">+</button>
   </div>
  </div>

  <button id="calibrate" disabled>
   START AUTOMATIC CALIBRATION
  </button>

  <div class="metrics">
   <div class="metric">
    <small>LAST DART</small>
    <strong id="last">---</strong>
   </div>
   <div class="metric">
    <small>VISIT TOTAL</small>
    <strong id="total">0</strong>
   </div>
   <div class="metric">
    <small>DARTS</small>
    <strong id="count">0/3</strong>
   </div>
  </div>

  <div class="note" id="details">
   Adjust zoom before calibration
  </div>

  <div class="correction hidden" id="correction">
   <input id="correctValue" type="number"
     min="0" max="60" placeholder="Correct dart score">
   <div class="row" style="margin-top:8px">
    <button id="save">SAVE CORRECTION</button>
    <button id="cancel" class="secondary">CANCEL</button>
   </div>
  </div>

  <div class="row">
   <button id="correct" class="secondary" disabled>
    CORRECT SCORE
   </button>
   <button id="restart" class="secondary">
    RESTART CAMERA
   </button>
  </div>

  <div class="note" id="message">
   Remove darts before calibration
  </div>
 </div>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const video=$("video");
const app=$("app");
const canvas=$("view");
const ctx=canvas.getContext("2d",{willReadFrequently:true});
const overlay=$("overlay");
const oc=overlay.getContext("2d");

const SECTORS=[
 20,1,18,4,13,6,10,15,2,17,
 3,19,7,16,8,11,14,9,12,5
];

const C={
 interval:300,
 changeThreshold:38,
 minChanged:7,
 candidateFrames:3,
 tipTolerance:12,
 emptyThreshold:.028,
 emptyFrames:6,
 settleFrames:3
};

let W=270,H=480;
let stream=null;
let cameraToken=0;
let loopToken=0;
let timer=null;
let zoom=1;
let locked=false;
let board=null;
let calibrated=false;
let calibrating=false;
let monitoring=false;

let emptyFrame=null;
let referenceFrame=null;
let previousFrame=null;
let candidate=null;
let candidateFrames=0;
let stableFrames=0;
let emptyFrames=0;
let visit=[];
let lastMarker=null;
let markerExpiry=0;
let baselineRefresh=0;

let voices=[];
let selectedVoice=null;
let voiceEnabled=false;

const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function status(s){$("status").textContent=s}
function message(s){$("message").textContent=s}
function live(mode,s){
 $("dot").className="dot"+(mode?" "+mode:"");
 $("liveText").textContent=s;
}

function initVoices(){
 if(!("speechSynthesis" in window))return;
 voices=speechSynthesis.getVoices();
 selectedVoice=
  voices.find(v=>
   /^en/i.test(v.lang)&&
   /male|david|mark|daniel|george|guy/i.test(v.name)
  )||
  voices.find(v=>/^en/i.test(v.lang))||
  null;
}
if("speechSynthesis" in window){
 initVoices();
 speechSynthesis.onvoiceschanged=initVoices;
}

function speak(text){
 if(!voiceEnabled||!("speechSynthesis" in window))return;
 try{
  speechSynthesis.cancel();
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang="en-US";
  utterance.rate=.95;
  utterance.pitch=.85;
  utterance.volume=1;
  if(selectedVoice)utterance.voice=selectedVoice;
  speechSynthesis.speak(utterance);
 }catch(e){}
}

function ready(){
 return stream&&video.readyState>=2&&
  video.videoWidth>0&&video.videoHeight>0;
}

function setZoom(v){
 if(locked||calibrating)return;
 zoom=Math.round(Math.max(1,Math.min(3,+v))*10)/10;
 $("zoomSlider").value=zoom;
 $("zoomText").textContent=zoom.toFixed(1)+"×";
}
$("zoomSlider").oninput=e=>setZoom(e.target.value);
$("minus").onclick=()=>setZoom(zoom-.1);
$("plus").onclick=()=>setZoom(zoom+.1);

function resize(){
 const dpr=devicePixelRatio||1;
 overlay.width=Math.round(app.clientWidth*dpr);
 overlay.height=Math.round(app.clientHeight*dpr);
 oc.setTransform(dpr,0,0,dpr,0,0);
 drawOverlay();
}

function rect(){
 const s=Math.min(app.clientWidth/W,app.clientHeight/H);
 return {
  x:(app.clientWidth-W*s)/2,
  y:(app.clientHeight-H*s)/2,
  s
 };
}
function screenPoint(x,y){
 const r=rect();
 return {x:r.x+x*r.s,y:r.y+y*r.s};
}

function render(){
 if(!ready())return;
 const vw=video.videoWidth,vh=video.videoHeight;
 const sw=vw/zoom,sh=vh/zoom;
 ctx.drawImage(
  video,(vw-sw)/2,(vh-sh)/2,sw,sh,
  0,0,W,H
 );
}
function capture(){
 render();
 return ctx.getImageData(0,0,W,H);
}
function previewLoop(){
 if(ready())render();
 requestAnimationFrame(previewLoop);
}

function drawOverlay(){
 oc.clearRect(0,0,app.clientWidth,app.clientHeight);
 if(!board)return;

 if(!calibrated){
  const p=screenPoint(board.x,board.y);
  const s=rect().s;
  for(const radius of [1,162/170,107/170,99/170]){
   oc.beginPath();
   oc.ellipse(
    p.x,p.y,
    board.rx*radius*s,
    board.ry*radius*s,
    0,0,Math.PI*2
   );
   oc.strokeStyle="#27b8ff";
   oc.lineWidth=1.5;
   oc.stroke();
  }
 }

 if(lastMarker&&Date.now()<markerExpiry){
  const p=screenPoint(lastMarker.x,lastMarker.y);
  oc.beginPath();
  oc.arc(p.x,p.y,11,0,Math.PI*2);
  oc.strokeStyle="#19e79a";
  oc.lineWidth=3;
  oc.stroke();
 }
}

function diff(a,b,i){
 return (
  Math.abs(a.data[i]-b.data[i])+
  Math.abs(a.data[i+1]-b.data[i+1])+
  Math.abs(a.data[i+2]-b.data[i+2])
 )/3;
}

function frameDifference(a,b,step=6,threshold=38){
 let changed=0,count=0;
 for(let y=0;y<H;y+=step){
  for(let x=0;x<W;x+=step){
   count++;
   if(diff(a,b,(y*W+x)*4)>threshold)changed++;
  }
 }
 return changed/Math.max(1,count);
}

function color(r,g,b){
 if(r>65&&r>g*1.3&&r>b*1.25)return 1;
 if(g>45&&g>r*1.15&&g>b*1.12)return 2;
 return 0;
}

function colorMask(frame){
 const mask=new Uint8Array(W*H);
 for(let i=0;i<W*H;i++){
  const j=i*4;
  mask[i]=color(
   frame.data[j],
   frame.data[j+1],
   frame.data[j+2]
  );
 }
 return mask;
}

function ringScore(mask,x,y,rx,ry){
 let hits=0,valid=0;
 for(let i=0;i<64;i++){
  const a=i*Math.PI/32;
  const px=Math.round(x+Math.cos(a)*rx);
  const py=Math.round(y+Math.sin(a)*ry);
  if(px<0||py<0||px>=W||py>=H)continue;
  valid++;
  if(mask[py*W+px])hits++;
 }
 return valid?hits/valid:0;
}

function detectBoard(frame){
 const mask=colorMask(frame);
 const min=Math.min(W,H);
 let best=null;

 function search(cx,cy,spanX,spanY,rMin,rMax,step,radStep,ratios){
  for(let y=cy-spanY;y<=cy+spanY;y+=step){
   for(let x=cx-spanX;x<=cx+spanX;x+=step){
    for(let rx=rMin;rx<=rMax;rx+=radStep){
     for(const ratio of ratios){
      const ry=rx*ratio;
      if(x-rx<1||x+rx>=W||y-ry<1||y+ry>=H)continue;

      const outer=ringScore(mask,x,y,rx*.965,ry*.965);
      const triple=ringScore(
       mask,x,y,rx*103/170,ry*103/170
      );
      const bull=ringScore(
       mask,x,y,rx*15.9/170,ry*15.9/170
      );
      const quality=outer*.45+triple*.4+bull*.15;

      if(!best||quality>best.quality){
       best={x,y,rx,ry,outer,triple,quality};
      }
     }
    }
   }
  }
 }

 search(
  W/2,H/2,W*.18,H*.18,
  min*.24,min*.49,
  8,6,[.75,.9,1,1.1,1.25]
 );

 if(best){
  const b=best;
  const ratio=b.ry/b.rx;
  search(
   b.x,b.y,9,9,
   Math.max(10,b.rx-8),b.rx+8,
   3,3,[ratio-.07,ratio,ratio+.07]
  );
 }

 if(!best||best.quality<.35||
    best.outer<.35||best.triple<.30){
  return null;
 }

 return {
  x:best.x,y:best.y,
  rx:best.rx,ry:best.ry,
  rotation:0
 };
}

function normalized(x,y){
 return {
  x:(x-board.x)/board.rx,
  y:(y-board.y)/board.ry
 };
}
function onBoard(x,y,limit=1.12){
 if(!board)return false;
 const p=normalized(x,y);
 return Math.hypot(p.x,p.y)<=limit;
}

function scoreAt(x,y){
 const p=normalized(x,y);
 const r=Math.hypot(p.x,p.y);

 if(r>1)return {score:0,label:"Miss",x,y};
 if(r<=6.35/170)return {score:50,label:"Bull",x,y};
 if(r<=15.9/170)return {score:25,label:"Outer bull",x,y};

 const angle=(
  Math.atan2(p.y,p.x)*180/Math.PI+
  90-board.rotation+360
 )%360;

 const number=SECTORS[Math.floor((angle+9)/18)%20];

 let mult=1;
 let name="Single";

 if(r>=99/170&&r<=107/170){
  mult=3;name="Triple";
 }else if(r>=162/170&&r<=1){
  mult=2;name="Double";
 }

 return {
  score:number*mult,
  label:name+" "+number,
  x,y
 };
}

/*
 Detect new image regions.

 V13 deliberately separates the new object
 from the already accepted board image.
*/

function changedPoints(base,current){
 const points=[];

 for(let y=2;y<H-2;y+=2){
  for(let x=2;x<W-2;x+=2){
   if(!onBoard(x,y,1.18))continue;
   const i=(y*W+x)*4;
   const d=diff(base,current,i);
   if(d>C.changeThreshold){
    points.push({x,y,d});
   }
  }
 }

 return points;
}

function components(points){
 const cell=7;
 const cells=new Map();

 for(const p of points){
  const cx=Math.floor(p.x/cell);
  const cy=Math.floor(p.y/cell);
  const key=cx+","+cy;
  if(!cells.has(key)){
   cells.set(key,{cx,cy,points:[],seen:false});
  }
  cells.get(key).points.push(p);
 }

 const groups=[];

 for(const start of cells.values()){
  if(start.seen)continue;
  start.seen=true;
  const queue=[start],group=[];

  for(let i=0;i<queue.length;i++){
   const c=queue[i];
   group.push(...c.points);

   for(let dy=-1;dy<=1;dy++){
    for(let dx=-1;dx<=1;dx++){
     const n=cells.get(
      (c.cx+dx)+","+(c.cy+dy)
     );
     if(n&&!n.seen){
      n.seen=true;
      queue.push(n);
     }
    }
   }
  }

  if(group.length>=C.minChanged){
   groups.push(group);
  }
 }

 return groups.sort((a,b)=>b.length-a.length);
}

/*
 Shaft endpoint estimation.

 This uses the major axis of a newly visible
 dart silhouette and evaluates the endpoints.

 Green flights alone are not accepted as
 scoring points.
*/

function tipFromGroup(group){
 if(group.length<8)return null;

 let mx=0,my=0;
 for(const p of group){mx+=p.x;my+=p.y}
 mx/=group.length;
 my/=group.length;

 let xx=0,xy=0,yy=0;
 for(const p of group){
  const dx=p.x-mx,dy=p.y-my;
  xx+=dx*dx;
  xy+=dx*dy;
  yy+=dy*dy;
 }

 const angle=.5*Math.atan2(2*xy,xx-yy);
 const ux=Math.cos(angle),uy=Math.sin(angle);

 let min=Infinity,max=-Infinity;
 let a=null,b=null;

 for(const p of group){
  const t=(p.x-mx)*ux+(p.y-my)*uy;
  if(t<min){min=t;a=p}
  if(t>max){max=t;b=p}
 }

 const length=max-min;
 const trace=(xx+yy)/group.length;
 const disc=Math.sqrt(
  Math.pow((xx-yy)/group.length,2)+
  4*Math.pow(xy/group.length,2)
 );
 const minor=Math.max(0,(trace-disc)/2);
 const width=Math.max(1,Math.sqrt(minor)*2);
 const elongation=length/width;

 if(length<10||elongation<1.7)return null;

 const da=Math.hypot(
  (a.x-board.x)/board.rx,
  (a.y-board.y)/board.ry
 );
 const db=Math.hypot(
  (b.x-board.x)/board.rx,
  (b.y-board.y)/board.ry
 );

 const tip=da<db?a:b;

 if(!onBoard(tip.x,tip.y,1.02))return null;

 return {
  x:tip.x,y:tip.y,
  length,elongation
 };
}

function findDart(base,current){
 const points=changedPoints(base,current);
 if(points.length<C.minChanged||points.length>5000){
  return null;
 }

 const groups=components(points);
 const candidates=[];

 for(const group of groups.slice(0,6)){
  const tip=tipFromGroup(group);
  if(!tip)continue;

  const duplicate=visit.some(d=>
   Math.hypot(d.x-tip.x,d.y-tip.y)<4
  );
  if(duplicate)continue;

  candidates.push({
   ...tip,
   quality:Math.min(1,tip.elongation/5)
  });
 }

 if(!candidates.length)return null;

 candidates.sort((a,b)=>b.quality-a.quality);
 return candidates[0];
}

function updateScores(){
 const total=visit.reduce((s,d)=>s+d.score,0);
 $("last").textContent=
  visit.length?visit[visit.length-1].score:"---";
 $("total").textContent=total;
 $("count").textContent=visit.length+"/3";
 $("correct").disabled=!visit.length;
}

function resetVisit(frame){
 visit=[];
 candidate=null;
 candidateFrames=0;
 stableFrames=0;
 emptyFrames=0;
 lastMarker=null;

 if(frame){
  referenceFrame=frame;
  previousFrame=frame;
 }

 updateScores();
 drawOverlay();
 status("NEW VISIT READY");
 live("on","AUTOMATIC MONITORING");
 message("Throw your first dart");
}

function registerDart(tip,frame){
 if(visit.length>=3)return;

 const result=scoreAt(tip.x,tip.y);
 visit.push(result);

 /*
  Update the baseline only after a dart
  has been registered. Previously accepted
  scores remain in the visit array.
 */

 referenceFrame=frame;
 candidate=null;
 candidateFrames=0;
 stableFrames=0;

 lastMarker=result;
 markerExpiry=Date.now()+1700;
 drawOverlay();

 updateScores();

 status("DART SCORED: "+result.label);
 live("on","SCORE REGISTERED");

 speak(result.label);

 message(
  visit.length===3
   ?"Remove all darts for the next visit"
   :"Throw your next dart"
 );

 setTimeout(()=>{
  if(Date.now()>=markerExpiry){
   lastMarker=null;
   drawOverlay();
  }
 },1800);
}

function stopMonitoring(){
 monitoring=false;
 loopToken++;
 if(timer!==null){
  clearTimeout(timer);
  timer=null;
 }
}

function startMonitoring(){
 if(!calibrated||!ready())return;

 stopMonitoring();
 monitoring=true;
 const token=loopToken;

 function next(){
  if(!monitoring||token!==loopToken)return;
  timer=setTimeout(()=>tick(token),C.interval);
 }

 function tick(id){
  if(!monitoring||id!==loopToken)return;

  try{
   const frame=capture();

   if(!previousFrame){
    previousFrame=frame;
    next();
    return;
   }

   const movement=frameDifference(previousFrame,frame);
   previousFrame=frame;

   if(movement>.24){
    stableFrames=0;
    candidateFrames=0;
    candidate=null;
    status("CAMERA SETTLING");
    live("wait","WAITING FOR STABILITY");
    next();
    return;
   }

   stableFrames++;

   if(stableFrames<C.settleFrames){
    next();
    return;
   }

   /*
    Dart removal is checked independently
    of whether three darts were registered.
   */

   if(visit.length>0){
    const emptyDiff=frameDifference(
     emptyFrame,frame,4,45
    );

    emptyFrames=
     emptyDiff<C.emptyThreshold
      ?emptyFrames+1:0;

    if(emptyFrames>=C.emptyFrames){
     resetVisit(frame);
     speak("Next visit");
     next();
     return;
    }
   }

   if(visit.length>=3){
    status("WAITING FOR DART REMOVAL");
    live("wait","REMOVE DARTS");
    next();
    return;
   }

   if(!referenceFrame){
    referenceFrame=frame;
   }

   const tip=findDart(referenceFrame,frame);

   if(!tip){
    candidate=null;
    candidateFrames=0;
    status("LIVE MONITORING");
    live("on","DART VISION ACTIVE");
    next();
    return;
   }

   if(candidate){
    const distance=Math.hypot(
     tip.x-candidate.x,
     tip.y-candidate.y
    );

    candidateFrames=
     distance<C.tipTolerance
      ?candidateFrames+1:1;
   }else{
    candidateFrames=1;
   }

   candidate=tip;

   if(candidateFrames>=C.candidateFrames){
    registerDart(tip,frame);
   }else{
    status("VERIFYING DART");
    live("wait","DART CANDIDATE");
   }

  }catch(e){
   status("MONITORING ERROR");
   live("err","VISION ERROR");
   message(e.message);
  }

  next();
 }

 next();
}

async function calibrate(){
 if(calibrating||!ready())return;

 stopMonitoring();
 calibrating=true;
 $("calibrate").disabled=true;

 /*
  The user gesture also enables browser
  speech synthesis where supported.
 */

 voiceEnabled=true;
 initVoices();

 try{
  if("speechSynthesis" in window){
   speechSynthesis.cancel();
   speechSynthesis.resume();
  }
 }catch(e){}

 const token=cameraToken;

 try{
  live("wait","CALIBRATING");

  for(let n=3;n>=1;n--){
   status("CALIBRATION STARTS IN "+n);
   await sleep(1000);
   if(token!==cameraToken)return;
  }

  let previous=null,stable=0;
  let frame=null;

  for(let i=0;i<35;i++){
   await sleep(300);
   if(token!==cameraToken)return;

   frame=capture();

   if(previous){
    const d=frameDifference(previous,frame);
    stable=d<.045?stable+1:0;
    if(stable>=3)break;
   }
   previous=frame;
  }

  if(stable<3){
   throw Error("Camera not stable");
  }

  status("DETECTING BOARD GEOMETRY");
  const geometry=detectBoard(frame);

  if(!geometry){
   throw Error("Board rings not detected");
  }

  board=geometry;
  calibrated=true;
  locked=true;

  $("zoomPanel").classList.add("hidden");
  $("calibrate").classList.add("hidden");

  emptyFrame=frame;
  referenceFrame=frame;
  previousFrame=null;

  visit=[];
  updateScores();
  drawOverlay();

  $("details").textContent=
   "Calibration complete | Zoom "+
   zoom.toFixed(1)+"× | Voice enabled";

  status("LIVE MONITORING");
  live("on","AUTOMATIC SCORING ACTIVE");
  message("Throw your first dart");

  speak("DARTIQ auto scoring ready. Game on.");

  startMonitoring();

 }catch(e){
  calibrated=false;
  board=null;
  drawOverlay();
  status("CALIBRATION FAILED");
  live("err","CALIBRATION ERROR");
  message(e.message);
  $("calibrate").disabled=false;
 }finally{
  calibrating=false;
 }
}

async function startCamera(){
 stopMonitoring();

 const token=++cameraToken;

 if(stream){
  stream.getTracks().forEach(t=>t.stop());
 }

 stream=null;
 video.srcObject=null;
 board=null;
 calibrated=false;
 calibrating=false;
 locked=false;

 visit=[];
 updateScores();

 $("zoomPanel").classList.remove("hidden");
 $("calibrate").classList.remove("hidden");
 $("calibrate").disabled=true;

 status("CONNECTING CAMERA");
 live("","SYSTEM IDLE");

 try{
  const s=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:{ideal:"environment"},
    width:{ideal:1280},
    height:{ideal:720}
   }
  });

  if(token!==cameraToken){
   s.getTracks().forEach(t=>t.stop());
   return;
  }

  stream=s;
  video.srcObject=s;
  await video.play();

  const scale=Math.min(
   1,480/Math.max(
    video.videoWidth,video.videoHeight
   )
  );

  W=Math.round(video.videoWidth*scale);
  H=Math.round(video.videoHeight*scale);

  canvas.width=W;
  canvas.height=H;

  $("resolution").textContent=
   video.videoWidth+" × "+video.videoHeight;
  $("cameraInfo").textContent="Camera active";

  resize();

  $("calibrate").disabled=false;
  status("READY FOR CALIBRATION");
  message("Remove all darts and adjust zoom");

 }catch(e){
  status("CAMERA ERROR");
  message(e.message);
 }
}

$("calibrate").onclick=calibrate;
$("restart").onclick=startCamera;

$("correct").onclick=()=>{
 if(!visit.length)return;
 $("correctValue").value=visit[visit.length-1].score;
 $("correction").classList.remove("hidden");
};

$("cancel").onclick=()=>{
 $("correction").classList.add("hidden");
};

$("save").onclick=()=>{
 if(!visit.length)return;

 const value=Number($("correctValue").value);
 if(!Number.isInteger(value)||value<0||value>60){
  message("Enter a valid score from 0 to 60");
  return;
 }

 visit[visit.length-1].score=value;
 visit[visit.length-1].label="Corrected "+value;

 updateScores();
 $("correction").classList.add("hidden");

 status("SCORE CORRECTED");
 speak(String(value));
};

window.addEventListener("resize",resize);

if(window.ResizeObserver){
 new ResizeObserver(resize).observe(app);
}

window.addEventListener("pagehide",()=>{
 stopMonitoring();
 cameraToken++;
 if(stream)stream.getTracks().forEach(t=>t.stop());
});

window.addEventListener("DOMContentLoaded",()=>{
 previewLoop();
 startCamera();
});
</script>
