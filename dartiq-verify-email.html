
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Verify Email | DARTIQ</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #071323;
  color: #ffffff;
  font-family: Arial, sans-serif;
}

.card {
  width: 100%;
  max-width: 460px;
  padding: 40px 25px;
  text-align: center;
  border-radius: 20px;
  border: 1px solid #1778b0;
  background: #10253d;
  box-shadow: 0 0 35px rgba(0, 191, 255, .12);
}

.logo {
  font-size: 42px;
  font-weight: 900;
  letter-spacing: 3px;
  color: #20c8ff;
  margin-bottom: 25px;
}

h1 {
  font-size: 25px;
  margin-bottom: 15px;
}

p {
  color: #c5d9e8;
  line-height: 1.6;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 17px;
  margin-top: 22px;
  background: #20c8ff;
  border: 0;
  border-radius: 10px;
  color: #071323;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.success { color: #69e6ac; }
.error { color: #ff9b9b; }

.small {
  font-size: 13px;
  margin-top: 25px;
}

a { color: #20c8ff; }
</style>
</head>
<body>

<main class="card">
  <div class="logo">DARTIQ</div>

  <h1 id="title">Verify your email</h1>

  <p id="message">
    Confirm your email address to complete
    your DARTIQ VIP Founder registration.
  </p>

  <button id="verifyButton" type="button">
    Verify My Email
  </button>

  <p class="small">
    No payment is required now.
  </p>
</main>

<script>
"use strict";

const VERIFY_ENDPOINT =
  "https://usglrseckxwcdykrwuvh.supabase.co/functions/v1/dartiq-verify-email";

const params = new URLSearchParams(
  window.location.search
);

const token = params.get("token") || "";

const button = document.getElementById(
  "verifyButton"
);

const title = document.getElementById("title");
const message = document.getElementById("message");

function showResult(heading, text, success) {
  title.textContent = heading;
  message.textContent = text;
  title.className = success ? "success" : "error";
  button.style.display = "none";
}

if (!/^[a-f0-9]{64}$/.test(token)) {
  showResult(
    "Invalid verification link",
    "Your verification link is missing or invalid.",
    false
  );
}

button.addEventListener("click", async () => {
  button.disabled = true;
  button.textContent = "Verifying...";

  try {
    const response = await fetch(
      VERIFY_ENDPOINT,
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ token })
      }
    );

    const result = await response.json();

    if (response.ok && result.verified === true) {
      showResult(
        "Email Verified!",
        "Your DARTIQ VIP Founder registration is confirmed. Welcome to DARTIQ!",
        true
      );
    } else {
      showResult(
        "Verification unsuccessful",
        result.error ||
          "This link may have expired or already been used.",
        false
      );
    }

  } catch (error) {
    title.textContent = "Connection error";
    message.textContent =
      "Unable to connect. Please try again.";
    button.disabled = false;
    button.textContent = "Try Again";
  }
});
</script>

</body>
</html>
