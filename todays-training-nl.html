<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>DARTIQ Today's AI Training NL</title>

<style>
:root{
  --bg:#030811;
  --panel:#081522;
  --panel2:#0b1b2c;
  --blue:#39a9ff;
  --text:#ffffff;
  --muted:#91a9bd;
  --line:rgba(57,169,255,.24);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100vh;
  background:#030811;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

body{
  padding:4px;
}

.app{
  width:100%;
  max-width:620px;
  margin:0 auto;
}

.hero{
  width:100%;
  background:
    radial-gradient(circle at 82% 0%,rgba(57,169,255,.11),transparent 38%),
    linear-gradient(180deg,#0c2037 0%,#07121f 100%);
  border:1px solid rgba(57,169,255,.28);
  border-radius:20px;
  padding:18px;
  box-shadow:
    0 8px 30px rgba(0,0,0,.28),
    0 0 20px rgba(57,169,255,.06),
    inset 0 1px 0 rgba(255,255,255,.03);
}

.kicker{
  margin:0 0 10px;
  color:var(--blue);
  font-size:11px;
  line-height:1.2;
  font-weight:900;
  letter-spacing:1.8px;
  text-transform:uppercase;
}

h1{
  margin:0;
  color:#fff;
  font-size:clamp(29px,7.5vw,40px);
  line-height:1.04;
  font-weight:900;
  letter-spacing:-.8px;
  overflow-wrap:break-word;
}

.focus{
  margin-top:10px;
  color:var(--blue);
  font-size:15px;
  line-height:1.42;
  font-weight:700;
  overflow-wrap:break-word;
}

.divider{
  width:100%;
  height:2px;
  margin:17px 0;
  border-radius:99px;
  background:linear-gradient(
    90deg,
    var(--blue) 0%,
    rgba(57,169,255,.42) 55%,
    rgba(57,169,255,.05) 100%
  );
}

.metrics{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
}

.metric{
  min-width:0;
  padding:12px 11px;
  min-height:82px;
  border-radius:14px;
  background:
    linear-gradient(180deg,rgba(16,36,58,.96),rgba(9,24,39,.96));
  border:1px solid rgba(57,169,255,.15);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
}

.label{
  margin-bottom:8px;
  color:var(--muted);
  font-size:9px;
  line-height:1.2;
  font-weight:900;
  letter-spacing:.85px;
  text-transform:uppercase;
}

.value{
  color:#fff;
  font-size:18px;
  line-height:1.22;
  font-weight:850;
  overflow-wrap:break-word;
}

.focus-card{
  margin-top:8px;
  padding:13px 14px;
  border-radius:14px;
  background:
    linear-gradient(180deg,rgba(16,36,58,.96),rgba(9,24,39,.96));
  border:1px solid rgba(57,169,255,.15);
}

.focus-card .label{
  margin-bottom:7px;
}

.focus-value{
  color:#fff;
  font-size:15px;
  line-height:1.42;
  font-weight:750;
  overflow-wrap:break-word;
}

.equipment{
  margin-top:8px;
  padding:13px 14px;
  border-radius:14px;
  background:
    linear-gradient(180deg,rgba(16,36,58,.96),rgba(9,24,39,.96));
  border:1px solid rgba(57,169,255,.15);
}

.equipment .label{
  margin-bottom:6px;
}

.equipment-value{
  color:#fff;
  font-size:14px;
  line-height:1.4;
  font-weight:750;
  overflow-wrap:break-word;
}

.hidden{
  display:none!important;
}

@media(max-width:430px){

  body{
    padding:3px;
  }

  .hero{
    padding:15px 13px;
    border-radius:17px;
  }

  .kicker{
    font-size:9.5px;
    letter-spacing:1.35px;
    margin-bottom:9px;
  }

  h1{
    font-size:30px;
    line-height:1.03;
  }

  .focus{
    margin-top:9px;
    font-size:13.5px;
    line-height:1.4;
  }

  .divider{
    margin:14px 0;
  }

  .metrics{
    gap:6px;
  }

  .metric{
    min-height:72px;
    padding:10px 9px;
    border-radius:12px;
  }

  .label{
    margin-bottom:6px;
    font-size:7.8px;
    letter-spacing:.55px;
  }

  .value{
    font-size:15px;
  }

  .focus-card,
  .equipment{
    margin-top:6px;
    padding:11px;
    border-radius:12px;
  }

  .focus-value{
    font-size:13.5px;
    line-height:1.38;
  }

  .equipment-value{
    font-size:13px;
  }
}

@media(max-width:350px){

  .hero{
    padding:13px 11px;
  }

  h1{
    font-size:27px;
  }

  .metric{
    padding:9px 7px;
  }

  .label{
    font-size:7px;
    letter-spacing:.35px;
  }

  .value{
    font-size:14px;
  }
}
</style>
</head>

<body>

<main class="app">

  <section class="hero">

    <div class="kicker">
      DARTIQ · AI TRAINING VAN VANDAAG
    </div>

    <h1 id="practice">
      Training
    </h1>

    <div class="focus" id="focus">
      Gerichte training
    </div>

    <div class="divider"></div>

    <div class="metrics">

      <div class="metric">
        <div class="label">
          Moeilijkheidsgraad
        </div>
        <div class="value" id="level">
          —
        </div>
      </div>

      <div class="metric">
        <div class="label">
          Duur
        </div>
        <div class="value" id="duration">
          —
        </div>
      </div>

      <div class="metric">
        <div class="label">
          Rondes
        </div>
        <div class="value" id="rounds">
          —
        </div>
      </div>

    </div>

    <div class="focus-card">
      <div class="label">
        Hoofdfocus
      </div>

      <div class="focus-value" id="focusCard">
        —
      </div>
    </div>

    <div class="equipment" id="equipmentWrap">

      <div class="label">
        Materiaal
      </div>

      <div class="equipment-value" id="equipment">
        —
      </div>

    </div>

  </section>

</main>

<script>
(function(){

  const p = new URLSearchParams(location.search);

  const get = (key,fallback='') => {
    const v = (p.get(key) || '').trim();
    return v || fallback;
  };

  const set = (id,value) => {
    const el = document.getElementById(id);
    if(el){
      el.textContent = value;
    }
  };

  const practice =
    get(
      'practice',
      get('drill','Training')
    );

  const focus =
    get('focus','');

  const level =
    get('level','—');

  const duration =
    get('duration','—');

  const rounds =
    get('rounds','—');

  const equipment =
    get(
      'equipment',
      get(
        'trainingequipment',
        get(
          'equipmentneeded',
          get('material','')
        )
      )
    );

  set(
    'practice',
    practice
  );

  set(
    'focus',
    focus || 'Gerichte training'
  );

  set(
    'focusCard',
    focus || '—'
  );

  set(
    'level',
    level
  );

  set(
    'duration',
    duration
  );

  set(
    'rounds',
    rounds
  );

  set(
    'equipment',
    equipment || '—'
  );

  if(!equipment){

    const equipmentWrap =
      document.getElementById('equipmentWrap');

    if(equipmentWrap){
      equipmentWrap.classList.add('hidden');
    }

  }

})();
</script>

</body>
</html>
