<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DARTIQ Today's AI Training NL</title>

<style>
:root{
  --bg:#050b18;
  --panel:#10243a;
  --panel2:#0d2136;
  --accent:#39a9ff;
  --text:#f4fbff;
  --muted:#9db8ce;
  --line:rgba(57,169,255,.24);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  width:100%;
  min-height:100%;
  background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  overflow-x:hidden;
}

body{
  padding:6px;
}

.wrap{
  width:100%;
  max-width:430px;
  margin:0 auto;
  padding:16px;

  border-radius:20px;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(57,169,255,.10),
      transparent 35%
    ),
    linear-gradient(
      180deg,
      #102844 0%,
      #081a2d 100%
    );

  border:1px solid rgba(57,169,255,.40);

  box-shadow:
    0 0 16px rgba(57,169,255,.18),
    inset 0 1px 0 rgba(255,255,255,.025);
}


/* =========================
   HEADER
========================= */

.header{
  padding:2px 2px 15px;
}

.kicker{
  font-size:10px;
  font-weight:900;
  letter-spacing:1.7px;
  color:var(--accent);
  text-transform:uppercase;
  margin-bottom:8px;
}

.header h1{
  margin:0;
  font-size:31px;
  line-height:1.05;
  font-weight:900;
  letter-spacing:-.5px;
  color:#fff;
  overflow-wrap:anywhere;
}

.subtitle{
  margin-top:8px;
  color:var(--accent);
  font-size:14px;
  line-height:1.4;
  font-weight:700;
  overflow-wrap:anywhere;
}

.divider{
  width:100%;
  height:2px;
  margin-top:15px;

  background:
    linear-gradient(
      90deg,
      var(--accent),
      rgba(57,169,255,.12)
    );

  border-radius:99px;

  box-shadow:
    0 0 8px rgba(57,169,255,.20);
}


/* =========================
   PRIMARY STATS
========================= */

.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-top:14px;
}

.card{
  min-width:0;
  padding:12px 10px;

  border-radius:13px;

  background:
    linear-gradient(
      180deg,
      #10243a,
      #0a1929
    );

  border:1px solid var(--line);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.02);
}

.label{
  color:var(--muted);
  font-size:9px;
  line-height:1.2;
  font-weight:900;
  letter-spacing:.7px;
  text-transform:uppercase;
}

.value{
  margin-top:7px;
  color:#fff;
  font-size:17px;
  line-height:1.2;
  font-weight:900;
  overflow-wrap:anywhere;
}


/* =========================
   MAIN FOCUS
========================= */

.main-focus{
  margin-top:8px;
  padding:13px 14px;

  border-radius:13px;

  background:
    linear-gradient(
      180deg,
      #10243a,
      #0a1929
    );

  border:1px solid var(--line);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.02);
}

.main-focus .value{
  margin-top:6px;
  font-size:15px;
  line-height:1.4;
  font-weight:800;
}


/* =========================
   EQUIPMENT
========================= */

.equipment{
  margin-top:8px;
  padding:13px 14px;

  border-radius:13px;

  background:
    linear-gradient(
      180deg,
      #10243a,
      #0a1929
    );

  border:1px solid var(--line);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.02);
}

.equipment .value{
  margin-top:6px;
  font-size:14px;
  line-height:1.4;
  font-weight:800;
}


/* =========================
   MOBILE
========================= */

@media(max-width:380px){

  body{
    padding:4px;
  }

  .wrap{
    padding:13px;
  }

  .header h1{
    font-size:28px;
  }

  .stats{
    gap:6px;
  }

  .card{
    padding:11px 8px;
  }

  .label{
    font-size:8px;
    letter-spacing:.5px;
  }

  .value{
    font-size:15px;
  }

  .main-focus .value{
    font-size:14px;
  }

}
</style>
</head>

<body>

<div class="wrap">

  <!-- HEADER -->

  <div class="header">

    <div class="kicker">
      DARTIQ · PRACTICE TRAINING
    </div>

    <h1 id="practice">
      Training
    </h1>

    <div
      class="subtitle"
      id="focus">
      Gerichte training
    </div>

    <div class="divider"></div>

  </div>


  <!-- MOEILIJKHEID / DUUR / RONDES -->

  <div class="stats">

    <div class="card">

      <div class="label">
        Moeilijkheid
      </div>

      <div
        class="value"
        id="level">
        --
      </div>

    </div>


    <div class="card">

      <div class="label">
        Duur
      </div>

      <div
        class="value"
        id="duration">
        --
      </div>

    </div>


    <div class="card">

      <div class="label">
        Rondes
      </div>

      <div
        class="value"
        id="rounds">
        --
      </div>

    </div>

  </div>


  <!-- HOOFDFOCUS -->

  <div class="main-focus">

    <div class="label">
      Hoofdfocus
    </div>

    <div
      class="value"
      id="focusCard">
      --
    </div>

  </div>


  <!-- MATERIAAL -->

  <div
    class="equipment"
    id="equipmentWrap">

    <div class="label">
      Materiaal
    </div>

    <div
      class="value"
      id="equipment">
      --
    </div>

  </div>

</div>


<script>

const params =
  new URLSearchParams(
    window.location.search
  );


function getValue(
  key,
  fallback
){

  const value =
    params.get(key);

  if(
    value === null ||
    String(value).trim() === ""
  ){
    return fallback;
  }

  try{

    return decodeURIComponent(
      String(value)
        .replace(/\+/g," ")
    ).trim();

  }catch(e){

    return String(value)
      .trim();

  }

}


/* =========================
   PARAMETERS
========================= */

const practice =
  getValue(
    "practice",
    getValue(
      "drill",
      "Training"
    )
  );


const duration =
  getValue(
    "duration",
    "--"
  );


const rounds =
  getValue(
    "rounds",
    "--"
  );


const level =
  getValue(
    "level",
    "--"
  );


const focus =
  getValue(
    "focus",
    "Gerichte training"
  );


const equipment =
  getValue(
    "equipment",
    ""
  );


/* =========================
   POPULATE SCREEN
========================= */

document
  .getElementById("practice")
  .textContent =
  practice;


document
  .getElementById("duration")
  .textContent =
  duration;


document
  .getElementById("rounds")
  .textContent =
  rounds;


document
  .getElementById("level")
  .textContent =
  level;


document
  .getElementById("focus")
  .textContent =
  focus;


document
  .getElementById("focusCard")
  .textContent =
  focus;


/* =========================
   EQUIPMENT
========================= */

if(equipment){

  document
    .getElementById("equipment")
    .textContent =
    equipment;

}else{

  document
    .getElementById("equipmentWrap")
    .style.display =
    "none";

}

</script>

</body>
</html>
