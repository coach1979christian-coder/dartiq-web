<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DARTIQ Today's AI Training NL</title>

<style>
:root{
  --bg:#03070d;
  --panel:#071523;
  --card:#0b1c2c;
  --card2:#0d2134;
  --blue:#39a9ff;
  --text:#ffffff;
  --muted:#8fa9bd;
  --line:rgba(57,169,255,.22);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  background:transparent;
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  padding:6px;
}

.training{
  width:100%;
  max-width:720px;
  margin:0 auto;
  background:
    radial-gradient(circle at 50% 0%,rgba(57,169,255,.10),transparent 45%),
    linear-gradient(180deg,#0a1a2a 0%,#050c14 100%);
  border:1px solid rgba(57,169,255,.38);
  border-radius:20px;
  padding:20px;
  box-shadow:
    0 0 22px rgba(57,169,255,.08),
    inset 0 1px 0 rgba(255,255,255,.025);
}

.eyebrow{
  margin:0 0 12px;
  color:var(--blue);
  font-size:12px;
  font-weight:800;
  letter-spacing:2.1px;
  text-transform:uppercase;
}

h1{
  margin:0;
  color:#fff;
  font-size:34px;
  line-height:1.03;
  font-weight:900;
  letter-spacing:-1px;
  overflow-wrap:break-word;
}

.description{
  margin:12px 0 0;
  color:var(--blue);
  font-size:16px;
  line-height:1.45;
  font-weight:700;
}

.divider{
  height:2px;
  margin:18px 0;
  border-radius:999px;
  background:linear-gradient(
    90deg,
    var(--blue),
    rgba(57,169,255,.18),
    transparent
  );
  box-shadow:0 0 8px rgba(57,169,255,.22);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:10px;
}

.stat{
  min-width:0;
  min-height:92px;
  padding:14px;
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);
  border-radius:15px;
}

.stat-label{
  margin-bottom:9px;
  color:#9cb4c6;
  font-size:10px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:1.35px;
  text-transform:uppercase;
}

.stat-value{
  color:#fff;
  font-size:19px;
  line-height:1.25;
  font-weight:800;
  overflow-wrap:break-word;
}

.focus{
  grid-column:1 / -1;
  min-height:auto;
}

.focus .stat-value{
  font-size:16px;
  line-height:1.4;
  font-weight:700;
}

.equipment{
  margin-top:10px;
  padding:14px;
  background:linear-gradient(180deg,var(--card2),var(--card));
  border:1px solid var(--line);
  border-radius:15px;
}

.equipment-label{
  margin-bottom:7px;
  color:#9cb4c6;
  font-size:10px;
  font-weight:800;
  letter-spacing:1.35px;
  text-transform:uppercase;
}

.equipment-value{
  color:#fff;
  font-size:15px;
  line-height:1.4;
  font-weight:700;
  overflow-wrap:break-word;
}

@media(max-width:520px){

  body{
    padding:3px;
  }

  .training{
    padding:16px;
    border-radius:17px;
  }

  .eyebrow{
    margin-bottom:10px;
    font-size:10px;
    letter-spacing:1.55px;
  }

  h1{
    font-size:30px;
  }

  .description{
    margin-top:10px;
    font-size:14px;
    line-height:1.4;
  }

  .divider{
    margin:15px 0;
  }

  .stats{
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:7px;
  }

  .stat{
    min-height:80px;
    padding:11px;
    border-radius:13px;
  }

  .stat-label{
    margin-bottom:7px;
    font-size:8px;
    letter-spacing:.8px;
  }

  .stat-value{
    font-size:16px;
  }

  .focus{
    grid-column:1 / -1;
  }

  .focus .stat-value{
    font-size:14px;
    line-height:1.35;
  }

  .equipment{
    margin-top:7px;
    padding:11px;
    border-radius:13px;
  }

  .equipment-label{
    font-size:8px;
    letter-spacing:.8px;
  }

  .equipment-value{
    font-size:14px;
  }
}

@media(max-width:360px){

  .training{
    padding:14px;
  }

  h1{
    font-size:27px;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .focus{
    grid-column:1 / -1;
  }
}
</style>
</head>

<body>

<div class="training">

  <div class="eyebrow">
    DARTIQ · AI TRAINING VAN VANDAAG
  </div>

  <h1 id="drill">
    Training
  </h1>

  <div class="description" id="objective">
    Gerichte training
  </div>

  <div class="divider"></div>

  <div class="stats">

    <div class="stat">
      <div class="stat-label">Moeilijkheidsgraad</div>
      <div class="stat-value" id="level">—</div>
    </div>

    <div class="stat">
      <div class="stat-label">Duur</div>
      <div class="stat-value" id="duration">—</div>
    </div>

    <div class="stat">
      <div class="stat-label">Rondes</div>
      <div class="stat-value" id="rounds">—</div>
    </div>

    <div class="stat focus">
      <div class="stat-label">Hoofdfocus</div>
      <div class="stat-value" id="focus">—</div>
    </div>

  </div>

  <div class="equipment">
    <div class="equipment-label">Materiaal</div>
    <div class="equipment-value" id="equipment">—</div>
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);

function getParam(...names){
  for(const name of names){
    const value = params.get(name);

    if(
      value !== null &&
      value !== undefined &&
      value.trim() !== "" &&
      value.toLowerCase() !== "null" &&
      value.toLowerCase() !== "undefined"
    ){
      return decodeURIComponent(value.replace(/\+/g," "));
    }
  }

  return "";
}

function setText(id,value,fallback="—"){
  const el = document.getElementById(id);

  if(el){
    el.textContent = value || fallback;
  }
}

const drill = getParam(
  "drill",
  "practice",
  "training"
);

const objective = getParam(
  "objective"
);

const level = getParam(
  "level",
  "difficulty"
);

const duration = getParam(
  "duration"
);

const rounds = getParam(
  "rounds"
);

const focus = getParam(
  "focus"
);

const equipment = getParam(
  "equipment",
  "trainingequipment",
  "equipmentneeded",
  "material"
);

setText(
  "drill",
  drill,
  "Training"
);

setText(
  "objective",
  objective,
  "Gerichte training"
);

setText(
  "level",
  level
);

setText(
  "duration",
  duration
);

setText(
  "rounds",
  rounds
);

setText(
  "focus",
  focus
);

setText(
  "equipment",
  equipment
);
</script>

</body>
</html>
