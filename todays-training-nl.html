<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>DARTIQ AI Training van Vandaag</title>

<style>
:root{
  --bg:#030811;
  --panel:#081522;
  --panel2:#0b1b2c;
  --blue:#39a9ff;
  --text:#ffffff;
  --muted:#91a9bd;
  --line:rgba(57,169,255,.22);
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% 0%,rgba(57,169,255,.10),transparent 32%),
    linear-gradient(180deg,#06101c,#030811);
}

.app{
  width:100%;
  max-width:620px;
  margin:0 auto;
  padding:6px;
}

.hero{
  width:100%;
  background:
    radial-gradient(circle at 85% 0%,rgba(57,169,255,.11),transparent 34%),
    linear-gradient(180deg,#0b1d31,#07131f);
  border:1px solid var(--line);
  border-radius:18px;
  padding:15px 13px 13px;
  box-shadow:
    0 0 22px rgba(57,169,255,.06),
    inset 0 1px 0 rgba(255,255,255,.025);
}

.kicker{
  color:var(--blue);
  font-size:10px;
  line-height:1.2;
  font-weight:900;
  letter-spacing:1.6px;
  text-transform:uppercase;
  margin-bottom:8px;
}

h1{
  margin:0;
  padding:0;
  font-size:29px;
  line-height:1.05;
  font-weight:900;
  letter-spacing:-.4px;
  color:#fff;
  overflow-wrap:anywhere;
}

.focus{
  margin-top:7px;
  color:var(--blue);
  font-size:13.5px;
  line-height:1.4;
  font-weight:700;
  overflow-wrap:anywhere;
}

.divider{
  width:100%;
  height:1px;
  margin:13px 0 11px;
  background:linear-gradient(
    90deg,
    rgba(57,169,255,.9),
    rgba(57,169,255,.08)
  );
}

.meta{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.meta-box{
  min-width:0;
  min-height:72px;
  padding:10px 11px;
  border-radius:12px;
  background:linear-gradient(180deg,#0e2136,#091725);
  border:1px solid rgba(57,169,255,.14);
}

.meta-label{
  color:var(--muted);
  font-size:9px;
  line-height:1.2;
  font-weight:900;
  letter-spacing:.9px;
  text-transform:uppercase;
  margin-bottom:6px;
}

.meta-value{
  color:#fff;
  font-size:17px;
  line-height:1.25;
  font-weight:900;
  overflow-wrap:anywhere;
}

.focus-box .meta-value{
  font-size:14px;
  line-height:1.35;
}

.equipment{
  display:block;
  width:100%;
  margin-top:7px;
  padding:10px 11px;
  border-radius:12px;
  background:linear-gradient(180deg,#0e2136,#091725);
  border:1px solid rgba(57,169,255,.14);
}

.equipment .meta-label{
  margin-bottom:5px;
}

.equipment .meta-value{
  font-size:13.5px;
  line-height:1.4;
  font-weight:800;
  color:#fff;
}

@media(max-width:360px){

  .app{
    padding:4px;
  }

  .hero{
    padding:13px 11px 11px;
  }

  h1{
    font-size:26px;
  }

  .meta{
    gap:6px;
  }

  .meta-box{
    padding:9px;
  }

  .meta-value{
    font-size:15px;
  }

  .focus-box .meta-value{
    font-size:13px;
  }
}
</style>
</head>

<body>

<main class="app">

  <section class="hero">

    <div class="kicker">
      DARTIQ · AI TRAINING VAN VANDAAG
    </div>

    <h1 id="practice">
      Training
    </h1>

    <div class="focus" id="focus">
      Gerichte training
    </div>

    <div class="divider"></div>

    <div class="meta">

      <div class="meta-box">
        <div class="meta-label">
          Moeilijkheidsgraad
        </div>

        <div class="meta-value" id="level">
          —
        </div>
      </div>


      <div class="meta-box">
        <div class="meta-label">
          Duur
        </div>

        <div class="meta-value" id="duration">
          —
        </div>
      </div>


      <div class="meta-box">
        <div class="meta-label">
          Rondes
        </div>

        <div class="meta-value" id="rounds">
          —
        </div>
      </div>


      <div class="meta-box focus-box">
        <div class="meta-label">
          Hoofdfocus
        </div>

        <div class="meta-value" id="focusCard">
          —
        </div>
      </div>

    </div>


    <div class="equipment">

      <div class="meta-label">
        Materiaal
      </div>

      <div class="meta-value" id="equipment">
        —
      </div>

    </div>

  </section>

</main>


<script>
(function(){

  const params = new URLSearchParams(window.location.search);


  function getValue(keys,fallback){

    for(const key of keys){

      const raw = params.get(key);

      if(raw !== null){

        const value = raw.trim();

        if(value !== ""){
          return value;
        }

      }

    }

    return fallback;

  }


  function setText(id,value){

    const element = document.getElementById(id);

    if(element){
      element.textContent = value;
    }

  }


  const practice = getValue(
    [
      "practice",
      "drill"
    ],
    "Training"
  );


  const focus = getValue(
    [
      "focus"
    ],
    "Gerichte training"
  );


  const level = getValue(
    [
      "level",
      "grade"
    ],
    "—"
  );


  const duration = getValue(
    [
      "duration"
    ],
    "—"
  );


  const rounds = getValue(
    [
      "rounds"
    ],
    "—"
  );


  const equipment = getValue(
    [
      "equipment",
      "trainingequipment",
      "equipmentnl",
      "material",
      "materiaal"
    ],
    "—"
  );


  setText(
    "practice",
    practice
  );


  setText(
    "focus",
    focus
  );


  setText(
    "focusCard",
    focus
  );


  setText(
    "level",
    level
  );


  setText(
    "duration",
    duration
  );


  setText(
    "rounds",
    rounds
  );


  setText(
    "equipment",
    equipment
  );

})();
</script>

</body>
</html>
