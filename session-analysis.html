<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DARTIQ Session Analysis</title>
<style>
:root{
  --bg:#07090d;
  --panel:#0d1118;
  --panel-2:#111722;
  --text:#f7f9fc;
  --muted:#8f99a8;
  --line:rgba(255,255,255,.08);
  --blue:#4ea7ff;
  --purple:#9e7cff;
  --orange:#ff9a45;
  --green:#62dca5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,Arial,sans-serif;
  overflow-x:hidden;
}
body{
  padding:10px 10px 16px;
}
.wrap{
  width:100%;
  max-width:430px;
  margin:0 auto;
}

/* Compact session strip */
.session-strip{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px;
}
.session-meta{
  display:flex;
  gap:7px;
  align-items:center;
  flex-wrap:wrap;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}
.session-meta .sep{opacity:.35}
.bo{
  padding:6px 9px;
  border-radius:999px;
  border:1px solid rgba(78,167,255,.25);
  background:rgba(78,167,255,.08);
  color:#dcecff;
  font-size:10px;
  font-weight:950;
  letter-spacing:.5px;
}

/* Hero */
.hero{
  display:grid;
  grid-template-columns:112px 1fr;
  gap:9px;
  margin-bottom:10px;
}
.score-card,
.grade-card,
.stats-card,
.coach-card,
.action-card{
  background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.018));
  border:1px solid var(--line);
  border-radius:15px;
}
.score-card{
  padding:12px;
  min-height:96px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.grade-card{
  padding:12px 14px;
  min-height:96px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.label{
  font-size:8px;
  line-height:1.2;
  letter-spacing:1.1px;
  color:var(--muted);
  text-transform:uppercase;
  font-weight:900;
}
.score{
  margin-top:7px;
  font-size:44px;
  line-height:.9;
  font-weight:1000;
  letter-spacing:-1.5px;
}
.grade{
  margin-top:6px;
  font-size:18px;
  line-height:1.15;
  font-weight:950;
}

/* Stats */
.stats-card{
  padding:11px;
  margin-bottom:10px;
}
.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:9px;
}
.card-head .title{
  font-size:9px;
  letter-spacing:1.4px;
  color:var(--muted);
  text-transform:uppercase;
  font-weight:950;
}
.stats{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:6px;
}
.stat{
  min-width:0;
  text-align:center;
  padding:9px 5px;
  border-radius:10px;
  background:rgba(255,255,255,.023);
  border:1px solid rgba(255,255,255,.055);
}
.stat-label{
  font-size:7px;
  color:var(--muted);
  letter-spacing:.75px;
  text-transform:uppercase;
  font-weight:900;
}
.stat-value{
  margin-top:5px;
  font-size:18px;
  font-weight:950;
}

/* Coach card */
.coach-card{
  margin-bottom:10px;
  overflow:hidden;
}
.coach-top{
  display:flex;
  gap:10px;
  align-items:flex-start;
  padding:12px 12px 10px;
}
.icon{
  width:32px;
  height:32px;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex:0 0 auto;
  font-size:15px;
}
.icon.purple{
  background:rgba(158,124,255,.10);
  border:1px solid rgba(158,124,255,.18);
}
.icon.orange{
  background:rgba(255,154,69,.10);
  border:1px solid rgba(255,154,69,.18);
}
.focus{
  margin-top:3px;
  font-size:16px;
  line-height:1.25;
  font-weight:950;
}
.row{
  padding:10px 12px;
  border-top:1px solid var(--line);
}
.row-title{
  font-size:8px;
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:950;
}
.row-title.purple{color:#c7b9ff}
.row-title.blue{color:#a9d3ff}
.copy{
  margin-top:4px;
  font-size:12px;
  line-height:1.45;
  color:#e6e9ee;
  font-weight:650;
}

/* Action */
.action-card{
  padding:12px;
}
.action-top{
  display:flex;
  gap:10px;
  align-items:flex-start;
}
.drill{
  margin-top:3px;
  font-size:16px;
  line-height:1.25;
  font-weight:950;
}
.chips{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-top:7px;
}
.chip{
  padding:5px 8px;
  border-radius:999px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.025);
  color:#dfe4ea;
  font-size:9px;
  font-weight:850;
}
.improve{
  margin-top:10px;
  padding:9px 10px;
  border-radius:10px;
  background:rgba(98,220,165,.055);
  border:1px solid rgba(98,220,165,.12);
}
.improve-title{
  font-size:8px;
  color:#acefce;
  letter-spacing:1px;
  text-transform:uppercase;
  font-weight:950;
}
.improve-value{
  margin-top:4px;
  font-size:12px;
  line-height:1.35;
  font-weight:850;
}
details{
  margin-top:10px;
  padding-top:10px;
  border-top:1px solid var(--line);
}
summary{
  cursor:pointer;
  list-style:none;
  font-size:9px;
  letter-spacing:1px;
  color:var(--muted);
  text-transform:uppercase;
  font-weight:900;
}
summary::-webkit-details-marker{display:none}
summary:after{content:" +";color:#fff}
details[open] summary:after{content:" −"}
.footer{
  padding-top:11px;
  text-align:center;
  color:#626b77;
  font-size:7px;
  letter-spacing:1.5px;
  font-weight:900;
  text-transform:uppercase;
}
.hidden{display:none!important}

@media(max-width:360px){
  body{padding-left:8px;padding-right:8px}
  .hero{grid-template-columns:102px 1fr}
  .score{font-size:40px}
}
</style>
</head>
<body>
<main class="wrap">

  <section class="session-strip">
    <div class="session-meta">
      <span id="date"></span>
      <span class="sep" id="sep">•</span>
      <span id="sessiontype">Match</span>
    </div>
    <div class="bo" id="matchformat"></div>
  </section>

  <section class="hero">
    <div class="score-card">
      <div class="label">AI Coach Score</div>
      <div class="score" id="score">--</div>
    </div>
    <div class="grade-card">
      <div class="label">Session Grade</div>
      <div class="grade" id="grade">--</div>
    </div>
  </section>

  <section class="stats-card">
    <div class="card-head">
      <div class="title">Performance</div>
      <div>📊</div>
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-label">Average</div><div class="stat-value" id="average">--</div></div>
      <div class="stat"><div class="stat-label">First 9</div><div class="stat-value" id="first9">--</div></div>
      <div class="stat"><div class="stat-label">Checkout</div><div class="stat-value" id="checkoutpct">--</div></div>
      <div class="stat"><div class="stat-label">180s</div><div class="stat-value" id="total180">0</div></div>
      <div class="stat"><div class="stat-label">140+</div><div class="stat-value" id="total140">0</div></div>
      <div class="stat"><div class="stat-label">100+</div><div class="stat-value" id="total100">0</div></div>
    </div>
  </section>

  <section class="coach-card" id="coach-card">
    <div class="coach-top" id="focus-block">
      <div class="icon purple">🎯</div>
      <div>
        <div class="label">Main Focus</div>
        <div class="focus" id="focus"></div>
      </div>
    </div>

    <div class="row" id="insight-block">
      <div class="row-title purple">AI Insight</div>
      <div class="copy" id="insight"></div>
    </div>

    <div class="row" id="advice-block">
      <div class="row-title blue">Coach Advice</div>
      <div class="copy" id="advice"></div>
    </div>
  </section>

  <section class="action-card" id="action-card">
    <div class="action-top">
      <div class="icon orange">🔥</div>
      <div>
        <div class="label">Your Next Action</div>
        <div class="drill" id="drill"></div>
        <div class="chips">
          <span class="chip" id="duration"></span>
          <span class="chip" id="level"></span>
        </div>
      </div>
    </div>

    <div class="improve" id="improve-block">
      <div class="improve-title">Improvement Potential</div>
      <div class="improve-value" id="improvement"></div>
    </div>

    <details id="why-block">
      <summary>Why this matters</summary>
      <div class="copy" id="why"></div>
    </details>
  </section>

  <div class="footer">Built with players • Powered by DARTIQ AI</div>
</main>

<script>
const params = new URLSearchParams(location.search);

function get(...keys){
  for(const key of keys){
    const raw = params.get(key);
    if(raw !== null){
      const v = decodeURIComponent(String(raw).replace(/\+/g,' ')).trim();
      if(v && v !== '...' && v !== '…') return v;
    }
  }
  return '';
}

function put(id, value, fallback=''){
  const el = document.getElementById(id);
  if(el) el.textContent = value || fallback;
}

const values = {
  date:get('date'),
  sessiontype:get('sessiontype','type') || 'Match',
  matchformat:get('matchformat','format','bo'),
  score:get('score'),
  grade:get('grade'),
  average:get('average'),
  first9:get('first9'),
  checkoutpct:get('checkoutpct','checkout'),
  total180:get('total180') || '0',
  total140:get('total140') || '0',
  total100:get('total100') || '0',
  focus:get('focus'),
  insight:get('insight'),
  advice:get('advice'),
  drill:get('drill'),
  duration:get('duration'),
  level:get('level'),
  improvement:get('improvement'),
  why:get('why')
};

put('date',values.date);
put('sessiontype',values.sessiontype,'Match');
put('matchformat',values.matchformat);
put('score',values.score,'--');
put('grade',values.grade,'--');
put('average',values.average,'--');
put('first9',values.first9,'--');
put('checkoutpct',values.checkoutpct,'--');
put('total180',values.total180,'0');
put('total140',values.total140,'0');
put('total100',values.total100,'0');
put('focus',values.focus);
put('insight',values.insight);
put('advice',values.advice);
put('drill',values.drill);
put('duration',values.duration);
put('level',values.level);
put('improvement',values.improvement);
put('why',values.why);

if(!values.date){
  document.getElementById('date').classList.add('hidden');
  document.getElementById('sep').classList.add('hidden');
}
if(!values.matchformat) document.getElementById('matchformat').classList.add('hidden');

if(!values.focus) document.getElementById('focus-block').classList.add('hidden');
if(!values.insight) document.getElementById('insight-block').classList.add('hidden');
if(!values.advice) document.getElementById('advice-block').classList.add('hidden');
if(!values.focus && !values.insight && !values.advice) document.getElementById('coach-card').classList.add('hidden');

if(!values.duration) document.getElementById('duration').classList.add('hidden');
if(!values.level) document.getElementById('level').classList.add('hidden');
if(!values.improvement) document.getElementById('improve-block').classList.add('hidden');
if(!values.why) document.getElementById('why-block').classList.add('hidden');
if(!values.drill && !values.duration && !values.level && !values.improvement && !values.why){
  document.getElementById('action-card').classList.add('hidden');
}
</script>
</body>
</html>
